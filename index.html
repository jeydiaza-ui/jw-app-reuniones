#timerbox .tbig{font-family:Georgia,serif;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}

#timerbox .tmini{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

#timerbox .ttitle{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerbox .tclose{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px;cursor:pointer}
@media print{body:has(#printOverlay) > *:not(#printOverlay){display:none !important}#printOverlay{position:static !important;padding:0 !important}.print-toolbar{display:none !important}}

/* ============ DISCURSO 1 — NUEVA ESTRUCTURA ============
   Cada punto tiene UN texto bíblico principal (literal) y notas de apoyo (paráfrasis). */
var DISCURSO_T1 = {
  title:"Jehová es un juez justo y misericordioso",
  duration:10,
  intro:"Hermanos, ¿les ha pasado que alguien se alegra cuando a nosotros nos va mal? Duele, ¿verdad? Duele más cuando quien se alegra es alguien que se decía amigo, o un vecino, o un familiar. Esta semana la lectura es Jeremías 47 y 48. El capítulo 47 es muy corto: habla del juicio de Jehová contra los filisteos. Y el capítulo 48 es el más largo de todo el libro: un mensaje completo contra Moab. Y Moab tenía una característica muy fea: se burlaba de Judá. Se alegraba de ver a Jerusalén destruida. Jehová lo vio todo, y lo registró. Pero en ese mismo capítulo hay algo que nos sorprende: cuando parece que solo queda juicio, aparece la misericordia de Jehová. Por eso el tema de hoy es: Jehová es un juez justo y misericordioso. Vamos a ver tres cosas: primero, que Jehová ve cómo tratamos a su pueblo; segundo, que el orgullo siempre termina en ruina; y tercero, que la misericordia de Jehová nos motiva a advertir a la gente ahora.",
  desarrollo:[
    {
      titulo:"Primer punto: Jehová ve cómo tratamos a su pueblo",
      texto:{
        ref:"Jer 48:27",
        intro:"Ubiquémonos primero. Moab era un pueblo vecino de Israel, al este del mar Muerto. Venía de Lot, el sobrino de Abrahán. O sea, eran parientes cercanos. No eran desconocidos ni extranjeros lejanos: compartían historia, idioma y frontera. Y precisamente por eso duele más lo que hicieron. Cuando en el año 607 antes de nuestra era los babilonios destruyeron Jerusalén, Moab no se puso de luto. Al contrario: se burló. Y fíjense en el detalle que Jehová registra por medio de Jeremías.",
        lectura:"«¿No era Israel objeto de burla para ti? ¿Acaso lo sorprendieron entre ladrones como para que hables en su contra y menees la cabeza?».",
        explicacion:"La imagen es muy gráfica. Cuando alguien atrapa a un ladrón, todos se ríen de él, lo señalan y menean la cabeza: «te lo merecías». Eso era lo que hacía Moab con Israel: lo trataba como a un delincuente sorprendido con las manos en la masa. Moab no reconoció nada. No dijo: «Es cierto, Judá se portó mal con Jehová, y esto es su castigo». Dijo: «¡Mira! La casa de Judá es como todas las otras naciones». En otras palabras: «su Dios no es diferente de los nuestros; no hay nada especial en ellos». Esa era la burla. Y Jehová lo escuchó."
      },
      apoyo:"La obra Perspicacia, en el artículo «Moab, moabitas» párrafo 22, explica que la profecía de Jeremías señaló el tiempo en que Jehová se valdría de los babilonios, acaudillados por Nabucodonosor, para pedir cuentas a Moab. Muchas ciudades moabitas iban a quedar completamente desoladas. Y aquí viene la clave: los moabitas dijeron «La casa de Judá es como todas las otras naciones» porque no reconocieron que aquel juicio era realmente de Dios y que los israelitas eran su pueblo. Por eso ellos mismos llegarían a conocer a Jehová, no como el Dios al que amaban, sino como el Juez que no se deja burlar (Ezequiel 25:8-11).",
      leccion:"Jehová ve cómo tratamos a su pueblo. Y no olvida. Si hoy alguien se burla de una prueba que estamos viviendo, Jehová lo escucha. Pero hay algo más importante: también escucha cuando nosotros somos quien se burla o se alegra. Nunca deberíamos ser como Moab."
    },
    {
      titulo:"Segundo punto: El orgullo siempre termina en ruina",
      texto:{
        ref:"Jer 48:29",
        intro:"¿Y por qué se burlaba Moab? ¿Qué había detrás de esa burla? Jeremías lo dice sin rodeos en el versículo 29. Y note que para describirlo se usan cuatro palabras seguidas, casi como si una no bastara: orgulloso, soberbio, arrogancia, orgullo, soberbia, altanería. El texto insiste porque el problema era grave.",
        lectura:"«Hemos oído de lo orgulloso que es Moab —tan soberbio—, de su arrogancia, su orgullo, su soberbia y de la altanería de su corazón».",
        explicacion:"Fíjense en lo que Moab tenía de dónde presumir. El versículo 7 dice: «Por confiar en tus obras y en tus tesoros, tú también serás conquistada». Confiaban en sus obras —lo que habían construido, sus ciudades fortificadas— y en sus tesoros. Y el versículo 11 añade una imagen que lo explica todo: «Los moabitas han estado tranquilos desde su juventud, como el vino que se deja reposar sobre sus sedimentos. No los han pasado de una vasija a otra, y nunca han ido al destierro. Por eso su sabor sigue siendo el mismo y su aroma no ha cambiado». Moab nunca había sido sacudido. Nunca había pasado por el destierro. Y eso, en vez de hacerlo agradecido, lo hizo orgulloso. Por eso el versículo 42 dice la razón real del juicio: «porque es contra Jehová contra quien se ha engrandecido»."
      },
      apoyo:"El vino que descansa demasiado sobre sus sedimentos se vuelve intomable: se asienta, no se puede ni trasvasar sin echar a perder el sabor. Así era Moab. La tranquilidad, en lugar de acercarlo a Jehová, lo endureció. Y esto es un espejo para nosotros. Podemos tener años en la verdad, una vida cómoda, una familia estable, una congregación tranquila… y empezar a creer que somos algo. Pero el orgullo nunca se queda quieto: crece. Y cuando crece, nos hace ver a los demás por encima del hombro, igual que Moab miraba a Judá.",
      leccion:"El orgullo siempre termina en ruina. Y el remedio no es tener más, sino recordar de quién lo hemos recibido todo. Como dijo Pablo: «¿qué tienes tú que no hayas recibido?» (1 Corintios 4:7)."
    },
    {
      titulo:"Tercer punto: La misericordia de Jehová nos motiva a advertir",
      texto:{
        ref:"Jer 48:47",
        intro:"Ahora llegamos a la parte que nos deja sin palabras. Estamos en el último versículo del capítulo más largo de juicio del libro de Jeremías. Después de veintiséis versículos anunciando destrucción, Jehová dice esto.",
        lectura:"«Pero reuniré a los cautivos de Moab en la parte final de los días —afirma Jehová—. Aquí termina el juicio contra Moab».",
        explicacion:"Moab no fue destruido para siempre. Jehová anunció que en «la parte final de los días» reuniría a sus cautivos. La profecía lo cumplió siglos después: Ciro, el conquistador de Babilonia, permitió que los exiliados moabitas regresaran a su tierra natal. Pero hay algo aún más conmovedor. Miren los versículos 31 y 36: «Por eso lloraré por Moab, gritaré por causa de todo Moab y gemiré por los hombres de Quir-Heres». «Por eso mi corazón gemirá por Moab como una flauta […] Porque las riquezas que ha producido se acabarán». ¿Quién llora aquí? Jehová. El Juez llora por el pueblo que va a castigar. Eso es lo que significa ser un juez justo y misericordioso."
      },
      apoyo:"Quizá alguien pregunte: ¿y esto qué tiene que ver conmigo? Mucho. La Atalaya de mayo de 2024, página 17 párrafo 10, lo explica. Es posible que Jehová decida salvar a quienes cambien de opinión al ver la destrucción de Babilonia la Grande. Esa posibilidad nos ayuda a entender lo urgente que es que sigamos advirtiendo a la gente. Pensemos: lo que les decimos ahora será lo que tal vez recuerden en el futuro. Puede ser que nuestras advertencias les vuelvan a la memoria y decidan servir a Jehová junto con nosotros antes de que sea demasiado tarde. Tal como el carcelero de Filipos solo aceptó la verdad cuando hubo un terremoto muy grande, quizás haya personas que no la acepten ahora pero sí lo hagan cuando el «terremoto» de la destrucción de Babilonia la Grande sacuda al mundo (Hechos 16:25-34).",
      leccion:"La misericordia de Jehová nos motiva a hacer algo ahora: seguir predicando. No sabemos quién va a reaccionar. Pero sí sabemos que Jehová no se complace en la muerte de nadie, y que quiere que todos tengan la oportunidad de cambiar."
    }
  ],
  aplicacion:"Hermanos, tres preguntas para llevarnos esta semana. Primera: ¿me he alegrado alguna vez de que a otro hermano le vaya mal, o de que pierda un privilegio? Si la respuesta es sí, acordémonos de Moab. Jehová lo vio. Y no le agradó. Segunda: ¿en qué estoy confiando realmente? ¿En mi experiencia, en mis años en la verdad, en mi posición, o en Jehová? Moab confiaba en sus obras y sus tesoros, y eso lo perdió. Tercera: ¿sigo advirtiendo a la gente con la misma urgencia? La misericordia de Jehová hacia Moab me recuerda que quizás alguien que hoy me rechaza reaccione mañana. No nos cansemos.",
  conclusion:"Jehová es un juez justo: no pasa por alto la burla ni el orgullo. Pero es también misericordioso: hasta para Moab hubo un «después». Y nos dio a nosotros el privilegio de avisar. Que nunca seamos como Moab, que se burló. Que aprendamos a mirar a los demás como Jehová los mira. Y que sigamos predicando, porque quizás la persona que hoy nos cierra la puerta mañana recuerde lo que le dijimos. Como dice el Salmo 145:14, «Jehová sostiene a todos los que están a punto de caer». Él sigue siendo justo y misericordioso. Sigamos confiando en él."
};

var PERLA1={
  q:"Jer 48:6. ¿En qué sentido llegaron a ser los moabitas «como un enebro en el desierto»?",
  verses:[{t:"Jer 48:6",u:bible(24,48)}],
  pubs:[{t:"Perspicacia «Enebro» núm. 2",u:pc("/4/0")}],
  found:[
    "Perspicacia, «Enebro», núm. 2: La palabra hebrea ʽaroh·ʽér o ʽar·ʽár se traduce «enebro». Con toda probabilidad se trata del Juniperus phoenicia, un arbolillo o arbusto que se halla en la región del Sinaí y también en el desierto de Edom. La raíz hebrea de la que se deriva el nombre conlleva la idea de «desnudez» o de estar «despojado».",
    "Perspicacia añade que es un arbusto de apariencia algo triste que crece en zonas rocosas del desierto y en peñascos, es decir, un árbol solitario en una llanura desértica.",
    "Jeremías 48:6: «¡Corran, huyan por su vida! Tienen que llegar a ser como un enebro en el desierto».",
    "El contexto: en el versículo 5 la gente llora sin parar mientras sube a Luhit; en el 7 se explica la causa: «Por confiar en tus obras y en tus tesoros, tú también serás conquistada»."
  ],
  draft:"La comparación con un enebro del desierto describe la soledad absoluta de Moab. Ese arbusto sobrevive solo, sin nada alrededor, en medio de peñascos y regiones áridas, y tiene un aspecto triste y despojado. Así llegarían a ser los moabitas: despoblados, despojados de todo, cada uno huyendo solo y sobreviviendo como puede. Jeremías 48:7 da la razón: confiaron en sus obras y en sus tesoros en vez de en Jehová. Y cuando llegó el juicio, no quedó nada de su prosperidad; solo quedó el desierto."
};
var PERLA2_Q="¿Qué perlas espirituales ha encontrado en la lectura bíblica de esta semana?";

var PUNTOS=[
 {v:"Jer 48:10",vu:bible(24,48),idea:"Jehová llama maldito al que hace su trabajo «sin ganas» y al que se retrae de cumplir con decisión.",fuentes:["j48"],ref:"Biblia de estudio, Jer 48:10.",aprendemos:"Jehová valora el celo y la responsabilidad, no la comodidad.",aplicar:"Es llamativo que la primera «perla» del capítulo no hable de Moab, sino de cómo se hace el trabajo de Jehová. Él no quería soldados tibios. Hoy nosotros no vamos a blandir una espada, pero sí tenemos una asignación: predicar, pastorear, apoyar a los hermanos. ¿La cumplimos con ganas o con desgana? Jehová se complace en el servicio de todo corazón. Y nos recuerda algo valioso: la comodidad nunca es excusa para hacer las cosas a medias."},
 {v:"Jer 48:11",vu:bible(24,48),idea:"Moab es como vino que nunca se ha trasegado: nunca fue sacudido, y por eso conservó su mismo sabor y aroma.",fuentes:["j48"],ref:"Biblia de estudio, Jer 48:11.",aprendemos:"No pasar por dificultades puede volvernos espiritualmente insípidos.",aplicar:"El vino que reposa demasiado sobre sus sedimentos se estanca y termina sabiendo mal. Y no es que las pruebas sean buenas en sí mismas; es que nos sacuden, nos obligan a mirar a Jehová y nos muestran lo que de verdad hay en nuestro corazón. Cuando nunca se nos corrige, cuando todo nos sale bien durante años, corremos el riesgo de acomodarnos. Las pruebas, bien llevadas, nos despiertan. Cuando lleguen, no huyamos de ellas: preguntémonos qué quiere enseñarnos Jehová."},
 {v:"Jer 48:13",vu:bible(24,48),idea:"Moab se avergonzaría de Kemós, su dios, tal como Israel se avergonzó de Betel, su falsa confianza.",fuentes:["j48"],ref:"Biblia de estudio, Jer 48:13.",aprendemos:"Toda confianza fuera de Jehová acaba avergonzando.",aplicar:"Kemós era el dios principal de Moab; Betel, el santuario donde Israel puso su confianza después del cisma. Los dos fracasaron. ¿Y qué es hoy nuestro «Kemós»? Puede ser el dinero, un trabajo estable, la salud, la nacionalidad, una relación. Nada de eso es malo, pero ninguno puede salvarnos. Poner la confianza en algo que no es Jehová siempre termina en la misma palabra: avergonzados. Mejor es depositar hoy la confianza donde nunca falla."},
 {v:"Jer 48:27",vu:bible(24,48),idea:"Jehová pregunta a Moab si Israel era objeto de burla, como si lo hubieran sorprendido entre ladrones.",fuentes:["itMoab22"],ref:"Biblia de estudio, Jer 48:27; Perspicacia, «Moab, moabitas», párr. 22.",aprendemos:"Burlarse del pueblo de Jehová es algo que él no deja pasar.",aplicar:"Moab aprovechó el peor momento de Judá para ridiculizarlo. Y Jehová lo registró como una cuenta pendiente. Esto tiene dos caras. Una, tristemente, la vemos hoy: hay quienes se burlan de nosotros por nuestra fe, y sienten que lo tienen todo resuelto. No nos angustiemos: Jehová lo ve. La otra cara es más incómoda: ¿me he burlado yo de un hermano que fracasó o que perdió un privilegio? Si es así, cambiemos el rumbo hoy."},
 {v:"Jer 48:29",vu:bible(24,48),idea:"Cuatro veces seguidas se repite el orgullo de Moab: arrogancia, orgullo, soberbia y altanería de corazón.",fuentes:["j48"],ref:"Biblia de estudio, Jer 48:29.",aprendemos:"El orgullo es el primer peldaño de una caída segura.",aplicar:"El texto insiste tanto porque el orgullo es persistente: no se va con una sola corrección. Y el orgullo siempre se nota en cómo tratamos a los demás: nos compara, los desprecia, se burla. La humildad, en cambio, también se nota: escucha, agradece, pide perdón. El orgullo nunca se queda quieto. Revisemos esta semana una conversación concreta en la que quizá nuestro orgullo habló antes que nuestro amor."},
 {v:"Jer 48:47",vu:bible(24,48),idea:"En medio del juicio, Jehová anuncia que en la parte final de los días reuniría a los cautivos de Moab.",fuentes:["itMoab24"],ref:"Biblia de estudio, Jer 48:47; Perspicacia, «Moab, moabitas», párr. 24.",aprendemos:"La justicia de Jehová nunca está reñida con su misericordia.",aplicar:"Después de anunciar la destrucción, Jehová deja una puerta abierta. Y cumplió su palabra: siglos después, Ciro permitió que los moabitas exiliados regresaran a su tierra. Nosotros también somos prueba de esa misericordia: hemos pecado, y aun así Jehová nos ha dado otra oportunidad. Que eso nos impulse a ser misericordiosos con quienes nos ofenden, y a no dar a nadie por perdido en la predicación."},
 {v:"Jer 48:31, 36",vu:bible(24,48),idea:"Jehová mismo dice que llorará y gemirá por Moab «como una flauta» cuando acabe con sus riquezas.",fuentes:["j48"],ref:"Biblia de estudio, Jer 48:31, 36.",aprendemos:"Jehová no se alegra del sufrimiento, ni siquiera del de los malvados.",aplicar:"¡Qué imagen tan tierna! El Juez de toda la tierra llora por la nación que va a destruir. Esto cambia nuestra manera de ver el juicio de Dios y también de ver a las personas. Si Jehová siente eso por un pueblo que lo desafió, ¿cómo deberíamos sentir nosotros por los que aún no lo conocen? No debemos verlos como enemigos, sino como personas que necesitan la salvación. En el día de Jehová no habrá risas, ni siquiera de nuestra parte."},
 {v:"Jer 47:3, 5",vu:bible(24,47),idea:"Antes de hablar de Moab, Jehová anuncia el juicio contra los filisteos: los padres se acobardan y no pueden rescatar a sus hijos.",fuentes:["j47"],ref:"Biblia de estudio, Jer 47:3, 5.",aprendemos:"Cuando se ejecuta el juicio de Jehová, no hay fuerza humana que proteja.",aplicar:"Los filisteos eran enemigos de Israel, y su juicio también estaba anunciado. El detalle que impresiona es el versículo 3: los padres, paralizados de miedo, ni siquiera pueden volver a buscar a sus hijos. Toda su capacidad militar y su orgullo no sirvieron de nada. La lección para nosotros es clara: no confiemos en la fuerza, la preparación ni los recursos para el día de Jehová. Lo que nos protegerá será la fidelidad a Jehová, que es lo que los filisteos despreciaron."}
];

var MAESTROS={
  p4:{marco:"De casa en casa. El publicador toca una puerta y la persona que abre dice que no tiene tiempo, con cierto mal humor. Duración: 3 minutos.",leccion:"lmd lección 5 punto 4 — Tacto: sea breve y respete el tiempo de la persona. Si le dice que no tiene tiempo, no insista ni alargue la conversación. Aproveche en pocas palabras para dejar una idea bíblica y una publicación, y retírese con una sonrisa.",objetivo:"Empezar una conversación en la predicación de casa en casa cuando la persona no tiene tiempo, sin presionarla.",tema:"El tacto nos ayuda a no desperdiciar la oportunidad cuando la persona tiene prisa.",texto:"Proverbios 25:11 — una palabra dicha a su tiempo es como manzanas de oro.",dialogo:"PUBLICADOR: Buenos días. Disculpe, no lo molesto mucho.\n\nPERSONA: Mire, no tengo tiempo ahora mismo.\n\nPUBLICADOR: Lo entiendo, de veras. Solo una idea que a mí me ha ayudado: la Biblia dice que una palabra dicha a su tiempo es como manzanas de oro (Proverbios 25:11).\n\nPERSONA: Ah, ¿sí?\n\nPUBLICADOR: Sí. Por eso le dejo esta publicación, para cuando tenga un ratito. Trae una idea muy bonita sobre cómo encontrar tranquilidad. ¿Se la dejo aquí?\n\nPERSONA: Bueno, déjela.\n\nPUBLICADOR: Muchas gracias por su tiempo. Que tenga un buen día.",demostrar:["Tocar con respeto y saludar con una sonrisa","Reconocer enseguida que la persona tiene prisa","No insistir ni alargar la conversación","Dejar una sola idea bíblica, breve y bien leída","Ofrecer una publicación y retirarse a tiempo"],conclusion:"Agradecer y retirarse rápido; dejar la puerta abierta para otra visita."},
  p5:{marco:"Predicación informal. El publicador conversa con un compañero de trabajo o un conocido en un lugar público y quiere usar una verdad del apéndice A del folleto Una obra de amor. Duración: 4 minutos.",leccion:"lmd lección 9 punto 5 — Empatía: capte cómo se siente la persona. No se trata de soltar un discurso, sino de ponerse en su lugar. Escuche su situación y escoja una sola verdad bíblica del apéndice A que responda a lo que siente. Empiece con «¿Sabía que...?» o «¿Ha escuchado alguna vez que...?».",objetivo:"Hacer una revisita en la predicación informal usando una verdad bíblica sencilla del apéndice A.",tema:"La empatía nos permite ofrecer la verdad que la persona necesita en ese momento.",texto:"Apocalipsis 21:4 — «ya no existirá la muerte, ni habrá más tristeza ni llanto ni dolor».",dialogo:"PUBLICADOR: Hola, ¿cómo has estado? Hace días que te veo cansado.\n\nPERSONA: Sí, la verdad es que la situación está difícil. Llevo semanas sin dormir bien.\n\nPUBLICADOR: Lo imagino. Cuando uno está así, todo pesa más. ¿Te ha pasado que a veces uno necesita aferrarse a algo?\n\nPERSONA: Sí, a los míos. Pero no siempre alcanza.\n\nPUBLICADOR: Te entiendo. ¿Sabías que la Biblia promete que pronto ya no existirá la muerte, ni habrá más tristeza ni llanto ni dolor? (Apocalipsis 21:4.) ¿Te gustaría saber cuándo va a pasar?\n\nPERSONA: La verdad es que sí.\n\nPUBLICADOR: Te propongo algo: la próxima semana, en el descanso, te muestro dos o tres textos cortitos sobre esto. ¿Te parece?",demostrar:["Escuchar antes de hablar: captar el estado de ánimo","Validar lo que siente la persona sin sermonear","Escoger una sola verdad del apéndice A, adecuada a la conversación","Usar la pregunta «¿Sabía que...?» con naturalidad","Ofrecer una próxima conversación concreta"],conclusion:"Acordar un momento concreto para seguir conversando y agradecer su confianza."},
  p6:{marco:"Revisita con un estudiante de la Biblia que ya tiene algunos meses de estudio. La asignación es motivarlo a orar con más frecuencia. Duración: 5 minutos.",leccion:"th lección 8 — Enseñar con ejemplos: use ejemplos sencillos y cercanos para que el estudiante entienda y recuerde lo que se le enseña. Un buen ejemplo no adorna el consejo: lo hace comprensible y fácil de aplicar.",objetivo:"Animar a un estudiante de la Biblia a orar con más frecuencia usando un ejemplo sencillo.",tema:"La oración debe ser tan natural como hablar con un padre que nos quiere.",texto:"1 Tesalonicenses 5:17 — «oren sin cesar». Lucas 11:1-4.",dialogo:"PUBLICADOR: Antes de empezar, cuéntame: ¿has seguido orando esta semana?\n\nESTUDIANTE: A veces. Pero se me olvida, o siento que lo que tengo que decir es muy poco.\n\nPUBLICADOR: Te entiendo. Déjame ponerte un ejemplo. Si tu hijo solo te hablara una vez a la semana, y además se preparara un papel para no olvidar nada, ¿cómo te sentirías?\n\nESTUDIANTE: Un poco triste, la verdad. Querría que me hablara con confianza, cuando le naciera.\n\nPUBLICADOR: Exacto. Con Jehová pasa algo parecido. Él no quiere discursos; quiere que le hablemos como a un padre. Por eso la Biblia dice «oren sin cesar» (1 Tesalonicenses 5:17). No es que tengamos que estar de rodillas todo el día, sino que podemos hablarle en cualquier momento: en el bus, en el trabajo, antes de dormir.\n\nESTUDIANTE: Eso me ayuda a verlo distinto.\n\nPUBLICADOR: ¿Qué te parece si esta semana te propones una oración corta cada día, aunque sea de un minuto, y la próxima vez me cuentas cómo te fue?",demostrar:["Preguntar con interés cómo le va en su oración","Usar un ejemplo cotidiano que el estudiante entienda","Adaptar el ejemplo a la respuesta del estudiante","Explicar el texto bíblico con sencillez","Proponer una meta concreta y revisarla en la próxima visita"],conclusion:"Acordar una meta sencilla para la semana y asegurarse de que el estudiante entendió el ejemplo."}
};

var ESTUDIO_P9={
  fuente:{t:"Seamos valientes al andar con Dios — cap. 14",u:pc("/11/0")},
  libro:"wcg cap. 14 — «Rahab: Puso a Jehová por encima de su propio pueblo»",
  textosDestacados:[
    {ref:"Josué 2:8-11",texto:"«Antes de que los espías se acostaran a dormir, ella subió al techo, donde ellos estaban. Y les dijo: “Yo sé que Jehová les dará esta tierra, y que el miedo a ustedes se ha apoderado de nosotros. Todos los habitantes de esta tierra están desmoralizados por causa de ustedes. Y es que hemos oído cómo Jehová secó las aguas del mar Rojo delante de ustedes cuando salieron de Egipto, y lo que ustedes les hicieron a los dos reyes de los amorreos, Sehón y Og, a quienes mataron al otro lado del Jordán. Cuando lo oímos, nos acobardamos, y nadie tiene el valor de enfrentarse a ustedes, porque Jehová su Dios es Dios en los cielos arriba y en la tierra abajo”»."},
    {ref:"Josué 6:25",texto:"«Los únicos a los que Josué les perdonó la vida fueron Rahab la prostituta, los de la casa de su padre y todos los suyos; y ella vive en Israel hasta el día de hoy, pues escondió a los mensajeros que Josué envió para espiar Jericó»."},
    {ref:"Hebreos 11:31",texto:"«Por la fe, Rahab la prostituta no murió con los que fueron desobedientes, pues recibió a los espías de manera pacífica»."},
    {ref:"Santiago 2:25",texto:"«De la misma manera, ¿no fue declarada justa por sus obras Rahab la prostituta después de recibir hospitalariamente a los mensajeros y de enviarlos por otro camino?»."}
  ],
  preguntas:[
    {q:"¿Cómo debió ser la vida de Rahab en Jericó, y por qué eso hace más admirable su decisión?",a:"Rahab era prostituta en una ciudad condenada por Jehová por su maldad extremada. En Canaán abundaban la violencia y los actos degenerados, y la religión misma fomentaba la prostitución ritual y hasta el sacrificio de niños. Es probable que Rahab se sintiera atrapada en un oficio degradante, sin más opciones para mantenerse. Aun así, su conciencia le decía que aquello estaba mal. Por eso, cuando oyó lo que Jehová había hecho por Israel, no sintió solo miedo: sintió esperanza. Vio que Jehová es un Dios que protege y dignifica a su pueblo, y se sintió atraída a él. Su decisión fue mucho más que un cálculo: fue un acto de fe que le costó todo su pasado."},
    {q:"¿De qué maneras demostró valor Rahab?",a:"Demostró valor en varias decisiones encadenadas. Primero, escondió a los espías y le mintió al rey cuando mandó a buscarlos, sabiendo que si la descubrían le esperaba una muerte terrible. Segundo, se puso del lado de Jehová y de Israel, es decir, en contra de su propio pueblo y de sus vecinos. Tercero, les pidió una garantía de que su familia viviría, lo que demuestra que pensaba en los suyos y confiaba en la promesa. Cuarto, ató el cordón rojo escarlata y reunió a su familia en la casa, como le habían mandado, y esperó dentro mientras el ejército israelita marchaba alrededor de la ciudad durante siete días. Cada paso exigía confiar en que Jehová cumpliría lo que le habían prometido."},
    {q:"¿Por qué no estuvo mal que Rahab engañara a los hombres del rey?",a:"Porque Rahab había puesto su fe en Jehová, y no estaba obligada a entregar a los servidores de Dios a hombres que querían hacerles daño. La Biblia no enseña que mentir esté bien en general, pero reconoce que hay información que debe protegerse. Rahab arriesgó su vida para proteger a los espías, y Santiago la presenta como ejemplo de fe acompañada de obras: fue «declarada justa por obras», entre ellas la de enviar por otro camino a los emisarios del rey. Lo mismo aplica a nosotros: si enemigos del pueblo de Dios nos presionan para que revelemos información confidencial sobre nuestros hermanos, podemos aprender de Rahab a guardar silencio."},
    {q:"¿Por qué tenía Rahab tallos de lino en el techo, y qué nos enseña ese detalle?",a:"Porque el lino se cosechaba cuando tenía «botones de flor» y luego se dejaba secar, y es muy probable que los tallos del techo de Rahab estuvieran allí con ese fin. Ese detalle, aparentemente insignificante, muestra que la Biblia describe la vida real: una mujer que trabajaba, que tenía un oficio, que conocía su oficio. Y también sirvió a un propósito: sobre esos tallos de lino escondió a los espías. Jehová puede usar hasta los detalles más comunes de nuestra vida diaria para cumplir sus propósitos. No hace falta ser perfecto ni tener una vida ideal para que Dios nos use."},
    {q:"¿Qué nos enseña el ejemplo de Rahab sobre la misericordia de Jehová?",a:"Que Jehová no descarta a nadie por su pasado. Rahab era prostituta, extranjera y cananea: humanamente, la persona menos probable para formar parte del pueblo de Dios. Sin embargo, Jehová la perdonó, la protegió y la bendijo. Llegó a formar parte de Israel, se casó con un israelita y tuvo hijos, y siglos después de su descendencia salió Jesucristo. Eso nos enseña que la misericordia de Jehová es más grande que nuestro historial. Si él pudo transformar a Rahab, puede transformar a cualquier persona que hoy estudia con nosotros, y también a nosotros mismos cuando fallamos."},
    {q:"¿Cómo nos ayuda el ejemplo de Rahab a ponernos de parte de Jehová aunque eso nos cueste?",a:"Rahab tuvo que elegir entre la gente de su ciudad, a la que pertenecía, y Jehová, al que apenas empezaba a conocer. Escogió a Jehová, y esa decisión le costó su pasado, su oficio y hasta la seguridad de su vida durante la batalla. Nosotros enfrentamos decisiones parecidas cada día: entre lo que hacen todos y lo que Jehová pide. El ejemplo de Rahab nos enseña que ponerse del lado de Jehová siempre vale la pena, aunque al principio parezca que perdemos algo. Ella lo perdió todo y ganó mucho más: vida, familia y un lugar en el linaje del Mesías."}
  ]
};

var LECTURA_P3={
  pasaje:"Jeremías 48:1-13",
  libro:24,capitulo:48,leccionKey:"th11",
  textoCompleto:"1 Para Moab, esto es lo que dice Jehová de los ejércitos, el Dios de Israel: “¡Ay de Nebo, porque ha sido destruida! Han avergonzado y conquistado Quiryataim. Han avergonzado y destrozado el refugio seguro. 2 Ya nadie alaba a Moab. En Hesbón han tramado su caída: ‘Vengan, hagamos que desaparezca como nación’. Oh, Madmén, tú también deberías guardar silencio, porque la espada te persigue. 3 Desde Horonaim se oyen gritos de destrucción y desastre total. 4 Moab ha sido demolida. Sus pequeños lloran a gritos. 5 La gente llora sin parar mientras sube a Luhit. En la bajada de Horonaim se oyen los gritos de angustia por la catástrofe. 6 ¡Corran, huyan por su vida! Tienen que llegar a ser como un enebro en el desierto. 7 Por confiar en tus obras y en tus tesoros, tú también serás conquistada. Y Kemós irá al destierro, junto con sus sacerdotes y sus príncipes. 8 El destructor invadirá todas las ciudades y ninguna de ellas escapará. El valle morirá y la tierra llana será destruida, tal como ha dicho Jehová. 9 Pónganle a Moab una marca señalizadora, porque al quedar en ruinas ella huirá, y sus ciudades se convertirán en motivo de horror, se quedarán sin habitantes. 10 ¡Maldito el que lleve a cabo la misión de Jehová sin ganas! ¡Maldito el que se retraiga de derramar sangre con su espada! 11 Los moabitas han estado tranquilos desde su juventud, como el vino que se deja reposar sobre sus sedimentos. No los han pasado de una vasija a otra, y nunca han ido al destierro. Por eso su sabor sigue siendo el mismo y su aroma no ha cambiado. 12 »Por lo tanto, mira, se acercan los días —afirma Jehová— en que enviaré hombres para volcarlos. Los van a volcar y vaciarán sus vasijas, y harán pedazos sus jarras grandes. 13 Y los moabitas se avergonzarán de Kemós, tal como los de la casa de Israel se avergüenzan de Betel, que era su confianza.",
  leccion:"th lección 11 — Hablar con entusiasmo",
  consejos:[
    "Lea primero el pasaje completo en silencio. Fíjese en el tono general: es un anuncio de juicio, pero lleno de emoción.",
    "Este pasaje no es una lista fría: hay lamento, gritos, huida y dolor. Deje que se note en la voz.",
    "Empiece con un tono firme y sereno en el versículo 1, al anunciar el mensaje de Jehová.",
    "Baje la voz y hable más despacio en los versículos 4 y 5, donde se oye a los niños y a la gente llorar mientras sube a Luhit.",
    "En el versículo 6, «¡Corran, huyan por su vida!», aumente un poco el ritmo y la urgencia: es una orden.",
    "Dé peso y pausa al versículo 7, que explica la causa de todo: «Por confiar en tus obras y en tus tesoros».",
    "Practique los nombres propios antes de leer: Nebo, Quiryataim, Hesbón, Madmén, Horonaim, Luhit, Kemós, Betel.",

var ATALAYA={intro:"Artículo de estudio para la semana del 26 de octubre al 1 de noviembre de 2026. Texto base: Lucas 1:69, 74. Tema: valorar el regalo de la salvación, el privilegio de adorar a Jehová y la responsabilidad de predicar. Canción inicial: 62. Canción final: 159.",parrafos:[
  {num:"1",texto:"“¿Qué llegará a ser este niño?”. Eso es lo que preguntaron intrigados algunos vecinos y parientes cuando vieron que Zacarías y Elisabet habían tenido milagrosamente un hijo a una edad muy avanzada. Jehová utilizó a Zacarías para responder esa pregunta. Él explicó que Juan ayudaría al pueblo a arrepentirse y a estar preparado para identificar y seguir al Mesías prometido, que estaba por llegar. Pero Zacarías no solo indicó lo que haría su hijo. También dio un mensaje profético que nos incluye a nosotros. En este artículo vamos a analizar sus palabras y veremos tres cosas que debemos valorar: 1) el regalo de la salvación, 2) el privilegio de adorar a Jehová y 3) la responsabilidad de predicar.",pregunta:"Al ver lo que Zacarías dijo sobre su hijo, ¿qué tres cosas que debemos valorar vamos a analizar?",respuesta:"El regalo de la salvación, el privilegio de adorar a Jehová y la responsabilidad de predicar. Zacarías no solo habló del niño que iba a nacer: dio un mensaje profético que también nos incluye a nosotros."},
  {num:"2",texto:"Dios le había prometido a su pueblo que le iba a hacer un regalo maravilloso: la salvación. ¿Por medio de quién? Zacarías dijo: “[Jehová] ha hecho surgir para nosotros un poderoso salvador de la casa de su siervo David”. Ese “poderoso salvador” sería el Mesías. Los judíos de los días de Zacarías ya esperaban al Mesías prometido y sabían que sería descendiente de Abrahán y del rey David. Entonces, ¿por qué hizo Jehová que Zacarías diera ese mensaje? Porque la llegada del Mesías estaba más cerca que nunca. Ese “poderoso salvador” surgió cuando Jesús se bautizó, a la edad de 30 años. En ese momento, fue ungido con espíritu santo y se convirtió en el Mesías.",pregunta:"a) Según Lucas 1:67-73, ¿qué regalo le ha prometido Jehová a su pueblo? b) ¿Quién es el “poderoso salvador” del que habla Lucas 1:69?",respuesta:"a) La salvación. b) El Mesías, es decir, Jesucristo. Zacarías dijo que Jehová había hecho surgir “un poderoso salvador de la casa de su siervo David”. La expresión literal es “un cuerno de salvación”, y en la Biblia los cuernos representan fuerza y victoria. Jesús surgió como ese Salvador cuando se bautizó y fue ungido con espíritu santo."},
  {num:"3",texto:"Los judíos del primer siglo necesitaban que se les salvara. Pero ¿de quién y de qué? Zacarías dijo: “De nuestros enemigos y de las manos de todos los que nos odian”. ¿Significaba eso que Jesús los salvaría de la tiranía de las autoridades romanas? No, él los salvaría de un enemigo mucho mayor, Satanás. Él era el verdadero culpable de su sufrimiento y de que ellos fueran esclavos del pecado y la muerte, tal como lo somos todos los seres humanos. Además, los judíos necesitaban que se les salvara de la maldición de la Ley. Estaban bajo esa maldición porque no eran capaces de cumplir a la perfección la Ley de Moisés. Así que necesitaban lo que Jehová prometió mediante Zacarías: “la salvación mediante el perdón de sus pecados”.",pregunta:"¿De quién y de qué necesitaban los judíos que se les salvara?",respuesta:"Necesitaban que se les salvara de sus enemigos y de las manos de los que los odiaban, pero sobre todo de Satanás, el verdadero culpable de su sufrimiento y de que fueran esclavos del pecado y la muerte. Además, necesitaban librarse de la maldición de la Ley, pues no podían cumplirla a la perfección. En resumen, necesitaban la salvación mediante el perdón de sus pecados."},
  {num:"4",texto:"¿Y nosotros? ¿De qué y de quién necesitamos que se nos salve? Al igual que aquellos judíos, también somos esclavos del pecado y la muerte. Además, Satanás y los demonios tratan de hacernos la vida difícil. Intentan engañarnos para que dejemos de servir a Jehová. También influyen en “los que nos odian”, ya sean personas u organizaciones, para que se pongan en contra de nuestra adoración.",pregunta:"¿De qué enemigos necesitamos que se nos salve?",respuesta:"Del pecado y la muerte, que nos esclavizan igual que a aquellos judíos. También de Satanás y los demonios, que tratan de engañarnos para que dejemos de servir a Jehová, y de “los que nos odian”, que pueden ser personas u organizaciones que se oponen a nuestra adoración."},
  {num:"5",texto:"¿Cómo nos salva Jesús del pecado? Cuando estuvo en la Tierra, les enseñó a sus seguidores cómo adorar a Jehová de la manera correcta. Además, dio su vida “para que nadie que demuestre tener fe en él sea destruido, sino que tenga vida eterna”. Nosotros hacemos todo lo posible por adorar a Jehová como Jesús nos enseñó. Pero, como somos imperfectos, cada vez que pecamos tenemos que pedirle a Dios que nos perdone. Entonces él, basándose en el sacrificio de Jesús, acepta nuestra adoración. Así es como nuestro “poderoso salvador” nos libera del pecado.",pregunta:"¿Cómo nos salva Jesús del pecado?",respuesta:"Nos enseñó cómo adorar a Jehová correctamente y dio su vida para que tengamos vida eterna. Además, cuando pecamos y le pedimos perdón a Dios, él nos perdona basándose en el sacrificio de Jesús y acepta nuestra adoración. Así es como nuestro “poderoso salvador” nos libera del pecado."},
  {num:"6",texto:"¿Y cómo nos salvará Jesús por completo del pecado y la muerte, de Satanás y los demonios, y de “los que nos odian”? En 1914, Jesús empezó a reinar en el cielo desde “el trono de David su padre”. Junto con los 144.000 y los ángeles, el Rey del Reino de Dios eliminará en el Armagedón a todos los seres humanos enemigos de Dios. Luego, durante el Reinado de Mil Años, Jesús resucitará a los muertos y, junto con los 144.000, ayudará a la humanidad a alcanzar la perfección. Para cuando terminen los 1.000 años, el pecado heredado y la muerte habrán desaparecido. Entonces, Jesús y los 144.000 destruirán para siempre a Satanás, los demonios y todos los seres humanos que se pongan de su parte durante la prueba final. Alabaremos por siempre a nuestro Dios “por su indescriptible regalo”, que incluye nuestra salvación mediante Jesucristo.",pregunta:"¿Qué logrará pronto Jesús, el Rey del Reino de Dios?",respuesta:"Eliminará en el Armagedón a todos los enemigos de Dios. Durante el Reinado de Mil Años resucitará a los muertos y ayudará a la humanidad a alcanzar la perfección, de modo que el pecado heredado y la muerte desaparezcan. Al final de los 1.000 años destruirá para siempre a Satanás, los demonios y a quienes se pongan de su parte en la prueba final. Entonces podremos alabar a Jehová por siempre por su indescriptible regalo."},
  {num:"7",texto:"Gracias al rescate tenemos el maravilloso privilegio de darle a Jehová servicio sagrado sin temor, tal como dijo Zacarías. ¿De qué maneras le damos “servicio sagrado” a Dios? Lo hacemos, por ejemplo, al predicar, al orar, al estudiar su Palabra, al asistir a las reuniones y las asambleas, al servir en Betel y al construir y mantener los Salones del Reino y los Salones de Asambleas. En resumen, damos servicio sagrado al participar en cualquier actividad directamente relacionada con la adoración a Dios.",pregunta:"Según Lucas 1:74, 75, ¿qué privilegio le da Jehová a su pueblo?",respuesta:"El privilegio de darle servicio sagrado sin temor, con lealtad y justicia delante de él todos los días de nuestra vida. Lo hacemos al predicar, orar, estudiar su Palabra, asistir a las reuniones y asambleas, servir en Betel y construir y mantener los Salones del Reino y de Asambleas. En resumen, cualquier actividad directamente relacionada con la adoración a Dios es servicio sagrado."},
  {num:"8",texto:"¿Por qué dijo Zacarías que le damos a Jehová servicio sagrado “sin temor”? Primero, porque no le tenemos miedo a la muerte. Como tenemos la esperanza de vivir para siempre, no sentimos la necesidad de sacarle el máximo jugo a la vida en este sistema, sino que nos concentramos en agradar a Jehová. Incluso si nuestros enemigos amenazan con matarnos, no dejamos que el temor nos venza. Al contrario, nos mantenemos leales porque sabemos que, si morimos, Jesús nos resucitará. Segundo, no tenemos miedo de que Jehová nos rechace porque somos pecadores. Estamos seguros de que contamos con su amor y aprobación y de que nos perdona gracias al rescate.",pregunta:"¿Por qué damos servicio sagrado “sin temor”?",respuesta:"Por dos razones. Primera, porque no le tenemos miedo a la muerte: tenemos la esperanza de vivir para siempre y sabemos que, si morimos, Jesús nos resucitará. Segunda, porque no tenemos miedo de que Jehová nos rechace por ser pecadores: estamos seguros de su amor y aprobación, y de que nos perdona gracias al rescate."},
  {num:"9",texto:"Sin embargo, a algunos hermanos les cuesta aceptar que Jehová esté contento con su adoración. ¿Por qué? Tal vez les parezca que no merecen su aprobación debido a alguna experiencia traumática del pasado que afectó su autoestima. O quizás se sienten terriblemente culpables por pecados que cometieron hace mucho tiempo, a pesar de que ya le pidieron perdón a Jehová y buscaron la ayuda de los ancianos. ¿Te sientes así? Veamos qué puedes hacer.",pregunta:"¿Qué lucha tienen algunos hermanos?",respuesta:"Les cuesta aceptar que Jehová esté contento con su adoración. Algunos se sienten así debido a una experiencia traumática del pasado que afectó su autoestima; otros se sienten terriblemente culpables por pecados que cometieron hace mucho tiempo, aunque ya le pidieron perdón a Jehová y buscaron la ayuda de los ancianos."},
  {num:"10",texto:"Supongamos que alguien se rompe una pierna y va al hospital. Entonces, el médico trata su fractura y le manda hacer ciertos ejercicios de rehabilitación para recuperar la fuerza y la movilidad. Ahora bien, ¿qué tiene que hacer el paciente si teme que no podrá volver a caminar con normalidad? Confiar en el médico y seguir sus instrucciones sin darse por vencido. Con el tiempo probablemente se recuperará e incluso podrá volver a correr.",pregunta:"¿Qué ejemplo nos ayuda a entender cómo recuperarnos de un error del pasado?",respuesta:"El ejemplo de un paciente con una pierna rota. El médico trata la fractura y le manda ejercicios de rehabilitación. Si el paciente teme no volver a caminar bien, lo que tiene que hacer es confiar en el médico y seguir sus instrucciones sin darse por vencido. Con el tiempo se recupera e incluso puede volver a correr."},
  {num:"11",texto:"De manera parecida, si piensas que jamás podrás recuperarte de un error del pasado y sientes un dolor muy intenso, confía en Jehová. Recuerda que te quiere mucho y que el rescate tiene un poder curativo. Sigue haciendo los “ejercicios de rehabilitación”: orar, estudiar y participar en otras actividades espirituales. Al igual que sucede físicamente, el proceso de curación espiritual toma su tiempo. Por eso al principio quizás te cueste ver sus efectos. Pero no dejes de confiar en Jehová y no te des por vencido. Si sigues un buen programa de actividades espirituales, seguro que te recuperarás. Y también es importante que todos los días le des gracias a Jehová por darte las fuerzas necesarias para seguir sirviéndole fielmente.",pregunta:"¿Qué podemos hacer si pensamos que jamás podremos recuperarnos de un error del pasado?",respuesta:"Confiar en Jehová y recordar que nos quiere mucho y que el rescate tiene poder curativo. Hay que seguir haciendo los “ejercicios de rehabilitación”: orar, estudiar y participar en las actividades espirituales. La curación espiritual toma tiempo, así que no hay que darse por vencido. Además, es importante agradecerle a Jehová cada día las fuerzas para seguir sirviéndole fielmente."},
  {num:"12",texto:"Zacarías le dijo a su hijito: “Irás delante de Jehová para preparar sus caminos”. ¿Cómo se cumplieron esas palabras? Cuando creció, Juan el Bautista se dedicó a predicar con entusiasmo. Animó a los judíos a arrepentirse de sus pecados, a bautizarse y a prepararse para la llegada del Mesías. Después de bautizar a Jesús, lo presentó como el representante de Jehová. Dijo: “¡Miren, el Cordero de Dios que quita el pecado del mundo!”. A partir de ahí, les pidió a sus propios discípulos que siguieran a Jesús, el Mesías.",pregunta:"¿Cómo se cumplieron las palabras de Zacarías sobre Juan?",respuesta:"Juan creció y se dedicó a predicar con entusiasmo. Animó a los judíos a arrepentirse, a bautizarse y a prepararse para la llegada del Mesías. Después de bautizar a Jesús, lo presentó como el Cordero de Dios que quita el pecado del mundo, y pidió a sus propios discípulos que siguieran a Jesús."},
  {num:"13",texto:"Zacarías también comparó la llegada del Mesías a “la luz de un amanecer”, dando a entender que este acontecimiento extraordinario marcaría el inicio de una nueva era. Era una importante noticia que merecía la mayor difusión posible. Y, aunque Juan ya había identificado claramente a Jesús como el Mesías, él solo no podría extender ese mensaje de salvación. ¿Quiénes más colaborarían?",pregunta:"¿Qué quiso decir Zacarías cuando comparó la llegada del Mesías a “la luz de un amanecer”?",respuesta:"Que la llegada del Mesías marcaría el inicio de una nueva era, como la luz que rompe la oscuridad de la noche. Era una noticia tan importante que merecía la mayor difusión posible. Por eso aquel mensaje no podía quedarse solo en Juan: necesitaba a muchos más predicadores."},
  {num:"14",texto:"El propio Jesús predicó muchísimo. Hizo lo que Zacarías profetizó: “alumbrar a los que están sentados en oscuridad y bajo la sombra de la muerte”. Él sentía una inmensa compasión por las personas que estaban oprimidas y maltratadas, y eso lo impulsó a anunciarles “el año de la buena voluntad de Jehová” para iluminarlas y consolarlas. Proclamó con empeño: “El Reino de los cielos se ha acercado”. Aun así, sabía que se necesitarían muchos más predicadores. Por esa razón, capacitó a sus discípulos.",pregunta:"¿En qué importante labor participaron Jesús y sus discípulos?",respuesta:"En la labor de predicar y enseñar las buenas noticias del Reino. Jesús predicó muchísimo, con compasión por los oprimidos y maltratados, y proclamó que el Reino de los cielos se había acercado. Como sabía que se necesitarían muchos más predicadores, capacitó a sus discípulos y los envió a hacer discípulos."},
  {num:"15",texto:"Los seguidores de Cristo hoy en día apreciamos mucho la responsabilidad que tenemos de seguir difundiendo el mensaje de salvación. De hecho, hoy es más importante que nunca hablar a la gente del rescate y el Reino de Dios. ¿Por qué? Por todo lo que se avecina. Pronto “habrá una gran tribulación” sin precedentes en la historia. Es posible que en ese periodo haya personas que recuerden lo que les predicamos, acepten las buenas noticias y se pongan de parte de Jehová. Entonces Jesús, los 144.000 y los ángeles lucharán contra los seres humanos que se oponen a Dios. Nuestro Rey salvará a los siervos de Jehová para que puedan vivir en el nuevo mundo. Sin duda, es esencial que prediquemos ahora las buenas noticias.",pregunta:"¿Por qué es hoy más importante que nunca la predicación?",respuesta:"Porque pronto habrá una gran tribulación sin precedentes. Es posible que en ese periodo algunas personas recuerden lo que les predicamos, acepten las buenas noticias y se pongan de parte de Jehová. Por eso es esencial que prediquemos ahora: nuestras advertencias de hoy pueden ser lo que alguien recuerde mañana."},
  {num:"16",texto:"Este análisis de Lucas 1:68-79 nos ha recordado tres cosas que valoramos profundamente: el extraordinario regalo de la salvación, el privilegio de adorar a Jehová sin temor y la responsabilidad de predicar su mensaje de consuelo. Si hemos puesto nuestra fe en el regalo del rescate y nos hemos dedicado a Jehová y si apreciamos el privilegio de servirle, cumplamos con nuestra responsabilidad de predicar “el año de la buena voluntad de Jehová”. Anunciemos también su “día de la venganza”, cuando por fin el Reino de Dios acabe con todos los malvados y transforme la Tierra en un paraíso. Invitemos a todas las personas que aman a Jehová a disfrutar con nosotros del “privilegio de darle servicio sagrado sin temor y con lealtad y justicia delante de él todos los días de nuestra vida”.",pregunta:"¿Con qué queremos cumplir?",respuesta:"Con nuestra responsabilidad de predicar “el año de la buena voluntad de Jehová” y anunciar su “día de la venganza”, cuando el Reino acabe con los malvados y transforme la Tierra en un paraíso. Y queremos invitar a todas las personas que aman a Jehová a disfrutar con nosotros del privilegio de darle servicio sagrado sin temor, con lealtad y justicia, todos los días de nuestra vida."}
]};

var S={v:{},view:"home",id:null,demo:false,tabWeek:"weekday"};
var K_CUR="prep2:actual",K_SAVED="prep2:guardadas",K_DISC="prep2:discursos",K_LIVE="prep2:live";

function lsGet(k,d){try{var x=localStorage.getItem(k);return x?JSON.parse(x):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var K_WEEK="prep2:semana";
/* Campos de texto válidos de la semana. Un respaldo antiguo guarda `week` como
   texto (solo la etiqueta): pasarlo a Object.assign esparciría sus caracteres. */
var WEEK_FIELDS=["key","label","shortLabel","reading","fetched","program","url"];
function normalizeWeek(w){
  var out={};
  if(w&&typeof w==="object"&&!Array.isArray(w)){
    for(var i=0;i<WEEK_FIELDS.length;i++){var k=WEEK_FIELDS[i];if(typeof w[k]==="string")out[k]=w[k];}
  }else if(typeof w==="string"){
    out.shortLabel=w;
  }
  return out;
}
function normalizeParts(p){
  if(!Array.isArray(p))return null;
  var out=[];
  for(var i=0;i<p.length;i++){if(p[i]&&typeof p[i]==="object"&&!Array.isArray(p[i]))out.push(p[i]);}
  return out.length?out:null;
}
/* Combina el fin de semana importado sobre el actual: nunca deja secciones ni
   `parrafos` con un tipo inesperado. */
function mergeWeekend(w){
  if(!w||typeof w!=="object"||Array.isArray(w))return null;
  var out=JSON.parse(JSON.stringify(WEEKEND));
  ["discursoPublico","atalaya"].forEach(function(sec){
    var src=w[sec];
    if(!src||typeof src!=="object"||Array.isArray(src))return;
    for(var k in src){
      if(k==="parrafos"){if(Array.isArray(src[k]))out[sec].parrafos=src[k];}
      else if(typeof src[k]==="string")out[sec][k]=src[k];
    }
  });
  return out;
}
function weekSnapshot(){
  var out={};
  for(var i=0;i<WEEK_FIELDS.length;i++){var k=WEEK_FIELDS[i];if(typeof WEEK[k]==="string")out[k]=WEEK[k];}
  return out;
}
function validWeekKey(k){
  if(typeof k!=="string"||k.length!==10||k.charAt(4)!=="-"||k.charAt(7)!=="-")return false;
  for(var i=0;i<10;i++){
    if(i===4||i===7)continue;
    var c=k.charAt(i);
    if(c<"0"||c>"9")return false;
  }
  return true;
}
var WEEK_DEFAULT=JSON.parse(JSON.stringify(WEEK));
var PARTS_DEFAULT=JSON.parse(JSON.stringify(PARTS));
var WEEKEND_DEFAULT=JSON.parse(JSON.stringify(WEEKEND));
(function loadWeekData(){
  var s=lsGet(K_WEEK,null);
  if(!s||typeof s!=="object")return;
  var w=normalizeWeek(s.week);
  for(var k in w)WEEK[k]=w[k];
  var p=normalizeParts(s.parts);if(p)PARTS=p;
  var wk=mergeWeekend(s.weekend);if(wk)WEEKEND=wk;
})();
(function init(){var c=lsGet(K_CUR,null);if(c&&c.weekKey===WEEK.key&&c.v){for(var k in c.v){if(c.v[k]!==""&&c.v[k]!==null&&c.v[k]!==undefined)S.v[k]=c.v[k];}}})();

function persistNow(){clearTimeout(persistT);lsSet(K_CUR,{weekKey:WEEK.key,v:S.v});}
function val(k,def){var v=S.v[k];if(v===undefined||v===null||v==="")return (def==null?"":def);return v;}

var K_TIMER="prep2:timer",K_TICK="prep2:timerpos";
var TIMER=lsGet(K_TIMER,{running:false,startAt:0,accumulated:0,assigned:600,label:""});
var TPOS=lsGet(K_TICK,null);
var TIMER_INT=null,TIMER_EXPANDED=false;
function timerElapsedMs(){if(TIMER.running)return TIMER.accumulated+(Date.now()-TIMER.startAt);return TIMER.accumulated;}
function fmtMs(ms){if(ms<0)ms=0;var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function ensurePos(){if(TPOS)return;var w=window.innerWidth,h=window.innerHeight;TPOS={x:Math.max(8,w-90),y:Math.max(8,h-220)};lsSet(K_TICK,TPOS);}
function clampPos(box){var w=window.innerWidth,h=window.innerHeight;var bw=box.offsetWidth||74,bh=box.offsetHeight||74;TPOS.x=Math.max(6,Math.min(w-bw-6,TPOS.x));TPOS.y=Math.max(6,Math.min(h-bh-6,TPOS.y));}
function applyPos(box){ensurePos();clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";box.style.right="auto";box.style.bottom="auto";}
function timerTick(){
  lsSet(K_TIMER,TIMER);
  var box=document.getElementById("timerbox");if(!box)return;
  if(!TIMER.label){box.classList.remove("show");return;}
  box.classList.add("show");
  var el=timerElapsedMs();var remain=TIMER.assigned*1000-el;var over=remain<0;
  box.classList.toggle("over",over);
  if(TIMER_EXPANDED){
    box.classList.add("expanded");
    box.innerHTML='<button class="tclose" data-act="t-close">×</button><div class="ttitle">'+esc(TIMER.label)+'</div><div class="tgrid"><div class="tbig">'+fmtMs(el)+'</div><div class="grow"><div class="tmini">Asignado: <b>'+fmtMs(TIMER.assigned*1000)+'</b></div><div class="tmini">Restante: <b>'+(over?'+'+fmtMs(-remain):fmtMs(remain))+'</b></div></div></div><div class="row" style="margin-top:10px">'+(TIMER.running?'<button class="btn sm primary grow" data-act="t-pause">PAUSAR</button>':(TIMER.accumulated>0?'<button class="btn sm primary grow" data-act="t-resume">CONTINUAR</button>':'<button class="btn sm primary grow" data-act="t-start">INICIAR</button>'))+'<button class="btn sm grow" data-act="t-reset">REINICIAR</button></div>';
  }else{box.classList.remove("expanded");box.textContent=fmtMs(el);}
  attachDrag(box);applyPos(box);
}
function attachDrag(box){
  if(box.dataset.dragInit==="1")return;box.dataset.dragInit="1";
  var sx,sy,sl,st,dragging=false,moved=false;
  box.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;dragging=true;moved=false;sx=e.clientX;sy=e.clientY;sl=TPOS.x;st=TPOS.y;try{box.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();});
  box.addEventListener("pointermove",function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;TPOS.x=sl+dx;TPOS.y=st+dy;clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";});

function detectType(p){
  if(!/^p([0-9]|10)$/.test(p.id))return {k:"otra",label:"otra parte"};
  var s=p.section,t=(p.title+" "+(p.raw||"")).toLowerCase();
  if(s==="INICIO")return {k:"inicio",label:"Canción, oración y palabras de introducción"};
  if(s==="TESOROS DE LA BIBLIA"){
    if(/perlas escondidas/.test(t))return {k:"perlas",label:"Busquemos perlas escondidas"};
    if(/lectura de la biblia/.test(t))return {k:"lectura",label:"Lectura de la Biblia"};
    return {k:"tesoros",label:"Tesoros de la Biblia (discurso)"};
  }
  if(s==="SEAMOS MEJORES MAESTROS"){
    if(/de casa en casa/.test(t))return {k:"maestros",sub:p.id,label:"De casa en casa"};
    if(/predicación informal/.test(t))return {k:"maestros",sub:p.id,label:"Predicación informal"};
    if(/predicación pública/.test(t))return {k:"maestros",sub:p.id,label:"Predicación pública"};
    if(/explique sus creencias/.test(t))return {k:"maestros",sub:p.id,label:"Explique sus creencias"};
    if(/discurso/.test(t))return {k:"maestros",sub:p.id,label:"Discurso"};
    return {k:"maestros",sub:p.id,label:"Otra asignación"};
  }
  if(s==="NUESTRA VIDA CRISTIANA"){
    if(/estudio bíblico de la congregación/.test(t))return {k:"estudio",label:"Estudio bíblico"};
    if(/video|auditorio|viudas/.test(t))return {k:"vida",label:"Análisis con el auditorio (con video)"};
    if(/conclusión/.test(t))return {k:"inicio",label:"Palabras de conclusión"};
    return {k:"vida",label:"Otra actividad"};
  }
  return {k:"otra",label:"Otra parte"};
}

/* Quita el BOM y espacios iniciales: JSON.parse falla con \uFEFF. */
function cleanJsonText(t){
  t=String(t==null?"":t);
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  return t.replace(/^\s+/,"");
}
/* Acepta tanto el respaldo propio como el volcado de semana ({week,parts,weekend}). */
function applyBackupData(data,source){
  if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("El archivo no contiene un respaldo válido");
  var aplicado=false;
  if(data.v&&typeof data.v==="object"&&!Array.isArray(data.v)){S.v=Object.assign({},S.v,data.v);aplicado=true;}
  if(Array.isArray(data.saved)){lsSet(K_SAVED,data.saved);aplicado=true;}
  if(Array.isArray(data.discursos)){lsSet(K_DISC,data.discursos);aplicado=true;}
  if("week" in data||"parts" in data||"weekend" in data){
    var week=normalizeWeek(data.week);
    /* respaldo antiguo: `week` era texto y el dato útil estaba en weekKey */
    var desdeObjeto=!!week.key;
    if(!week.key&&validWeekKey(data.weekKey))week.key=data.weekKey;
    if(week.key&&(!week.label||!week.shortLabel)){
      var wl=weekLabels(week.key);
      if(wl){
        if(!desdeObjeto)week.key=wl.key;
        if(!week.label)week.label=wl.label;
        if(!week.shortLabel)week.shortLabel=wl.shortLabel;
      }
    }
    for(var kw in week)WEEK[kw]=week[kw];
    var parts=normalizeParts(data.parts);if(parts)PARTS=parts;
    var weekend=mergeWeekend(data.weekend);if(weekend)WEEKEND=weekend;
    /* se guarda siempre la forma completa y normalizada, para que al recargar
       loadWeekData la lea sin romperse */
    lsSet(K_WEEK,{week:weekSnapshot(),parts:PARTS,weekend:WEEKEND});
    aplicado=true;
  }
  if(!aplicado)throw new Error("El archivo no tiene datos de respaldo reconocibles");
  /* después de fijar WEEK: si no, K_CUR queda con el weekKey viejo y al
     recargar se descartarían los datos importados */
  persistNow();
  var campos=0;for(var kc in S.v){if(S.v[kc])campos++;}
  render();
  toast("Respaldo importado ✓"+(campos?" ("+campos+" campos)":""));
  return true;
}
function importBackupText(text,sourceName){
  var data;
  try{data=JSON.parse(cleanJsonText(text));}
  catch(err){toast("Archivo inválido: no es un JSON válido");return false;}
  if(S.v&&Object.keys(S.v).some(function(k){return S.v[k];})){
    if(!window.confirm("Se reemplazarán los datos de esta semana en este dispositivo.\n\n¿Importar "+(sourceName||"el respaldo")+"?"))return false;
  }
  try{return applyBackupData(data,sourceName);}
  catch(err){toast("Archivo inválido: "+err.message);return false;}
}
function readFileAsText(file,onDone){
  var r=new FileReader();
  var done=false;
  function finish(ok,payload){
    if(done)return;done=true;
    try{r.abort();}catch(e){}
    onDone(ok,payload);
  }
  r.onload=function(){
    var text=r.result;
    if(typeof text!=="string"){
      try{text=new TextDecoder("utf-8").decode(text);}catch(e){text=String(text||"");}
    }
    finish(true,text);
  };
  r.onerror=function(){finish(false,"No se pudo leer el archivo");};
  r.onabort=function(){finish(false,"Lectura cancelada");};
  try{r.readAsText(file,"utf-8");}
  catch(err){finish(false,"El navegador no pudo abrir el archivo");}
}
function importBackup(){
  var inp=document.createElement("input");
  inp.type="file";
  /* accept amplio: en Android el selector oculta .json si solo se declara application/json */
  inp.accept=".json,application/json,application/octet-stream,text/plain,text/*,*/*";
  inp.multiple=false;
  inp.setAttribute("aria-label","Selecciona el archivo de respaldo");
  inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;";
  var cleaned=false;
  function cleanup(){if(cleaned)return;cleaned=true;if(inp.parentNode)inp.parentNode.removeChild(inp);}
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0];
    inp.value="";           /* permite volver a elegir el mismo archivo */
    if(!f){cleanup();return;}
    readFileAsText(f,function(ok,text){
      cleanup();
      if(!ok){toast("Archivo inválido: "+(text||"no se pudo leer"));return;}
      importBackupText(text,f.name);
    });
  });
  inp.addEventListener("cancel",cleanup);
  document.body.appendChild(inp);
  inp.click();
}
/* Recibe el JSON que Android envía por «Compartir» (share_target del manifest). */
function consumeSharedBackup(){
  if(!("caches" in window))return;
  caches.open(SHARE_CACHE).then(function(c){
    return c.match(shareKeyURL()).then(function(res){
      if(!res)return;
      return res.text().then(function(text){
        try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}
        var ok=importBackupText(text,"el archivo compartido");
        /* solo se vacía la bandeja si la importación se aplicó */
        if(ok)c.delete(shareKeyURL());
      });
    });
  }).catch(function(){});
}
/* Escritorio: abrir el .json con la app (file_handlers del manifest). */
function consumeLaunchedFiles(){
  if(!("launchQueue" in window)||!window.launchQueue.setConsumer)return;
  window.launchQueue.setConsumer(function(params){
    if(!params||!params.files||!params.files.length)return;
    var f=params.files[0];
    Promise.resolve(f.getFile?f.getFile():f).then(function(file){
      if(file&&file.text)return file.text();
      return new Promise(function(resolve,reject){readFileAsText(file,function(ok,t){ok?resolve(t):reject(new Error(t));});});
    }).then(function(text){importBackupText(text,f.name||"archivo");}).catch(function(){toast("No se pudo abrir el archivo");});
  });
}

function weekLabels(key){
  var p=key.split("-");var x=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(x.getTime()))return null;
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  var e=new Date(x.getFullYear(),x.getMonth(),x.getDate()+6);
  var same=(x.getMonth()===e.getMonth());
  var label=same?x.getDate()+"–"+e.getDate()+" de "+MESES[x.getMonth()]+" de "+x.getFullYear():x.getDate()+" de "+MESES[x.getMonth()]+" – "+e.getDate()+" de "+MESES[e.getMonth()]+" de "+e.getFullYear();
  var shortLabel=same?x.getDate()+"–"+e.getDate()+" "+MESES[x.getMonth()]+" "+x.getFullYear():x.getDate()+" "+MESES[x.getMonth()]+" – "+e.getDate()+" "+MESES[e.getMonth()]+" "+e.getFullYear();
  return {key:x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()),label:label,shortLabel:shortLabel};
}

/* ============ EXPORTAR Y COPIAR ============
   Una sola fuente de texto por sección: lo editado por el usuario (S.v) con respaldo
   en las constantes de la semana. Así Copiar, PDF y Compartir nunca salen vacíos. */
function pushRefs(L,p){if(p.refs&&p.refs.length)L.push("Referencias: "+p.refs.map(function(r){return r.t;}).join(" · "));}
function pushNotes(L,pre){var n=val(pre+"notas","");if(n){L.push("");L.push("NOTAS PERSONALES");L.push(n);}}
function headerLines(p){
  var L=[p.section.toUpperCase(),(p.num?p.num+". ":"")+p.title,"Duración: "+p.min+" min"];
  if(p.raw)L.push(p.raw);
  pushRefs(L,p);
  return L;
}
function perlasText(p){
  var L=headerLines(p);
  L.push("");L.push("PREGUNTA 1: "+PERLA1.q);
  L.push("Versículos: "+PERLA1.verses.map(function(v){return v.t;}).join("; "));
  L.push("Publicación: "+PERLA1.pubs.map(function(v){return v.t;}).join("; "));
  L.push("");L.push("MI RESPUESTA");L.push(val("p2.q1.draft",PERLA1.draft));
  L.push("");L.push("INFORMACIÓN ENCONTRADA");
  PERLA1.found.forEach(function(f){L.push("• "+f);});
  L.push("");L.push("PREGUNTA 2: "+PERLA2_Q);
  var picks=[];
  for(var i=0;i<PUNTOS.length;i++){if(S.v["p2.pick."+i])picks.push(i);}
  if(!picks.length){for(var j=0;j<PUNTOS.length;j++)picks.push(j);L.push("(Se incluyen todos los puntos; todavía no has marcado ninguno.)");}
  picks.forEach(function(idx){var pt=PUNTOS[idx];L.push("");L.push(idx+1+") "+pt.v+" — "+pt.idea);L.push("Aprendemos: "+pt.aprendemos);L.push("Aplicación: "+pt.aplicar);L.push("Fuente: "+pt.ref);});
  var r=val("p2.respuesta","");if(r){L.push("");L.push("MI RESPUESTA PREPARADA");L.push(r);}
  pushNotes(L,p.id+".");
  return L.join("\n");
}
function lecturaText(p){
  var L=headerLines(p);
  L.push("");L.push("PASAJE: "+LECTURA_P3.pasaje+" (Traducción del Nuevo Mundo)");
  L.push("");L.push(LECTURA_P3.textoCompleto);
  L.push("");L.push("LECCIÓN: "+LECTURA_P3.leccion);
  LECTURA_P3.consejos.forEach(function(c){L.push("• "+c);});
  pushNotes(L,p.id+".");
  return L.join("\n");
}
function maestrosText(p){
  var M=MAESTROS[p.id]||MAESTROS.p4,pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("LECCIÓN A DEMOSTRAR");L.push(M.leccion);
  L.push("");L.push("MARCO DE CIRCUNSTANCIAS");L.push(val(pre+"marco",M.marco));
  L.push("");L.push("OBJETIVO");L.push(val(pre+"objetivo",M.objetivo));
  L.push("");L.push("TEMA");L.push(val(pre+"tema",M.tema));
  L.push("");L.push("TEXTO BÍBLICO");L.push(val(pre+"texto",M.texto));
  L.push("");L.push("CONVERSACIÓN");L.push(val(pre+"dialogo",M.dialogo));
  L.push("");L.push("PUNTOS A DEMOSTRAR");M.demostrar.forEach(function(x){L.push("✓ "+x);});
  L.push("");L.push("CIERRE");L.push(val(pre+"conclusion",M.conclusion));
  pushNotes(L,pre);
  return L.join("\n");
}
function vidaText(p){
  var pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("INTRODUCCIÓN DEL CONDUCTOR");L.push(val(pre+"introGuion",VIDA_P8.introGuion));
  L.push("");L.push("VIDEO: "+VIDA_P8.video.t);L.push(VIDA_P8.video.u);
  VIDA_P8.preguntas.forEach(function(qa,i){L.push("");L.push("PREGUNTA "+(i+1)+": "+qa.q);L.push("Respuesta: "+val(pre+"a"+i,qa.respuesta));});
  L.push("");L.push("APLICACIÓN PRÁCTICA");L.push(val(pre+"aplicacion",VIDA_P8.aplicacion));
  L.push("");L.push("CIERRE");L.push(val(pre+"cierre",VIDA_P8.cierre));
  pushNotes(L,pre);
  return L.join("\n");
}
function estudioText(p){
  var pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("FUENTE: "+ESTUDIO_P9.fuente.t);L.push(ESTUDIO_P9.libro);
  L.push("");L.push("TEXTOS DESTACADOS");
  ESTUDIO_P9.textosDestacados.forEach(function(t,i){L.push((i+1)+") "+val(pre+"t"+i+".ref",t.ref));L.push(val(pre+"t"+i+".texto",t.texto));L.push("");});
  L.push("PREGUNTAS PARA DIRIGIR EL ESTUDIO");
  ESTUDIO_P9.preguntas.forEach(function(qa,i){L.push("");L.push("Pregunta "+(i+1)+": "+val(pre+"q"+i,qa.q));L.push("Respuesta: "+val(pre+"a"+i,qa.a));});
  pushNotes(L,pre);
  return L.join("\n");
}
function parteSimpleText(p){
  var L=headerLines(p);
  pushNotes(L,p.id+".");
  return L.join("\n");
}
/* El texto de cada parte se decide por su TIPO (detectType), no por su numero.
   Asi el programa puede cambiar de una semana a otra sin romper Copiar/PDF. */
function partText(p){
  if(!p)return "";
  var k=detectType(p).k;
  if(k==="tesoros")return (p.id==="p1")?buildDiscursoTexto():parteSimpleText(p);
  if(k==="perlas")return perlasText(p);
  if(k==="lectura")return lecturaText(p);
  if(k==="maestros")return maestrosText(p);
  if(k==="estudio")return estudioText(p);
  if(k==="vida")return (typeof VIDA_P8!=="undefined"&&VIDA_P8&&VIDA_P8.video)?vidaText(p):parteSimpleText(p);
  return parteSimpleText(p);
}
function atalayaText(){
  var L=["ESTUDIO DE LA ATALAYA","Semana del "+WEEK.label];
  L.push("Artículo: "+val("atalaya.titulo",WEEKEND.atalaya.title));
  L.push("Texto base: "+val("atalaya.textoBase",WEEKEND.atalaya.baseText));
  L.push("Canciones: "+val("atalaya.canciones","Canción inicial: "+WEEKEND.atalaya.openingSong+" · Canción final: "+WEEKEND.atalaya.closingSong));
  if(ATALAYA.intro){L.push("");L.push(ATALAYA.intro);}
  ATALAYA.parrafos.forEach(function(pr,i){
    L.push("");L.push("Párrafo "+(pr.num||i+1));
    L.push(val("atalaya.p"+i+".texto",pr.texto));
    L.push("Pregunta: "+val("atalaya.p"+i+".pregunta",pr.pregunta));
    L.push("Respuesta preparada: "+val("atalaya.p"+i+".respuesta",pr.respuesta));
  });
  var ap=val("atalaya.aplicacion",""),ci=val("atalaya.cierre","");
  if(ap){L.push("");L.push("APLICACIÓN PRÁCTICA");L.push(ap);}
  if(ci){L.push("");L.push("CIERRE");L.push(ci);}
  return L.join("\n");
}
function copyToClipboard(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);toast("Texto copiado ✓");
}
function whatsappShare(title,text){
  var msg=text;if(title&&text.indexOf(title)!==0)msg=title+"\n\n"+text;
  var url="https://wa.me/?text="+encodeURIComponent(msg);
  var w=window.open(url,"_blank");
  if(!w)toast("Permite las ventanas emergentes para compartir");
}
function shareText(title,text){
  if(!text||!String(text).replace(/\s+/g,"").length){toast("No hay texto para compartir");return;}
  if(navigator.share){
    try{
      var pr=navigator.share({title:title,text:text});
      if(pr&&pr.catch)pr.catch(function(err){if(err&&err.name==="AbortError")return;whatsappShare(title,text);});
      return;
    }catch(e){/* sigue al respaldo */}
  }
  whatsappShare(title,text);
}
function openPrint(title,text){
  if(!text||!String(text).replace(/\s+/g,"").length)text="(No hay texto para mostrar en esta sección.)";
  var old=document.getElementById("printOverlay");if(old&&old.parentNode)old.parentNode.removeChild(old);
  var ov=document.createElement("div");ov.id="printOverlay";
  ov.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF;color:#1B2A3A;z-index:100;padding:20px;overflow:auto;";
  var bar=document.createElement("div");bar.className="print-toolbar";
  bar.style.cssText="position:sticky;top:0;background:#FFF;padding:10px;border-bottom:1px solid #D5DDE4;text-align:right;margin-bottom:20px;";
  var bP=document.createElement("button");bP.textContent="Guardar como PDF";
  bP.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;background:#0F6E6E;color:#FFF;cursor:pointer;margin-right:8px;";
  bP.onclick=function(){window.print();};
  var bC=document.createElement("button");bC.textContent="Cerrar";
  bC.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid #D5DDE4;background:#FFF;color:#1B2A3A;cursor:pointer;";
  bC.onclick=function(){if(ov.parentNode)ov.parentNode.removeChild(ov);};
  var bS=document.createElement("button");bS.textContent="Compartir";
  bS.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;background:#2E7D4F;color:#FFF;cursor:pointer;margin-right:8px;";
  bS.onclick=function(){shareText(title,text);};
  bar.appendChild(bP);bar.appendChild(bS);bar.appendChild(bC);
  var h1=document.createElement("h1");h1.style.cssText="font-family:Georgia,serif;font-size:22px;margin:0 0 16px;color:#1B2A3A;";h1.textContent=title;
  var pre=document.createElement("pre");pre.style.cssText="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;line-height:1.6;margin:0;color:#1B2A3A;";pre.textContent=text;
  var foot=document.createElement("div");foot.style.cssText="font-size:12px;color:#5B6B7B;margin-top:30px;";foot.textContent="Reunión Vida y Ministerio Cristianos · "+WEEK.shortLabel+" · Fuentes: wol.jw.org";
  ov.appendChild(bar);ov.appendChild(h1);ov.appendChild(pre);ov.appendChild(foot);document.body.appendChild(ov);
}

/* ============ RENDER Y EVENTOS ============ */
function render(){
  var h="";
  if(S.view==="home")h=viewHome();
  else if(S.view==="part")h=viewPart();
  else if(S.view==="saved")h=viewSaved();
  else if(S.view==="discursos")h=viewDiscursos();
  else if(S.view==="semana")h=viewSemana();
  document.getElementById("app").innerHTML=h;
  timerTick();
}
function go(v,id){S.view=v;S.id=id||null;render();window.scrollTo(0,0);}

function saveAtalaya(){S.v=collectDefaults();persistNow();toast("Atalaya guardada ✓");}
function atalayaAddParrafo(){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo añadido");}
function atalayaDelParrafo(){if(ATALAYA.parrafos.length<=1){toast("Debe quedar al menos 1");return;}ATALAYA.parrafos.pop();S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo quitado");}

var actions={
  go:function(b){go(b.dataset.id);},
  prep:function(b){go("part",b.dataset.id);},
  demo:function(){S.demo=true;render();},
  save:function(){saveMeeting();},
  duplicate:function(){duplicateMeeting();},
  tab:function(b){S.tabWeek=b.dataset.id;render();window.scrollTo(0,0);},
  "open-saved":function(b){var m=savedList().filter(function(x){return x.weekKey===b.dataset.id;})[0];if(m){S.v=JSON.parse(JSON.stringify(m.v));persistNow();S.demo=true;}go("home");toast("Reunión abierta");},
  "del-saved":function(b){lsSet(K_SAVED,savedList().filter(function(x){return x.weekKey!==b.dataset.id;}));toast("Eliminada");render();},
  "del-disc":function(b){lsSet(K_DISC,discursosList().filter(function(x){return x.id!==b.dataset.id;}));toast("Eliminado");render();},
  "week-save":function(){if(weekFromDOM()){saveWeekData();toast("Semana guardada ✓");render();}},
  "week-add":function(){if(!weekFromDOM())return;PARTS.push({id:"n"+Date.now(),section:"SECCIÓN NUEVA",title:"Nueva parte",min:5});saveWeekData();render();window.scrollTo(0,0);},
  "week-up":function(b){if(!weekFromDOM())return;var i=+b.dataset.id;if(i>0){var t=PARTS[i];PARTS[i]=PARTS[i-1];PARTS[i-1]=t;saveWeekData();render();}},
  "week-down":function(b){if(!weekFromDOM())return;var i=+b.dataset.id;if(i<PARTS.length-1){var t=PARTS[i];PARTS[i]=PARTS[i+1];PARTS[i+1]=t;saveWeekData();render();}},
  "week-del":function(b){if(!weekFromDOM())return;PARTS.splice(+b.dataset.id,1);saveWeekData();render();},
  "week-reset":function(){Object.assign(WEEK,JSON.parse(JSON.stringify(WEEK_DEFAULT)));PARTS=JSON.parse(JSON.stringify(PARTS_DEFAULT));WEEKEND=JSON.parse(JSON.stringify(WEEKEND_DEFAULT));lsSet(K_WEEK,null);toast("Semana original restaurada");render();},
  "export-backup":function(){exportBackup();},
  "import-backup":function(){importBackup();},
  "save-disc":function(){saveDiscursoActual();},
  "save-atalaya":function(){saveAtalaya();},
  "atalaya-add":function(){atalayaAddParrafo();},
  "atalaya-del":function(){atalayaDelParrafo();},
  "show-full":function(){var box=document.getElementById("full-disc");if(!box)return;box.innerHTML='<div class="src" style="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;margin-top:12px">'+esc(buildDiscursoTexto())+'</div>';box.scrollIntoView({behavior:"smooth",block:"start"});},
  "gen-perlas":function(){var t=buildPerlasRespuesta();S.v["p2.respuesta"]=t;var f=document.querySelector('[data-k="p2.respuesta"]');if(f)f.value=t;persist();toast("Respuesta generada");},

  "timer-open-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(p)timerOpen(p.num?(p.num+". "+p.title):p.title,p.min);},
  "timer-open-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)timerOpen(d.title,d.duration);},
  "timer-open-atalaya":function(){timerOpen("Estudio de La Atalaya",60);},
  "t-start":function(){timerStart();},
  "t-pause":function(){timerPause();},
  "t-resume":function(){timerStart();},
  "t-reset":function(){timerReset();},
  "t-close":function(){timerClose();},
  "copy-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;copyToClipboard(partText(p));},
  "pdf-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;openPrint(p.title,partText(p));},

  "pdf-atalaya":function(){openPrint(val("atalaya.titulo",WEEKEND.atalaya.title),atalayaText());},
  "share-atalaya":function(){shareText(val("atalaya.titulo",WEEKEND.atalaya.title),atalayaText());},

  "pdf-cur-disc":function(){openPrint(val("p1.d.titulo",discursoActual().title),buildDiscursoTexto());},
  "share-cur-disc":function(){var D=discursoActual();shareText(val("p1.d.titulo",D.title),buildDiscursoTexto());},
  "copy-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)copyToClipboard(d.text);},
  "pdf-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)openPrint(d.title,d.text);},
  "share-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)shareText(d.title,d.text);}
};

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.confirm&&!b.dataset.armed){
    b.dataset.armed="1";b.dataset.label=b.textContent;b.textContent="¿Seguro? Toca otra vez";b.classList.add("armed");
    setTimeout(function(){if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove("armed");}},3000);
    return;
  }
  var fn=actions[b.dataset.act];if(fn)fn(b);
});

function onField(e){
  var el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  if(el.type==="checkbox"){S.v[k]=el.checked?"1":"";var n=document.getElementById("pickN");if(n)n.textContent=pickedCount();}
  else{S.v[k]=el.value;}
  persist();
}
function onFieldBlur(e){
  var el=e.target;if(el.dataset&&el.dataset.k){persistNow();}
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("blur",onFieldBlur,true);

(function seed(){var seed=discSeedFields();for(var k in seed){if(!(k in S.v)||S.v[k]==="")S.v[k]=seed[k];}})();
(function restoreAtalaya(){var t=parseInt(S.v["atalaya.total"],10)||0;while(ATALAYA.parrafos.length<t){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});}})();

render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      /* recoger el archivo compartido en cuanto el SW controle la página */
      if(navigator.serviceWorker.controller)consumeSharedBackup();
      else if(reg&&reg.active)reg.active.postMessage({type:"ping"});
    }).catch(function(){});
    navigator.serviceWorker.addEventListener("controllerchange",consumeSharedBackup);
  });
}
/* al abrir desde «Compartir» en Android, Android añade el archivo antes de cargar la página */
window.addEventListener("load",function(){consumeSharedBackup();});
consumeLaunchedFiles();
})();
