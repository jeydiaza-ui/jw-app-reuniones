/* Quita el BOM y espacios iniciales: JSON.parse falla con \uFEFF. */
function cleanJsonText(t){
  t=String(t==null?"":t);
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  return t.replace(/^\s+/,"");
}
/* Acepta tanto el respaldo propio como el volcado de semana ({week,parts,weekend}). */
function applyBackupData(data,source){
  if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("El archivo no contiene un respaldo válido");
  var aplicado=false;
  if(data.v&&typeof data.v==="object"&&!Array.isArray(data.v)){S.v=Object.assign({},S.v,data.v);aplicado=true;}
  if(Array.isArray(data.saved)){lsSet(K_SAVED,data.saved);aplicado=true;}
  if(Array.isArray(data.discursos)){lsSet(K_DISC,data.discursos);aplicado=true;}
  if("week" in data||"parts" in data||"weekend" in data){
    var week=normalizeWeek(data.week);
    /* respaldo antiguo: `week` era texto y el dato útil estaba en weekKey */
    var desdeObjeto=!!week.key;
    if(!week.key&&validWeekKey(data.weekKey))week.key=data.weekKey;
    if(week.key&&(!week.label||!week.shortLabel)){
      var wl=weekLabels(week.key);
      if(wl){
        if(!desdeObjeto)week.key=wl.key;
        if(!week.label)week.label=wl.label;
        if(!week.shortLabel)week.shortLabel=wl.shortLabel;
      }
    }
    for(var kw in week)WEEK[kw]=week[kw];
    var parts=normalizeParts(data.parts);if(parts)PARTS=parts;
    var weekend=mergeWeekend(data.weekend);if(weekend)WEEKEND=weekend;
    /* se guarda siempre la forma completa y normalizada, para que al recargar
       loadWeekData la lea sin romperse */
    lsSet(K_WEEK,{week:weekSnapshot(),parts:PARTS,weekend:WEEKEND});
    aplicado=true;
  }
  if(!aplicado)throw new Error("El archivo no tiene datos de respaldo reconocibles");
  /* después de fijar WEEK: si no, K_CUR queda con el weekKey viejo y al
     recargar se descartarían los datos importados */
  persistNow();
  var campos=0;for(var kc in S.v){if(S.v[kc])campos++;}
  render();
  toast("Respaldo importado ✓"+(campos?" ("+campos+" campos)":""));
  return true;
}
function importBackupText(text,sourceName){
  var data;
  try{data=JSON.parse(cleanJsonText(text));}
  catch(err){toast("Archivo inválido: no es un JSON válido");return false;}
  if(S.v&&Object.keys(S.v).some(function(k){return S.v[k];})){
    if(!window.confirm("Se reemplazarán los datos de esta semana en este dispositivo.\n\n¿Importar "+(sourceName||"el respaldo")+"?"))return false;
  }
  try{return applyBackupData(data,sourceName);}
  catch(err){toast("Archivo inválido: "+err.message);return false;}
}
function readFileAsText(file,onDone){
  var r=new FileReader();
  var done=false;
  function finish(ok,payload){
    if(done)return;done=true;
    try{r.abort();}catch(e){}
    onDone(ok,payload);
  }
  r.onload=function(){
    var text=r.result;
    if(typeof text!=="string"){
      try{text=new TextDecoder("utf-8").decode(text);}catch(e){text=String(text||"");}
    }
    finish(true,text);
  };
  r.onerror=function(){finish(false,"No se pudo leer el archivo");};
  r.onabort=function(){finish(false,"Lectura cancelada");};
  try{r.readAsText(file,"utf-8");}
  catch(err){finish(false,"El navegador no pudo abrir el archivo");}
}
function importBackup(){
  var inp=document.createElement("input");
  inp.type="file";
  /* accept amplio: en Android el selector oculta .json si solo se declara application/json */
  inp.accept=".json,application/json,application/octet-stream,text/plain,text/*,*/*";
  inp.multiple=false;
  inp.setAttribute("aria-label","Selecciona el archivo de respaldo");
  inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;";
  var cleaned=false;
  function cleanup(){if(cleaned)return;cleaned=true;if(inp.parentNode)inp.parentNode.removeChild(inp);}
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0];
    inp.value="";           /* permite volver a elegir el mismo archivo */
    if(!f){cleanup();return;}
    readFileAsText(f,function(ok,text){
      cleanup();
      if(!ok){toast("Archivo inválido: "+(text||"no se pudo leer"));return;}
      importBackupText(text,f.name);
    });
  });
  inp.addEventListener("cancel",cleanup);
  document.body.appendChild(inp);
  inp.click();
}
/* Recibe el JSON que Android envía por «Compartir» (share_target del manifest). */
function consumeSharedBackup(){
  if(!("caches" in window))return;
  caches.open(SHARE_CACHE).then(function(c){
    return c.match(shareKeyURL()).then(function(res){
      if(!res)return;
      return res.text().then(function(text){
        try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}
        var ok=importBackupText(text,"el archivo compartido");
        /* solo se vacía la bandeja si la importación se aplicó */
        if(ok)c.delete(shareKeyURL());
      });
    });
  }).catch(function(){});
}
/* Escritorio: abrir el .json con la app (file_handlers del manifest). */
function consumeLaunchedFiles(){
  if(!("launchQueue" in window)||!window.launchQueue.setConsumer)return;
  window.launchQueue.setConsumer(function(params){
    if(!params||!params.files||!params.files.length)return;
    var f=params.files[0];
    Promise.resolve(f.getFile?f.getFile():f).then(function(file){
      if(file&&file.text)return file.text();
      return new Promise(function(resolve,reject){readFileAsText(file,function(ok,t){ok?resolve(t):reject(new Error(t));});});
    }).then(function(text){importBackupText(text,f.name||"archivo");}).catch(function(){toast("No se pudo abrir el archivo");});
  });
}

function weekLabels(key){
  var p=key.split("-");var x=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(x.getTime()))return null;
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  var e=new Date(x.getFullYear(),x.getMonth(),x.getDate()+6);

/* Lee los campos del editor en memoria (no guarda). Devuelve false si hay un dato inválido. */
function weekFromDOM(){
  var g=function(k,def){var el=document.querySelector('[data-wk="'+k+'"]');return el?el.value:def;};
  var raw=String(g("key",WEEK.key)||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)){toast("La fecha debe tener formato AAAA-MM-DD");return false;}
  var wl=weekLabels(raw);
  if(!wl){toast("Fecha no válida");return false;}
  WEEK.key=wl.key;WEEK.label=wl.label;WEEK.shortLabel=wl.shortLabel;
  WEEK.reading=g("reading",WEEK.reading);WEEK.program=g("program",WEEK.program);
  PARTS.forEach(function(p,i){
    p.section=g("p"+i+".section",p.section);
    var n=String(g("p"+i+".num","")).trim();if(n)p.num=n;else delete p.num;
    p.title=g("p"+i+".title",p.title);
    p.min=Math.max(1,parseInt(g("p"+i+".min",p.min),10)||1);
    var r=String(g("p"+i+".raw","")||"");if(r.trim())p.raw=r;else delete p.raw;
  });
  WEEKEND.discursoPublico.title=g("wk.dp.title",WEEKEND.discursoPublico.title);
  WEEKEND.discursoPublico.speaker=g("wk.dp.speaker",WEEKEND.discursoPublico.speaker);
  WEEKEND.atalaya.title=g("wk.at.title",WEEKEND.atalaya.title);
  WEEKEND.atalaya.openingSong=g("wk.at.open",WEEKEND.atalaya.openingSong);
  WEEKEND.atalaya.baseText=g("wk.at.base",WEEKEND.atalaya.baseText);
  WEEKEND.atalaya.closingSong=g("wk.at.close",WEEKEND.atalaya.closingSong);
  return true;
}

/* ============ EXPORTAR Y COPIAR ============
   Una sola fuente de texto por sección: lo editado por el usuario (S.v) con respaldo
   en las constantes de la semana. Así Copiar, PDF y Compartir nunca salen vacíos. */
function pushRefs(L,p){if(p.refs&&p.refs.length)L.push("Referencias: "+p.refs.map(function(r){return r.t;}).join(" · "));}
function pushNotes(L,pre){var n=val(pre+"notas","");if(n){L.push("");L.push("NOTAS PERSONALES");L.push(n);}}
function headerLines(p){
  var L=[p.section.toUpperCase(),(p.num?p.num+". ":"")+p.title,"Duración: "+p.min+" min"];
  if(p.raw)L.push(p.raw);
  pushRefs(L,p);
  return L;
}
function perlasText(p){
  var L=headerLines(p);
  L.push("");L.push("PREGUNTA 1: "+PERLA1.q);
  L.push("Versículos: "+PERLA1.verses.map(function(v){return v.t;}).join("; "));
  L.push("Publicación: "+PERLA1.pubs.map(function(v){return v.t;}).join("; "));
  L.push("");L.push("MI RESPUESTA");L.push(val("p2.q1.draft",PERLA1.draft));
  L.push("");L.push("INFORMACIÓN ENCONTRADA");
  PERLA1.found.forEach(function(f){L.push("• "+f);});
  L.push("");L.push("PREGUNTA 2: "+PERLA2_Q);
  var picks=[];
  for(var i=0;i<PUNTOS.length;i++){if(S.v["p2.pick."+i])picks.push(i);}
  if(!picks.length){for(var j=0;j<PUNTOS.length;j++)picks.push(j);L.push("(Se incluyen todos los puntos; todavía no has marcado ninguno.)");}
  picks.forEach(function(idx){var pt=PUNTOS[idx];L.push("");L.push(idx+1+") "+pt.v+" — "+pt.idea);L.push("Aprendemos: "+pt.aprendemos);L.push("Aplicación: "+pt.aplicar);L.push("Fuente: "+pt.ref);});
  var r=val("p2.respuesta","");if(r){L.push("");L.push("MI RESPUESTA PREPARADA");L.push(r);}
  pushNotes(L,p.id+".");
  return L.join("\n");
}
function lecturaText(p){
  var L=headerLines(p);
  L.push("");L.push("PASAJE: "+LECTURA_P3.pasaje+" (Traducción del Nuevo Mundo)");
  L.push("");L.push(LECTURA_P3.textoCompleto);
  L.push("");L.push("LECCIÓN: "+LECTURA_P3.leccion);
  LECTURA_P3.consejos.forEach(function(c){L.push("• "+c);});
  pushNotes(L,p.id+".");
  return L.join("\n");
}
function maestrosText(p){
  var M=MAESTROS[p.id]||MAESTROS.p4,pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("LECCIÓN A DEMOSTRAR");L.push(M.leccion);
  L.push("");L.push("MARCO DE CIRCUNSTANCIAS");L.push(val(pre+"marco",M.marco));
  L.push("");L.push("OBJETIVO");L.push(val(pre+"objetivo",M.objetivo));
  L.push("");L.push("TEMA");L.push(val(pre+"tema",M.tema));
  L.push("");L.push("TEXTO BÍBLICO");L.push(val(pre+"texto",M.texto));
  L.push("");L.push("CONVERSACIÓN");L.push(val(pre+"dialogo",M.dialogo));
  L.push("");L.push("PUNTOS A DEMOSTRAR");M.demostrar.forEach(function(x){L.push("✓ "+x);});
  L.push("");L.push("CIERRE");L.push(val(pre+"conclusion",M.conclusion));
  pushNotes(L,pre);
  return L.join("\n");
}
function vidaText(p){
  var pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("INTRODUCCIÓN DEL CONDUCTOR");L.push(val(pre+"introGuion",VIDA_P8.introGuion));
  L.push("");L.push("VIDEO: "+VIDA_P8.video.t);L.push(VIDA_P8.video.u);
  VIDA_P8.preguntas.forEach(function(qa,i){L.push("");L.push("PREGUNTA "+(i+1)+": "+qa.q);L.push("Respuesta: "+val(pre+"a"+i,qa.respuesta));});
  L.push("");L.push("APLICACIÓN PRÁCTICA");L.push(val(pre+"aplicacion",VIDA_P8.aplicacion));
  L.push("");L.push("CIERRE");L.push(val(pre+"cierre",VIDA_P8.cierre));
  pushNotes(L,pre);
  return L.join("\n");
}
function estudioText(p){
  var pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("FUENTE: "+ESTUDIO_P9.fuente.t);L.push(ESTUDIO_P9.libro);
  L.push("");L.push("TEXTOS DESTACADOS");
  ESTUDIO_P9.textosDestacados.forEach(function(t,i){L.push((i+1)+") "+val(pre+"t"+i+".ref",t.ref));L.push(val(pre+"t"+i+".texto",t.texto));L.push("");});
  L.push("PREGUNTAS PARA DIRIGIR EL ESTUDIO");
  ESTUDIO_P9.preguntas.forEach(function(qa,i){L.push("");L.push("Pregunta "+(i+1)+": "+val(pre+"q"+i,qa.q));L.push("Respuesta: "+val(pre+"a"+i,qa.a));});
  pushNotes(L,pre);
  return L.join("\n");
}
function parteSimpleText(p){
  var L=headerLines(p);
  pushNotes(L,p.id+".");
  return L.join("\n");
}
/* El texto de cada parte se decide por su TIPO (detectType), no por su numero.
   Asi el programa puede cambiar de una semana a otra sin romper Copiar/PDF. */
function partText(p){
  if(!p)return "";
  var k=detectType(p).k;
  if(k==="tesoros")return (p.id==="p1")?buildDiscursoTexto():parteSimpleText(p);
  if(k==="perlas")return perlasText(p);
  if(k==="lectura")return lecturaText(p);
  if(k==="maestros")return maestrosText(p);
  if(k==="estudio")return estudioText(p);
  if(k==="vida")return (typeof VIDA_P8!=="undefined"&&VIDA_P8&&VIDA_P8.activa)?vidaText(p):parteSimpleText(p);
  return parteSimpleText(p);
}
function atalayaText(){
  var L=["ESTUDIO DE LA ATALAYA","Semana del "+WEEK.label];
  L.push("Artículo: "+val("atalaya.titulo",WEEKEND.atalaya.title));
  L.push("Texto base: "+val("atalaya.textoBase",WEEKEND.atalaya.baseText));
  L.push("Canciones: "+val("atalaya.canciones","Canción inicial: "+WEEKEND.atalaya.openingSong+" · Canción final: "+WEEKEND.atalaya.closingSong));
  if(ATALAYA.intro){L.push("");L.push(ATALAYA.intro);}
  ATALAYA.parrafos.forEach(function(pr,i){
    L.push("");L.push("Párrafo "+(pr.num||i+1));
    L.push(val("atalaya.p"+i+".texto",pr.texto));
    L.push("Pregunta: "+val("atalaya.p"+i+".pregunta",pr.pregunta));
    L.push("Respuesta preparada: "+val("atalaya.p"+i+".respuesta",pr.respuesta));
  });
  var ap=val("atalaya.aplicacion",""),ci=val("atalaya.cierre","");
  if(ap){L.push("");L.push("APLICACIÓN PRÁCTICA");L.push(ap);}
  if(ci){L.push("");L.push("CIERRE");L.push(ci);}
  return L.join("\n");
}
function copyToClipboard(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);toast("Texto copiado ✓");
}
function whatsappShare(title,text){
  var msg=text;if(title&&text.indexOf(title)!==0)msg=title+"\n\n"+text;
  var url="https://wa.me/?text="+encodeURIComponent(msg);
  var w=window.open(url,"_blank");
  if(!w)toast("Permite las ventanas emergentes para compartir");
}
function shareText(title,text){
  if(!text||!String(text).replace(/\s+/g,"").length){toast("No hay texto para compartir");return;}
  if(navigator.share){
    try{
      var pr=navigator.share({title:title,text:text});
      if(pr&&pr.catch)pr.catch(function(err){if(err&&err.name==="AbortError")return;whatsappShare(title,text);});
      return;
    }catch(e){/* sigue al respaldo */}
  }
  whatsappShare(title,text);
}
function openPrint(title,text){
  if(!text||!String(text).replace(/\s+/g,"").length)text="(No hay texto para mostrar en esta sección.)";
  var old=document.getElementById("printOverlay");if(old&&old.parentNode)old.parentNode.removeChild(old);
  var ov=document.createElement("div");ov.id="printOverlay";
  ov.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF;color:#1B2A3A;z-index:100;padding:20px;overflow:auto;";
  var bar=document.createElement("div");bar.className="print-toolbar";
  bar.style.cssText="position:sticky;top:0;background:#FFF;padding:10px;border-bottom:1px solid #D5DDE4;text-align:right;margin-bottom:20px;";
  var bP=document.createElement("button");bP.textContent="Guardar como PDF";
  bP.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;background:#0F6E6E;color:#FFF;cursor:pointer;margin-right:8px;";
  bP.onclick=function(){window.print();};
  var bC=document.createElement("button");bC.textContent="Cerrar";
  bC.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid #D5DDE4;background:#FFF;color:#1B2A3A;cursor:pointer;";
  bC.onclick=function(){if(ov.parentNode)ov.parentNode.removeChild(ov);};
  var bS=document.createElement("button");bS.textContent="Compartir";
  bS.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;background:#2E7D4F;color:#FFF;cursor:pointer;margin-right:8px;";
  bS.onclick=function(){shareText(title,text);};
  bar.appendChild(bP);bar.appendChild(bS);bar.appendChild(bC);
  var h1=document.createElement("h1");h1.style.cssText="font-family:Georgia,serif;font-size:22px;margin:0 0 16px;color:#1B2A3A;";h1.textContent=title;
  var pre=document.createElement("pre");pre.style.cssText="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;line-height:1.6;margin:0;color:#1B2A3A;";pre.textContent=text;
  var foot=document.createElement("div");foot.style.cssText="font-size:12px;color:#5B6B7B;margin-top:30px;";foot.textContent="Reunión Vida y Ministerio Cristianos · "+WEEK.shortLabel+" · Fuentes: wol.jw.org";
  ov.appendChild(bar);ov.appendChild(h1);ov.appendChild(pre);ov.appendChild(foot);document.body.appendChild(ov);
}

/* ============ RENDER Y EVENTOS ============ */
function render(){
  var h="";
  if(S.view==="home")h=viewHome();
  else if(S.view==="part")h=viewPart();
  else if(S.view==="saved")h=viewSaved();
  else if(S.view==="discursos")h=viewDiscursos();
  else if(S.view==="semana")h=viewSemana();
  document.getElementById("app").innerHTML=h;
  timerTick();
}
function go(v,id){S.view=v;S.id=id||null;render();window.scrollTo(0,0);}

function saveAtalaya(){S.v=collectDefaults();persistNow();toast("Atalaya guardada ✓");}
function atalayaAddParrafo(){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo añadido");}
function atalayaDelParrafo(){if(ATALAYA.parrafos.length<=1){toast("Debe quedar al menos 1");return;}ATALAYA.parrafos.pop();S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo quitado");}

  "t-reset":function(){timerReset();},
  "t-close":function(){timerClose();},
  "copy-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;copyToClipboard(partText(p));},
  "pdf-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;openPrint(p.title,partText(p));},

};

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.confirm&&!b.dataset.armed){
    b.dataset.armed="1";b.dataset.label=b.textContent;b.textContent="¿Seguro? Toca otra vez";b.classList.add("armed");
    setTimeout(function(){if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove("armed");}},3000);
    return;
  }
  var fn=actions[b.dataset.act];if(fn)fn(b);
});

function onField(e){
  var el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  if(el.type==="checkbox"){S.v[k]=el.checked?"1":"";var n=document.getElementById("pickN");if(n)n.textContent=pickedCount();}
  else{S.v[k]=el.value;}
  persist();
}
function onFieldBlur(e){
  var el=e.target;if(el.dataset&&el.dataset.k){persistNow();}
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("blur",onFieldBlur,true);

(function seed(){var seed=discSeedFields();for(var k in seed){if(!(k in S.v)||S.v[k]==="")S.v[k]=seed[k];}})();
(function restoreAtalaya(){var t=parseInt(S.v["atalaya.total"],10)||0;while(ATALAYA.parrafos.length<t){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});}})();

render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      /* recoger el archivo compartido en cuanto el SW controle la página */
      if(navigator.serviceWorker.controller)consumeSharedBackup();
      else if(reg&&reg.active)reg.active.postMessage({type:"ping"});
    }).catch(function(){});
    navigator.serviceWorker.addEventListener("controllerchange",consumeSharedBackup);
  });
}
/* al abrir desde «Compartir» en Android, Android añade el archivo antes de cargar la página */
window.addEventListener("load",function(){consumeSharedBackup();});
consumeLaunchedFiles();
})();
</script>
