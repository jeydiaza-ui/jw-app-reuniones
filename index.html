/* ============ DISCURSO 1 — NUEVA ESTRUCTURA ============
   Cada punto tiene UN texto bíblico principal (literal) y notas de apoyo (paráfrasis). */
var DISCURSO_T1 = {
  title:"La esperanza es clave para estar contentos",
  duration:10,
  intro:"Hermanos, ¿alguna vez han sentido que la asignación que tienen es demasiado pesada? ¿O que otros reciben oportunidades que ustedes desearían tener? Esta semana la lectura es Jeremías 45 y 46. El capítulo 45 es el más corto del libro: cinco versículos. Y es muy especial, porque no es un mensaje para toda la nación, sino para una sola persona: Baruc, el secretario del profeta Jeremías. Baruc era un hombre fiel. Escribió dos veces el rollo de los mensajes de Jeremías, acompañó al profeta durante años y hasta fue con él a Egipto. Pero hubo un momento en que se sintió agotado y descontento. Lo que Jehová le dijo a él nos ayuda a todos nosotros. Veamos por qué la esperanza es clave para estar contentos.",
  desarrollo:[
    {
      titulo:"Primer punto: El descontento de Baruc",
      texto:{
        ref:"Jer 45:1-3",
        intro:"Leamos el contexto. Fijémonos primero en la fecha: el cuarto año de Jehoiaquim, es decir, el año 605 antes de nuestra era. En ese momento Babilonia estaba creciendo como potencia mundial. Para Judá eran días de mucha tensión. Y Baruc no era un hombre cualquiera: su hermano Seraíah ocupaba un puesto importante en la corte (Jeremías 51:59). Es probable que Baruc hubiera podido tener una vida cómoda y un cargo de prestigio. Pero su asignación era otra: escribir y transmitir un mensaje de condena contra una nación desobediente. Imagínese la presión: copiar a mano, durante meses, palabras que enfurecían a los líderes del país.",
        lectura:"En el cuarto año de Jehoiaquim hijo de Josías —el rey de Judá—, cuando Baruc hijo de Nerías escribía en un libro las palabras que el profeta Jeremías le dictaba, Jeremías le dijo las siguientes palabras: “Esto es lo que Jehová, el Dios de Israel, dice sobre ti, Baruc: ‘Tú dijiste: «¡Pobre de mí, porque Jehová le ha añadido tristeza a mi dolor! Estoy agotado de tanto suspirar, y no encuentro alivio»’”.»",
        explicacion:"Por eso dijo: «Jehová le ha añadido tristeza a mi dolor». Es interesante que no culpó a los babilonios ni al rey: sintió que Jehová le había añadido peso. Se estaba agotando, y «no encontraba alivio». ¿Y qué le dijo Jehová? Leamos Jeremías 45:4, 5: «Debes decirle a él: “Esto es lo que dice Jehová: ‘¡Mira! Voy a derrumbar lo que he edificado y voy a arrancar lo que he plantado, el país entero. Pero tú andas buscando cosas grandes para ti. Deja de buscar esas cosas. Porque voy a mandarle una calamidad a toda la gente —afirma Jehová—, pero a ti te daré tu vida como botín de guerra vayas donde vayas’”». Notemos el tono: Jehová no lo destruyó ni lo humilló. Le habló con franqueza, como un padre cariñoso: «Deja de buscar esas cosas»."
      },
      apoyo:"La Atalaya de julio de 2025, página 22 párrafos 8 y 9, explica que Baruc perdió de vista lo más importante: concentrarse en lo que Jehová quería que hiciera. Empezó a pensar demasiado en sí mismo y en lo que él quería hacer. ¿Cuáles eran esas «cosas grandes»? No lo sabemos con exactitud. Quizá un puesto de honor, seguridad económica, reconocimiento, o simplemente una vida tranquila sin persecución. Lo cierto es que Baruc estaba midiendo su situación con la vara equivocada.",
      leccion:"Si dejamos de estar contentos con lo que tenemos, podemos perder la alegría y tomar malas decisiones (La Atalaya, julio de 2025, página 20 párrafo 2). Piense en lo que pasó con Baruc: no abandonó a Jeremías. Aceptó la corrección y siguió sirviendo. Eso fue lo que lo salvó."
    },
    {
      titulo:"Segundo punto: El peligro de dejar de estar contentos",
      texto:{
        ref:"1 Cor 4:6, 7",
        intro:"¿Por qué es tan peligroso el descontento? Porque no se queda en un simple sentimiento. Crece y puede llevarnos a decisiones que dañan nuestra amistad con Jehová. La Atalaya menciona algunos ejemplos reales: hay quienes trabajan muchísimas horas extra para comprar cosas que en realidad no necesitan, y otros han llegado a robar dinero o bienes porque pensaron: «Me lo merezco», «Ya me cansé de esperar» o «Puedo llevarme esto ahora y devolverlo después».",
        lectura:"Hermanos, he dicho estas cosas usándome a mí y a Apolos como ejemplos para su beneficio, para que aprendan de nosotros esta regla: “No vayan más allá de las cosas que están escritas”. Así no se llenarán de orgullo y no se pondrán a favor de uno y en contra de otro. Pues ¿quién hace que tú seas diferente a los demás? En realidad, ¿qué tienes tú que no hayas recibido? Entonces, si lo recibiste, ¿por qué vas presumiendo como si no lo hubieras recibido?».",
        explicacion:"Esa es la clave: todo lo que tenemos lo hemos recibido. Los talentos, la congregación donde servimos, las asignaciones, la salud, el tiempo: todo es un regalo de Jehová por su bondad inmerecida. Romanos 12:3 y 6 lo confirma: «Por la bondad inmerecida que se me ha mostrado, le digo a cada uno de ustedes que no piense de sí mismo más de lo que debe pensar, sino que piense de un modo que demuestre buen juicio, según la medida de fe que Dios le haya dado. [...] Así que tenemos distintos dones según la bondad inmerecida que se nos ha mostrado». Y Efesios 2:8, 9 añade: «Por esta bondad inmerecida, ustedes han sido salvados mediante la fe. Pero no ha sido por sus propios méritos, sino que es un regalo de Dios. En efecto, no es por las obras, para que nadie tenga motivos para presumir»."
      },
      apoyo:"Proverbios 30:9 muestra adónde puede llevar ese razonamiento: «No sea que me sacie y reniegue de ti diciendo “¿Quién es Jehová?”, o termine en la pobreza y robe, deshonrando así el nombre de mi Dios». Robar es robar, aunque nos convenzamos de que tenemos razones. Y hay algo todavía más serio: algunos se han sentido tan decepcionados por no recibir cierta responsabilidad que han dejado de servir a Jehová. Gálatas 6:9 nos advierte: «Así que no dejemos de hacer lo que está bien, porque al debido tiempo cosecharemos si no nos cansamos».",
      leccion:"Nadie «se gana» una asignación. Jehová no nos debe nada. Cuando entendemos eso, dejamos de mirar lo que otros tienen y empezamos a valorar lo que nosotros tenemos. ¿Cómo puede un siervo dedicado llegar al punto de dejar de servir? Poco a poco: primero deja de estar contento; después empieza a compararse; luego se aísla; y al final toma decisiones que nunca habría imaginado."
    },
    {
      titulo:"Tercer punto: La esperanza corrige el rumbo",
      texto:{
        ref:"Jer 45:5",
        intro:"Ahora bien, Jehová no solo corrigió a Baruc: le dio algo que le levantó el ánimo. Le dijo: «a ti te daré tu vida como botín de guerra vayas donde vayas». En medio de una calamidad nacional, Jehová le garantizó a Baruc lo más valioso: la vida. No le prometió riquezas ni un puesto importante. Le prometió que sobreviviría.",
        lectura:"«Pero tú andas buscando cosas grandes para ti. Deja de buscar esas cosas. Porque voy a mandarle una calamidad a toda la gente —afirma Jehová—, pero a ti te daré tu vida como botín de guerra vayas donde vayas».",
        explicacion:"La Atalaya de julio de 2025, página 24 párrafos 13 y 14, explica por qué la esperanza es tan importante hoy. Vivimos en «los últimos días» y todos tenemos problemas que son «difíciles de soportar» (2 Timoteo 3:1). Jehová nos ayuda cada día dándonos guía, fuerzas y apoyo (Salmo 145:14). Pero además nos da una esperanza que puede sostenernos en los peores momentos. Pensemos en algunas promesas concretas: «los pobres no serán olvidados para siempre; la esperanza de los mansos no desaparecerá jamás» (Salmo 9:18); él «rescatará al pobre que grita por ayuda» y «les salvará la vida» (Salmo 72:12-14); «les secará toda lágrima de sus ojos, y la muerte ya no existirá, ni habrá más tristeza ni llanto ni dolor» (Apocalipsis 21:3, 4)."
      },
      apoyo:"2 Corintios 4:17, 18: «Porque, aunque las dificultades son momentáneas y livianas, producen en nosotros una gloria de una grandeza cada vez más extraordinaria, una gloria eterna, mientras mantenemos la vista fija en las cosas que no se ven, y no en las cosas que se ven. Porque las cosas que se ven son temporales, pero las que no se ven son eternas». La Atalaya compara la esperanza con un par de gafas que nos ayudan a ver más claramente el futuro Paraíso. Si estamos agobiados por problemas económicos, podemos imaginarnos la vida cuando ya no existan ni el dinero ni las deudas ni la pobreza. Si nos sentimos decepcionados porque no recibimos cierta asignación, podemos pensar en lo poco que nos importará eso cuando seamos perfectos y llevemos miles de años sirviendo a Jehová. 1 Timoteo 6:19 dice que así nos conseguimos «un tesoro, unos buenos cimientos para el futuro».",
      leccion:"La esperanza no es un consuelo vacío: es lo que corrige el rumbo cuando el descontento nos desvía. Si la alimentamos todos los días, nos ayuda a estar contentos ahora y a mantenernos fieles hasta el final."
    }
  ],
  aplicacion:"Hermanos, ¿qué «cosas grandes» podríamos estar buscando nosotros? Un puesto, el reconocimiento de los hermanos, más dinero, una vida sin sacrificios. Si notamos que el descontento está creciendo, hagamos lo que hizo Baruc: aceptar la corrección y volver a mirar la esperanza. Tres preguntas para llevarnos esta semana: 1) ¿Estoy contento con lo que Jehová me ha dado? 2) ¿Estoy alimentando mi esperanza todos los días? 3) ¿Estoy tratando a los hermanos como amigos, o los estoy comparando conmigo?",
  conclusion:"Baruc aceptó la corrección, y Jehová le conservó la vida. Su historia está en la Biblia no para avergonzarlo, sino para enseñarnos algo: la esperanza es clave para estar contentos. Que nosotros también podamos decir, como el salmista: «Jehová sostiene a todos los que están a punto de caer y levanta a todos los que están encorvados» (Salmo 145:14). Nuestras pruebas son momentáneas. Lo que Jehová tiene preparado es eterno."
};

var PERLA1={
  q:"Jer 40:12. ¿Cómo demuestra este versículo que Jehová le dio a su pueblo la buena tierra descrita en Deuteronomio 8:6-8?",
  verses:[{t:"Jer 40:12",u:bc("/4/0")},{t:"Dt 8:6-8",u:bc("/5/0")}],
  pubs:[{t:"w06 15/6 16 párr. 4",u:pc("/4/0")}],
  found:[
    "w06 15/6 pág. 16, párr. 4: Moisés prometió a Israel una tierra de vides, higos y granadas (Dt 8:8). Las vides eran tan abundantes y productivas que, incluso en 607 a. E.C., cuando los ejércitos de Nabucodonosor devastaron Judá, los que quedaron en la tierra recogieron vino y fruta de verano en gran cantidad (Jer 40:12; 52:16).",
    "Jer 40:10-12: Guedalías animó a recoger vino, fruta de verano y aceite, y los judíos dispersos volvieron a Judá y recogieron mucho vino y mucha fruta."
  ],
  draft:"Dt 8:6-8 describe una tierra buena, con vides, higos y granadas. Jer 40:12 muestra que, incluso después de la devastación de Judá, la tierra seguía siendo tan fértil que los judíos que volvieron recogieron mucho vino y fruta de verano. Así se ve que Jehová sí les dio la buena tierra que había prometido (w06 15/6 pág. 16, párr. 4)."
};
var PERLA2_Q="¿Qué perlas espirituales ha encontrado en la lectura bíblica de esta semana?";

var PUNTOS=[
 {v:"Jer 40:2, 3",vu:bc("/1/0"),idea:"Nebuzaradán, jefe de la guardia babilonio, le dice a Jeremías que Jehová había anunciado esta calamidad y que le sobrevino al pueblo por pecar contra Él y no obedecer su voz.",fuentes:["j40","w80"],ref:"Biblia de estudio, Jer 40:2, 3; La Atalaya 15/10/1980, párr. 3.",aprendemos:"Lo que Jehová anuncia se cumple.",aplicar:"Esto nos enseña una lección muy práctica. Jehová nos advierte por amor, pero muchas veces no queremos esperar a ver el cumplimiento para obedecer. Hoy recibimos advertencias claras en la Biblia: evitar malas compañías, cuidar lo que vemos y escuchamos, mantenernos separados del mundo. A veces pensamos «a mí no me va a pasar nada», pero la historia de Judá nos recuerda que las advertencias de Jehová siempre se cumplen. ¿Verdad que queremos ser de los que escuchan desde el principio y no de los que aprenden por las malas? Tomemos en serio cada consejo, porque siempre busca nuestro bien."},
 {v:"Jer 40:4-6",vu:bc("/1/0"),idea:"Soltado de las esposas, Jeremías puede elegir adónde ir; decide quedarse con Guedalías en Mizpá, y el jefe de la guardia le da víveres y un regalo.",fuentes:["j40","jr","r40"],ref:"Biblia de estudio, Jer 40:4-6; jr cap. 15, párr. 16.",aprendemos:"Jehová puede usar a cualquiera para cuidar de sus siervos.",aplicar:"Qué consolador es este detalle. Jehová no solo liberó a Jeremías; también se aseguró de que tuviera alimento y hasta un regalo para el camino. Y lo hizo mediante un oficial extranjero, alguien que ni siquiera adoraba a Jehová. Esto nos enseña que nuestro Dios puede usar a quien sea para cuidar de sus siervos. Quizás hoy sea un vecino, un compañero de trabajo, un médico o hasta un desconocido. Cuando pasamos por una necesidad, no nos desanimemos pensando que nadie nos ayudará. Más bien, orémosle a Jehová con confianza, porque él puede mover los corazones en la dirección correcta. Y cuando tengamos oportunidad, seamos también ese instrumento para ayudar a un hermano necesitado."},
 {v:"Jer 40:7-10",vu:bc("/1/0"),idea:"Guedalías, hijo de Ahicam y nieto de Safán, fue puesto al mando por el rey de Babilonia. Les juró a los jefes militares que les iría bien si servían a los caldeos y los animó a recoger vino, fruta de verano y aceite.",fuentes:["itG","w80"],ref:"Perspicacia, vol. 1, «Guedalías» núm. 4; La Atalaya 15/10/1980, párr. 9.",aprendemos:"La dirección de Jehová no siempre es la que esperamos, pero siempre es la mejor.",aplicar:"Aquí hay una lección para nosotros. Jehová, por medio de Jeremías, había dicho que se quedaran en la tierra y sirvieran a Babilonia. Puede que esa no fuera la respuesta que esperaban, pero era la que les convenía. Nosotros también recibimos dirección que a veces no es la que esperábamos: cuando se nos anima a ser pacientes con un hermano difícil, a esperar en Jehová en vez de tomar venganza, o a no aceptar un trabajo que nos impide asistir a las reuniones. En esos momentos, ¿vamos a confiar en que Jehová sabe más que nosotros? Recordemos que su dirección siempre busca nuestro bien. Obedezcamos aunque el camino no sea el que hubiéramos elegido."},
 {v:"Jer 40:13-16",vu:bc("/1/0"),idea:"Johanán y los jefes del ejército avisan a Guedalías del plan de Baalís e Ismael. Guedalías no les cree y rechaza que Johanán actúe en secreto.",fuentes:["itG","itI","r40"],ref:"Perspicacia, vol. 1, «Guedalías» núm. 4 e «Ismael» núm. 5.",aprendemos:"Rechazar una advertencia por orgullo puede costar muy caro.",aplicar:"Este pasaje nos advierte sobre algo serio: rechazar una advertencia por orgullo o por exceso de confianza en nosotros mismos. Guedalías no creyó que un miembro de la familia real pudiera traicionarlo. Quizás pensó que conocía bien a Ismael, o que nadie se atrevería. Pero se equivocó, y costó muchas vidas. Nosotros también podemos ser advertidos: cuando un anciano nos aconseja sobre una amistad, cuando un hermano maduro nos hace una observación, o cuando leemos un consejo bíblico que no nos gusta. ¿Cómo reaccionamos? ¿Con humildad, o pensando «yo ya sé lo que hago»? Seamos humildes. Aceptemos los consejos y verifiquemos las advertencias. La humildad puede salvarnos de muchas tristezas."},
 {v:"Jer 40:14",vu:bc("/1/0"),idea:"Baalís es el rey de Ammón que envió a Ismael. En 1984 se halló en Tell el-ʽUmeiri (Jordania) un sello con el nombre Baʽalyishʽa, de fines del siglo VII a. E.C.; es posible que se trate del Baalís de la Biblia.",fuentes:["itB","w80"],ref:"Perspicacia, vol. 1, «Baalís»; La Atalaya 15/10/1980, párr. 11.",aprendemos:"La Biblia habla de personas y lugares reales.",aplicar:"Este detalle nos fortalece de una manera especial. Muchos critican la Biblia diciendo que es un libro de leyendas. Pero mira lo que ha pasado: en 1984 se encontró en Jordania un sello con el nombre Baʽalyishʽa, muy parecido al rey Baalís del que habla la Biblia. ¿Casualidad? No. Es una confirmación más de que la Biblia habla de personas reales, en lugares reales, en tiempos reales. Esto nos da confianza. Cuando alguien cuestione la exactitud de la Biblia, podemos mencionar estos descubrimientos con tranquilidad. Y sobre todo, nos recuerda que si podemos confiar en los detalles históricos, mucho más podemos confiar en sus promesas y en sus consejos para nuestra vida."},
 {v:"Jer 41:1",vu:bc("/2/0"),idea:"Ismael era de linaje real y uno de los hombres principales del rey. La Atalaya sugiere que pudo haberse resentido de que Guedalías, que no era de la familia real, fuera el gobernador, y que Baalís lo usó como instrumento.",fuentes:["j41","w80"],ref:"Biblia de estudio, Jer 41:1; La Atalaya 15/10/1980, párr. 11.",aprendemos:"El resentimiento puede llevar a alguien a traicionar.",aplicar:"Esta es una advertencia que todos necesitamos. Ismael era de la familia real y probablemente creía que él merecía ser gobernador, no Guedalías. Ese resentimiento lo llevó a conspirar y finalmente a asesinar. ¡Cuánto daño puede hacer un corazón resentido! Nosotros podríamos pensar: «¿yo? ¿resentido? Jamás». Pero pensemos: ¿qué sentimos cuando otro hermano recibe un privilegio que nosotros deseábamos? ¿Nos alegramos sinceramente, o sentimos un poquito de celos? Seamos honestos. Pidámosle a Jehová que nos ayude a ver a nuestros hermanos con el mismo cariño con que él los ve. Alegrémonos sinceramente por ellos."},
 {v:"Jer 40:10; 41:1",vu:bc("/1/0"),idea:"Guedalías animó a recoger la cosecha. La Atalaya explica que se acercaba la fiesta de las cabañas, pero no había templo en Jerusalén y no la celebraron; el asesinato de Guedalías ocurrió en el séptimo mes, el de esa fiesta.",fuentes:["w80","r40"],ref:"La Atalaya 15/10/1980, párrs. 7, 8, 12.",aprendemos:"No debemos descuidar las ocasiones de adorar a Jehová.",aplicar:"Fíjese en el contraste. Aquí vemos a un grupo de judíos que podían haberse reunido para adorar a Jehová en la fiesta de las cabañas, pero no lo hicieron. Y justo en esos días ocurrió la tragedia. Nosotros hoy tenemos reuniones, asambleas, predicación, estudio personal. ¿Las consideramos valiosas o las vemos como una rutina? Puede que a veces digamos: «estoy cansado, mejor me quedo en casa». Pero ¿nos damos cuenta de que esas ocasiones de adoración son un regalo de Jehová? Son momentos para fortalecernos, para animarnos unos a otros, para recibir dirección. No dejemos pasar esas oportunidades. Prioricemos siempre la adoración, porque Jehová bendice a los que lo ponen primero."},
 {v:"Jer 41:2, 3",vu:bc("/2/0"),idea:"Ismael y 10 hombres mataron a Guedalías mientras comían con él, y también a los judíos y soldados caldeos que estaban allí. Guedalías no había tomado precauciones.",fuentes:["j41","itG","w80"],ref:"Biblia de estudio, Jer 41:2, 3; Perspicacia, «Guedalías» núm. 4.",aprendemos:"La prudencia y la bondad no están reñidas.",aplicar:"Esta escena es terrible: la traición ocurrió mientras comían juntos. Guedalías había recibido a Ismael con hospitalidad, y este pagó con asesinato. ¿Qué aprendemos? Que la prudencia y la bondad no están reñidas. Podemos ser hospitalarios, bondadosos, abiertos, pero también prudentes. Por ejemplo, en la predicación, en las redes sociales, en los negocios, hay personas que pueden querer aprovecharse de nuestra bondad. No hay que volverse desconfiados ni fríos, pero sí usar buen juicio. Y en el caso de Guedalías, él desatendió una advertencia directa. La lección es clara: escuchemos, evaluemos y seamos prudentes sin dejar de ser cristianos bondadosos."},
 {v:"Jer 41:5",vu:bc("/2/0"),idea:"Ochenta hombres de Siquem, Siló y Samaria llegaron con ofrendas para la casa de Jehová, con la barba afeitada, la ropa rasgada y cortaduras. Perspicacia indica que las cortaduras estaban prohibidas por la Ley (Le 19:28; 21:5).",fuentes:["j41","itBa"],ref:"Biblia de estudio, Jer 41:5; Perspicacia, vol. 1, «Barba».",aprendemos:"No basta con querer adorar a Jehová; hay que adorarlo como él pide.",aplicar:"Aquí vemos a ochenta hombres que querían adorar a Jehová. Venían con ofrendas a la casa de Jehová. Su intención era buena, sin duda. Pero la Biblia menciona que traían la barba afeitada y cortaduras en el cuerpo. La Ley de Moisés prohibía esas prácticas, porque imitaban costumbres paganas. Esto nos enseña algo importante: no basta con querer adorar a Jehová; tenemos que adorarlo como él pide. Hoy podríamos caer en la misma trampa si mezclamos la adoración pura con costumbres o ideas del mundo. Revisemos siempre nuestras prácticas: ¿están en armonía con lo que la Biblia enseña, o las hacemos porque «siempre se ha hecho así»? Jehová merece una adoración limpia."},
 {v:"Jer 41:11-15",vu:bc("/2/0"),idea:"Cuando Johanán y los jefes supieron de las atrocidades de Ismael, fueron a pelear con él y lo hallaron junto a las grandes aguas de Gabaón. Los cautivos se alegraron al verlos y regresaron con Johanán; Ismael y ocho hombres escaparon a Ammón.",fuentes:["j41","itI","w80"],ref:"Biblia de estudio, Jer 41:11-15; Perspicacia, «Ismael» núm. 5.",aprendemos:"Ayudar a un hermano en dificultad puede ser la manera en que Jehová actúa.",aplicar:"Qué escena tan emotiva. Cuando Johanán y sus hombres aparecieron, los cautivos que Ismael llevaba se llenaron de alegría. Habían sido rescatados. Nosotros también podemos ser como esos cautivos necesitados de ayuda, o como Johanán dispuesto a actuar. Pensemos: ¿cuándo fue la última vez que ayudamos a un hermano que estaba pasando por un momento difícil? ¿Visitamos a alguien enfermo? ¿Apoyamos a una familia que pasó por una pérdida? A veces basta con una llamada, un mensaje, una visita corta. Y si nosotros somos los que estamos en necesidad, no nos aislemos. Permitamos que los hermanos nos ayuden. Así como Jehová usó a Johanán, también puede usar a cualquier hermano para rescatarnos del desánimo."},
 {v:"Jer 41:16-18",vu:bc("/2/0"),idea:"Por miedo a los caldeos, Johanán y los suyos se detuvieron en el lugar de hospedaje de Kimham, cerca de Belén, para seguir a Egipto. La Atalaya explica que pidieron consejo a Jeremías, prometieron obedecer lo que Jehová dijera y luego rechazaron su mensaje (Jer 42:1–43:3).",fuentes:["j41","itK","w80"],ref:"Biblia de estudio, Jer 41:16-18; La Atalaya 15/10/1980, párrs. 13, 14.",aprendemos:"Orar pidiendo dirección solo sirve si estamos dispuestos a obedecer.",aplicar:"Este último ejemplo nos da mucho en qué pensar. Johanán y sus hombres pidieron consejo a Jeremías. Le dijeron: «Jehová sea testigo de que haremos todo lo que él diga». Pero cuando Jehová respondió que se quedaran en la tierra, no les gustó la respuesta y se fueron a Egipto. ¿Cuántas veces nos pasa algo parecido? Orar pidiendo dirección, pero en el fondo ya tener decidido lo que queremos hacer. Solo queremos que Jehová confirme. Aprendamos a orar con el corazón abierto, dispuestos a obedecer cualquier respuesta. Antes de orar, preguntémonos: «¿estoy dispuesto a hacer lo que Jehová diga, aunque no me guste?». Si la respuesta es sí, nuestra oración tendrá el poder que debe tener."}
];

var MAESTROS={
  p4:{marco:"Casa en casa. El publicador llega a una casa, saluda con amabilidad a una persona que abre la puerta. El objetivo es iniciar una conversación sobre el sufrimiento. Duración: 2 minutos.",leccion:"lmd lección 2 punto 3 — Iniciar conversaciones. Escuchar primero, mostrar interés sincero, presentar una sola idea clara.",objetivo:"Iniciar una conversación breve y amable en la predicación de casa en casa.",tema:"Presentar una verdad sencilla de la Biblia que invite a seguir hablando.",texto:"Romanos 5:12 — el pecado entró en el mundo y con él la muerte.",dialogo:"PUBLICADOR: Buenos días, ¿cómo está? Estamos hablando brevemente con los vecinos sobre una pregunta que muchos se hacen: ¿por qué hay tanto sufrimiento?\n\nAMO DE CASA: Sí, a veces uno se lo pregunta.\n\nPUBLICADOR: Mire lo que dice la Biblia aquí en Romanos 5:12. (Lee el texto.) ¿Sabía que la Biblia promete que pronto el sufrimiento terminará?\n\nAMO DE CASA: No lo sabía.\n\nPUBLICADOR: Me gustaría mostrarle cómo. ¿Le parece si en otra ocasión lo vemos con más calma?",demostrar:["Saludo amable y natural","Interés sincero por la persona","Una sola idea clara, no varias","Leer un texto directamente de la Biblia","Ofrecer una visita de seguimiento"],conclusion:"Terminar con una pregunta abierta o un ofrecimiento, no con un monólogo."},
  p5:{marco:"Predicación informal. El publicador está en una situación cotidiana (parada de bus, fila, mercado) y aprovecha una conversación casual. Duración: 2 minutos.",leccion:"lmd lección 2 punto 5 — Predicación informal. Escuchar el tema que la persona toca, adaptarse a él, ser breve.",objetivo:"Aprovechar una conversación informal para despertar interés espiritual.",tema:"Una verdad bíblica que responda a algo que la persona ya haya mencionado.",texto:"El texto que se ajuste al tema surgido (por ejemplo, Salmo 37:11).",dialogo:"PUBLICADOR: (Tras un comentario casual) Qué interesante lo que dice. ¿Sabía que la Biblia habla de eso?\n\nAMO DE CASA: ¿En serio?\n\nPUBLICADOR: Sí. Mire lo que dice aquí. (Lee el texto.) Fíjese en lo que promete.\n\nAMO DE CASA: Eso suena bien.\n\nPUBLICADOR: ¿Le gustaría que en otra ocasión lo viéramos con más calma?",demostrar:["Escuchar primero, hablar después","Aprovechar el tema que la persona ya tocó","Ser breve: no convertir la charla en un discurso","Un solo texto bíblico bien explicado"],conclusion:"Dejar la puerta abierta sin presionar."},
  p6:{marco:"Predicación pública. El publicador está en el carrito de publicaciones. Una persona se detiene y observa los títulos. Duración: 4 minutos.",leccion:"lmd lección 5 punto 3 — Predicación pública. Buen uso del carrito, invitar con calidez, ofrecer una sola publicación.",objetivo:"Iniciar una conversación con alguien que se detiene en el carrito.",tema:"Una verdad atractiva para el transeúnte.",texto:"Un texto breve que responda al interés mostrado.",dialogo:"PUBLICADOR: Buenas tardes. ¿Le llama la atención alguna de estas publicaciones?\n\nAMO DE CASA: Sí, esa. ¿De qué trata?\n\nPUBLICADOR: Trata de algo que quizás le interese: por qué hay tanto sufrimiento. ¿Se lo ha preguntado alguna vez?\n\nAMO DE CASA: Todos nos lo preguntamos.\n\nPUBLICADOR: La Biblia responde. Mire esto. (Lee.) ¿Le gustaría llevarse esta revista? Es gratuita.\n\nAMO DE CASA: Sí, gracias.",demostrar:["Buena presentación personal","Puesto ordenado y bien ubicado","Invitación cálida a detenerse","Usar la publicación como puente, no como fin","Ofrecer una sola publicación"],conclusion:"Agradecer y dejar la puerta abierta para otra visita al carrito."},
  p7:{marco:"Escenificación. Explique sus creencias. Tema: ¿Quién es Jehová? Duración: 3 minutos.",leccion:"th lección 17 — Explicar con claridad. Usar la Biblia como autoridad, responder con sencillez, invitar a seguir estudiando.",objetivo:"Explicar con claridad la respuesta bíblica a una pregunta de creencias.",tema:"¿Quién es Jehová?",texto:"Salmo 83:18 — el nombre de Jehová. Revelación 4:11 — Jehová es el Creador.",dialogo:"AMO DE CASA: Yo creo en Dios, pero nunca he entendido bien quién es exactamente.\n\nPUBLICADOR: Es una buena pregunta. La Biblia nos dice que Jehová es el Creador de todo (Rev 4:11), y le da un nombre propio, que aparece miles de veces en el texto original. ¿Sabía que él mismo quiere que lo conozcamos por su nombre?\n\nAMO DE CASA: No lo sabía.\n\nPUBLICADOR: Además de ser todopoderoso, la Biblia dice que Jehová es amor (1Jn 4:8), y quiere que todos lo conozcan. ¿Le gustaría aprender más sobre él?",demostrar:["Escuchar la pregunta completa antes de responder","Usar la Biblia como autoridad","Responder con claridad, sin tecnicismos","Invitar a seguir estudiando"],conclusion:"Terminar confirmando amablemente la respuesta y ofreciendo más información."}
};

var VIDA_P8={
  introGuion:"Análisis con el auditorio. Vamos a ver cómo Jehová protege a las viudas. La Biblia dice en Salmo 68:5 que Jehová es «padre de los huérfanos y defensor de las viudas». Hoy veremos tres cosas: cómo lo hizo en tiempos bíblicos, cómo lo hace hoy, y qué podemos hacer nosotros para honrarlas. Antes de empezar, veamos el video «A pesar de perder a mi esposo, vuelvo a ser feliz».",
  video:{t:"A pesar de perder a mi esposo, vuelvo a ser feliz",u:"https://www.jw.org/finder?lank=pub-jwbvod26_2_VIDEO&wtlocale=S"},
  preguntas:[
    {q:"Use las herramientas de investigación disponibles en su idioma para encontrar uno o dos relatos bíblicos que hablen sobre alguna viuda. ¿Cómo nos muestran estas historias que Jehová quiere y protege a las viudas?",respuesta:"En la Biblia hay varios ejemplos. Rut, la moabita, quedó viuda y acompañó a Noemí; Jehová la recompensó con un nuevo hogar y llegó a formar parte del linaje del Mesías (Rut 4:13-17). La viuda de Sarepta fue sostenida por Jehová mediante el profeta Elías, y no le faltó alimento durante la sequía (1Re 17:8-16). Jesús resucitó al hijo único de la viuda de Naín, y movido a compasión se lo devolvió vivo (Luc 7:11-15). Todas estas historias muestran que Jehová no olvida a las viudas y actúa a favor de ellas."},
    {q:"(Después del video) ¿Qué le enseña este video sobre cómo Jehová cuida y protege a las viudas hoy en día?",respuesta:"El video muestra que Jehová cuida a las viudas principalmente mediante la hermandad: los ancianos, los publicadores y los hermanos en general pueden convertirse en un apoyo real. Salmo 68:5 llama a Jehová «padre de los huérfanos y defensor de las viudas», y ese papel lo cumple hoy por medio de su pueblo."},
    {q:"¿Cómo podemos honrar a las viudas hoy en día?",respuesta:"Santiago 1:27 dice que la religión pura incluye cuidar de las viudas. Podemos honrarlas invitándolas a nuestras casas, ofreciéndoles ayuda práctica, escuchándolas, incluyéndolas en actividades de la congregación, y respetando el papel que ellas mismas quieren desempeñar. También podemos apoyarlas en la predicación y asegurarnos de que no se sientan solas, sobre todo en fechas señaladas."}
  ],
  aplicacion:"Como congregación, podemos ser ese apoyo real. No se trata solo de palabras, sino de acciones concretas: incluir, visitar, escuchar, ayudar. Cuando lo hacemos, estamos reflejando el cariño de Jehová por las viudas.",
  cierre:"Jehová es el defensor de las viudas. Y nos da el privilegio de ser sus manos y sus pies para cuidarlas. ¿Verdad que queremos estar atentos a las viudas de nuestra congregación y demostrarles ese mismo cariño?"
};

function timerElapsedMs(){if(TIMER.running)return TIMER.accumulated+(Date.now()-TIMER.startAt);return TIMER.accumulated;}
function fmtMs(ms){if(ms<0)ms=0;var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function ensurePos(){if(TPOS)return;var w=window.innerWidth,h=window.innerHeight;TPOS={x:Math.max(8,w-90),y:Math.max(8,h-220)};lsSet(K_TICK,TPOS);}
function clampPos(box){var w=window.innerWidth,h=window.innerHeight;var bw=box.offsetWidth||74,bh=box.offsetHeight||74;TPOS.x=Math.max(6,Math.min(w-bw-6,TPOS.x));TPOS.y=Math.max(6,Math.min(h-bh-6,TPOS.y));}
function applyPos(box){ensurePos();clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";box.style.right="auto";box.style.bottom="auto";}
function timerTick(){
  lsSet(K_TIMER,TIMER);
  var box=document.getElementById("timerbox");if(!box)return;
  if(!TIMER.label){box.classList.remove("show");return;}
  box.classList.add("show");
  var el=timerElapsedMs();var remain=TIMER.assigned*1000-el;var over=remain<0;
  box.classList.toggle("over",over);
  if(TIMER_EXPANDED){
    box.classList.add("expanded");
    box.innerHTML='<button class="tclose" data-act="t-close">×</button><div class="ttitle">'+esc(TIMER.label)+'</div><div class="tgrid"><div class="tbig">'+fmtMs(el)+'</div><div class="grow"><div class="tmini">Asignado: <b>'+fmtMs(TIMER.assigned*1000)+'</b></div><div class="tmini">Restante: <b>'+(over?'+'+fmtMs(-remain):fmtMs(remain))+'</b></div></div></div><div class="row" style="margin-top:10px">'+(TIMER.running?'<button class="btn sm primary grow" data-act="t-pause">PAUSAR</button>':(TIMER.accumulated>0?'<button class="btn sm primary grow" data-act="t-resume">CONTINUAR</button>':'<button class="btn sm primary grow" data-act="t-start">INICIAR</button>'))+'<button class="btn sm grow" data-act="t-reset">REINICIAR</button></div>';
  }else{box.classList.remove("expanded");box.textContent=fmtMs(el);}
  attachDrag(box);applyPos(box);
}
function attachDrag(box){
  if(box.dataset.dragInit==="1")return;box.dataset.dragInit="1";
  var sx,sy,sl,st,dragging=false,moved=false;
  box.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;dragging=true;moved=false;sx=e.clientX;sy=e.clientY;sl=TPOS.x;st=TPOS.y;try{box.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();});
  box.addEventListener("pointermove",function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;TPOS.x=sl+dx;TPOS.y=st+dy;clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";});
  box.addEventListener("pointerup",function(){if(!dragging)return;dragging=false;lsSet(K_TICK,TPOS);if(!moved){TIMER_EXPANDED=!TIMER_EXPANDED;timerTick();}});
  box.addEventListener("pointercancel",function(){dragging=false;});
}
function timerEnsureInterval(){if(TIMER_INT)return;TIMER_INT=setInterval(timerTick,250);}
function timerOpen(label,assignedMin){TIMER.label=label;TIMER.assigned=(assignedMin||10)*60;if(!TIMER.running&&TIMER.accumulated===0)TIMER.startAt=0;TIMER_EXPANDED=false;timerEnsureInterval();timerTick();}
function timerStart(){TIMER.running=true;TIMER.startAt=Date.now();timerTick();}
function timerPause(){if(TIMER.running){TIMER.accumulated+=Date.now()-TIMER.startAt;TIMER.running=false;}timerTick();}
function timerReset(){TIMER.running=false;TIMER.accumulated=0;TIMER.startAt=0;timerTick();}
function timerClose(){TIMER.running=false;TIMER.accumulated=0;TIMER.startAt=0;TIMER.label="";TIMER_EXPANDED=false;timerTick();}

function detectType(p){
  if(!/^p([0-9]|10)$/.test(p.id))return {k:"otra",label:"otra parte"};
  var s=p.section,t=(p.title+" "+(p.raw||"")).toLowerCase();
  if(s==="INICIO")return {k:"inicio",label:"Canción, oración y palabras de introducción"};
  if(s==="TESOROS DE LA BIBLIA"){
    if(/perlas escondidas/.test(t))return {k:"perlas",label:"Busquemos perlas escondidas"};
    if(/lectura de la biblia/.test(t))return {k:"lectura",label:"Lectura de la Biblia"};
    return {k:"tesoros",label:"Tesoros de la Biblia (discurso)"};
  }
  if(s==="SEAMOS MEJORES MAESTROS"){
    if(/de casa en casa/.test(t))return {k:"maestros",sub:"p4",label:"De casa en casa"};
    if(/predicación informal/.test(t))return {k:"maestros",sub:"p5",label:"Predicación informal"};
    if(/predicación pública/.test(t))return {k:"maestros",sub:"p6",label:"Predicación pública"};
    if(/explique sus creencias/.test(t))return {k:"maestros",sub:"p7",label:"Explique sus creencias"};
    return {k:"maestros",sub:"p4",label:"Otra asignación"};
  }
  if(s==="NUESTRA VIDA CRISTIANA"){
    if(/estudio bíblico de la congregación/.test(t))return {k:"estudio",label:"Estudio bíblico"};
    if(/video|auditorio|viudas/.test(t))return {k:"vida",label:"Análisis con el auditorio (con video)"};
    if(/conclusión/.test(t))return {k:"inicio",label:"Palabras de conclusión"};
    return {k:"vida",label:"Otra actividad"};
  }
  return {k:"otra",label:"Otra parte"};
}

function importBackup(){
  var inp=document.createElement("input");
  inp.type="file";inp.accept=".json,application/json";
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(data.v){S.v=data.v;persistNow();}
        if(data.saved)lsSet(K_SAVED,data.saved);
        if(data.discursos)lsSet(K_DISC,data.discursos);
        toast("Respaldo importado ✓");render();
      }catch(err){toast("Archivo inválido");}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============ EDITOR DE SEMANA ============ */
function weekLabels(key){
  var p=key.split("-");var x=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(x.getTime()))return null;
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  var e=new Date(x.getFullYear(),x.getMonth(),x.getDate()+6);
  var same=(x.getMonth()===e.getMonth());
  var label=same?x.getDate()+"–"+e.getDate()+" de "+MESES[x.getMonth()]+" de "+x.getFullYear():x.getDate()+" de "+MESES[x.getMonth()]+" – "+e.getDate()+" de "+MESES[e.getMonth()]+" de "+e.getFullYear();
  var shortLabel=same?x.getDate()+"–"+e.getDate()+" "+MESES[x.getMonth()]+" "+x.getFullYear():x.getDate()+" "+MESES[x.getMonth()]+" – "+e.getDate()+" "+MESES[e.getMonth()]+" "+e.getFullYear();
  return {key:x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()),label:label,shortLabel:shortLabel};
}

/* Lee los campos del editor en memoria (no guarda). Devuelve false si hay un dato inválido. */
function weekFromDOM(){
  var g=function(k,def){var el=document.querySelector('[data-wk="'+k+'"]');return el?el.value:def;};
  var raw=String(g("key",WEEK.key)||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)){toast("La fecha debe tener formato AAAA-MM-DD");return false;}
  var wl=weekLabels(raw);
  if(!wl){toast("Fecha no válida");return false;}
  WEEK.key=wl.key;WEEK.label=wl.label;WEEK.shortLabel=wl.shortLabel;
  WEEK.reading=g("reading",WEEK.reading);WEEK.program=g("program",WEEK.program);
  PARTS.forEach(function(p,i){
    p.section=g("p"+i+".section",p.section);
    var n=String(g("p"+i+".num","")).trim();if(n)p.num=n;else delete p.num;
    p.title=g("p"+i+".title",p.title);
    p.min=Math.max(1,parseInt(g("p"+i+".min",p.min),10)||1);
    var r=String(g("p"+i+".raw","")||"");if(r.trim())p.raw=r;else delete p.raw;
  });
  WEEKEND.discursoPublico.title=g("wk.dp.title",WEEKEND.discursoPublico.title);
  WEEKEND.discursoPublico.speaker=g("wk.dp.speaker",WEEKEND.discursoPublico.speaker);
  WEEKEND.atalaya.title=g("wk.at.title",WEEKEND.atalaya.title);
  WEEKEND.atalaya.openingSong=g("wk.at.open",WEEKEND.atalaya.openingSong);
  WEEKEND.atalaya.baseText=g("wk.at.base",WEEKEND.atalaya.baseText);
  WEEKEND.atalaya.closingSong=g("wk.at.close",WEEKEND.atalaya.closingSong);
  return true;

      +field("atalaya.p"+i+".texto",val("atalaya.p"+i+".texto",pr.texto),"Texto del párrafo",140)
      +field("atalaya.p"+i+".pregunta",val("atalaya.p"+i+".pregunta",pr.pregunta),"Pregunta",90)
      +field("atalaya.p"+i+".respuesta",val("atalaya.p"+i+".respuesta",pr.respuesta),"Respuesta preparada (borrador editable)",160)+'</div>';
  }
  h+='<div class="row" style="margin-bottom:12px"><button class="btn grow" data-act="atalaya-add">+ Añadir párrafo</button><button class="btn grow" data-act="atalaya-del">− Quitar último</button></div>';
  h+='<div class="card"><div class="disc-sec-title">✏️ APLICACIÓN Y CIERRE</div>'+field("atalaya.aplicacion",val("atalaya.aplicacion",""),"Aplicación práctica",140)+field("atalaya.cierre",val("atalaya.cierre",""),"Cierre del conductor",120)+'</div>';
  h+='<div class="card"><button class="btn sm primary block" data-act="timer-open-atalaya">⏱️ Cronómetro del estudio (60 min)</button></div>';
  return h;
}

function viewInicio(p){return '<div class="card"><div class="muted">Esta parte no se prepara. Solo se anuncia la canción y la oración.</div></div>';}

function viewGenerico(p,d){
  var h='<div class="card">';
  if(p.questions)p.questions.forEach(function(q,i){h+='<div style="margin-top:10px"><div class="src" style="margin:0 0 4px">'+esc(q)+'</div>'+field(p.id+".q"+i,"","Mi respuesta",100)+'</div>';});
  h+=field(p.id+".notes","","Notas personales",110);
  h+='<div class="warnbox">El método específico para «'+esc(d.label)+'» aún no está construido.</div></div>';
  return h;
}

/* ============ EXPORTAR Y COPIAR ============ */
function collectPartText(p){
  var out=[];out.push(p.section.toUpperCase());out.push((p.num?p.num+". ":"")+p.title);out.push("Duración: "+p.min+" min");out.push("");
  var pre=p.id+".",found=false;
  for(var k in S.v){if(k.indexOf(pre)===0&&S.v[k]){found=true;out.push("-- "+k.substring(pre.length)+" --");out.push(S.v[k]);out.push("");}}
  if(!found)out.push("(Sin contenido preparado todavía)");
  return out.join("\n");
}
function copyToClipboard(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);toast("Texto copiado ✓");
}
function openPrint(title,text){
  var old=document.getElementById("printOverlay");if(old&&old.parentNode)old.parentNode.removeChild(old);
  var ov=document.createElement("div");ov.id="printOverlay";
  ov.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF;color:#1B2A3A;z-index:100;padding:20px;overflow:auto;";
  var bar=document.createElement("div");bar.className="print-toolbar";
  bar.style.cssText="position:sticky;top:0;background:#FFF;padding:10px;border-bottom:1px solid #D5DDE4;text-align:right;margin-bottom:20px;";
  var bP=document.createElement("button");bP.textContent="Guardar como PDF";
  bP.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;background:#0F6E6E;color:#FFF;cursor:pointer;margin-right:8px;";
  bP.onclick=function(){window.print();};
  var bC=document.createElement("button");bC.textContent="Cerrar";
  bC.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid #D5DDE4;background:#FFF;color:#1B2A3A;cursor:pointer;";
  bC.onclick=function(){if(ov.parentNode)ov.parentNode.removeChild(ov);};
  bar.appendChild(bP);bar.appendChild(bC);
  var h1=document.createElement("h1");h1.style.cssText="font-family:Georgia,serif;font-size:22px;margin:0 0 16px;color:#1B2A3A;";h1.textContent=title;
  var pre=document.createElement("pre");pre.style.cssText="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;line-height:1.6;margin:0;color:#1B2A3A;";pre.textContent=text;
  var foot=document.createElement("div");foot.style.cssText="font-size:12px;color:#5B6B7B;margin-top:30px;";foot.textContent="Reunión Vida y Ministerio Cristianos · "+WEEK.shortLabel+" · Fuentes: wol.jw.org";
  ov.appendChild(bar);ov.appendChild(h1);ov.appendChild(pre);ov.appendChild(foot);document.body.appendChild(ov);
}

/* ============ RENDER Y EVENTOS ============ */
function render(){
  var h="";
  if(S.view==="home")h=viewHome();
  else if(S.view==="part")h=viewPart();
  else if(S.view==="saved")h=viewSaved();
  else if(S.view==="discursos")h=viewDiscursos();
  else if(S.view==="semana")h=viewSemana();
  document.getElementById("app").innerHTML=h;
  timerTick();
}
function go(v,id){S.view=v;S.id=id||null;render();window.scrollTo(0,0);}

function saveAtalaya(){S.v=collectDefaults();persistNow();toast("Atalaya guardada ✓");}
function atalayaAddParrafo(){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo añadido");}
function atalayaDelParrafo(){if(ATALAYA.parrafos.length<=1){toast("Debe quedar al menos 1");return;}ATALAYA.parrafos.pop();S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo quitado");}

var actions={
  go:function(b){go(b.dataset.id);},
  prep:function(b){go("part",b.dataset.id);},
  demo:function(){S.demo=true;render();},
  save:function(){saveMeeting();},
  duplicate:function(){duplicateMeeting();},
  tab:function(b){S.tabWeek=b.dataset.id;render();window.scrollTo(0,0);},
  "open-saved":function(b){var m=savedList().filter(function(x){return x.weekKey===b.dataset.id;})[0];if(m){S.v=JSON.parse(JSON.stringify(m.v));persistNow();S.demo=true;}go("home");toast("Reunión abierta");},
  "del-saved":function(b){lsSet(K_SAVED,savedList().filter(function(x){return x.weekKey!==b.dataset.id;}));toast("Eliminada");render();},
  "del-disc":function(b){lsSet(K_DISC,discursosList().filter(function(x){return x.id!==b.dataset.id;}));toast("Eliminado");render();},
  "week-save":function(){if(weekFromDOM()){saveWeekData();toast("Semana guardada ✓");render();}},
  "week-add":function(){if(!weekFromDOM())return;PARTS.push({id:"n"+Date.now(),section:"SECCIÓN NUEVA",title:"Nueva parte",min:5});saveWeekData();render();window.scrollTo(0,0);},
  "week-up":function(b){if(!weekFromDOM())return;var i=+b.dataset.id;if(i>0){var t=PARTS[i];PARTS[i]=PARTS[i-1];PARTS[i-1]=t;saveWeekData();render();}},
  "week-down":function(b){if(!weekFromDOM())return;var i=+b.dataset.id;if(i<PARTS.length-1){var t=PARTS[i];PARTS[i]=PARTS[i+1];PARTS[i+1]=t;saveWeekData();render();}},
  "week-del":function(b){if(!weekFromDOM())return;PARTS.splice(+b.dataset.id,1);saveWeekData();render();},
  "week-reset":function(){Object.assign(WEEK,JSON.parse(JSON.stringify(WEEK_DEFAULT)));PARTS=JSON.parse(JSON.stringify(PARTS_DEFAULT));WEEKEND=JSON.parse(JSON.stringify(WEEKEND_DEFAULT));lsSet(K_WEEK,null);toast("Semana original restaurada");render();},
  "export-backup":function(){exportBackup();},
  "import-backup":function(){importBackup();},
  "save-disc":function(){saveDiscursoActual();},
  "save-atalaya":function(){saveAtalaya();},
  "atalaya-add":function(){atalayaAddParrafo();},
  "atalaya-del":function(){atalayaDelParrafo();},
  "show-full":function(){var box=document.getElementById("full-disc");if(!box)return;box.innerHTML='<div class="src" style="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;margin-top:12px">'+esc(buildDiscursoTexto())+'</div>';box.scrollIntoView({behavior:"smooth",block:"start"});},
  "gen-perlas":function(){var t=buildPerlasRespuesta();S.v["p2.respuesta"]=t;var f=document.querySelector('[data-k="p2.respuesta"]');if(f)f.value=t;persist();toast("Respuesta generada");},
  "timer-open-t1":function(){timerOpen("Discurso: "+val("p1.d.titulo",DISCURSO_T1.title),parseInt(val("p1.d.duracion",DISCURSO_T1.duration),10)||10);},
  "timer-open-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(p)timerOpen(p.num?(p.num+". "+p.title):p.title,p.min);},
  "timer-open-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)timerOpen(d.title,d.duration);},
  "timer-open-atalaya":function(){timerOpen("Estudio de La Atalaya",60);},
  "t-start":function(){timerStart();},
  "t-pause":function(){timerPause();},
  "t-resume":function(){timerStart();},
  "t-reset":function(){timerReset();},
  "t-close":function(){timerClose();},
  "copy-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;var txt=(p.id==="p1")?buildDiscursoTexto():collectPartText(p);copyToClipboard(txt);},
  "pdf-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;var txt=(p.id==="p1")?buildDiscursoTexto():collectPartText(p);openPrint(p.title,txt);},
  "copy-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)copyToClipboard(d.text);},
  "pdf-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)openPrint(d.title,d.text);}
};

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.confirm&&!b.dataset.armed){
    b.dataset.armed="1";b.dataset.label=b.textContent;b.textContent="¿Seguro? Toca otra vez";b.classList.add("armed");
    setTimeout(function(){if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove("armed");}},3000);
    return;
  }
  var fn=actions[b.dataset.act];if(fn)fn(b);
});

function onField(e){
  var el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  if(el.type==="checkbox"){S.v[k]=el.checked?"1":"";var n=document.getElementById("pickN");if(n)n.textContent=pickedCount();}
  else{S.v[k]=el.value;}
  persist();
}
function onFieldBlur(e){
  var el=e.target;if(el.dataset&&el.dataset.k){persistNow();}
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("blur",onFieldBlur,true);

(function seed(){var seed=discSeedFields();for(var k in seed){if(!(k in S.v))S.v[k]=seed[k];}})();
(function restoreAtalaya(){var t=parseInt(S.v["atalaya.total"],10)||0;while(ATALAYA.parrafos.length<t){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});}})();

render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
