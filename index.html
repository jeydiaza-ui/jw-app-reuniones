/* ============ DISCURSO 1 — NUEVA ESTRUCTURA ============

var DISCURSO_T1 = {
  title:"La esperanza es clave para estar contentos",
  duration:10,
  intro:"Hermanos, ¿alguna vez han sentido que la asignación que tienen es demasiado pesada? ¿O que otros reciben oportunidades que ustedes desearían tener? Esta semana la lectura es Jeremías 45 y 46. El capítulo 45 es el más corto del libro: cinco versículos. Y es muy especial, porque no es un mensaje para toda la nación, sino para una sola persona: Baruc, el secretario del profeta Jeremías. Baruc era un hombre fiel. Escribió dos veces el rollo de los mensajes de Jeremías, acompañó al profeta durante años y hasta fue con él a Egipto. Pero hubo un momento en que se sintió agotado y descontento. Lo que Jehová le dijo a él nos ayuda a todos nosotros. Veamos por qué la esperanza es clave para estar contentos.",
  desarrollo:[
    {
      titulo:"Primer punto: El descontento de Baruc",
      texto:{
        ref:"Jer 45:1-3",
        intro:"Leamos el contexto. Fijémonos primero en la fecha: el cuarto año de Jehoiaquim, es decir, el año 605 antes de nuestra era. En ese momento Babilonia estaba creciendo como potencia mundial. Para Judá eran días de mucha tensión. Y Baruc no era un hombre cualquiera: su hermano Seraíah ocupaba un puesto importante en la corte (Jeremías 51:59). Es probable que Baruc hubiera podido tener una vida cómoda y un cargo de prestigio. Pero su asignación era otra: escribir y transmitir un mensaje de condena contra una nación desobediente. Imagínese la presión: copiar a mano, durante meses, palabras que enfurecían a los líderes del país.",
        lectura:"En el cuarto año de Jehoiaquim hijo de Josías —el rey de Judá—, cuando Baruc hijo de Nerías escribía en un libro las palabras que el profeta Jeremías le dictaba, Jeremías le dijo las siguientes palabras: “Esto es lo que Jehová, el Dios de Israel, dice sobre ti, Baruc: ‘Tú dijiste: «¡Pobre de mí, porque Jehová le ha añadido tristeza a mi dolor! Estoy agotado de tanto suspirar, y no encuentro alivio»’”.",
        explicacion:"Por eso dijo: «Jehová le ha añadido tristeza a mi dolor». Es interesante que no culpó a los babilonios ni al rey: sintió que Jehová le había añadido peso. Se estaba agotando, y «no encontraba alivio». ¿Y qué le dijo Jehová? Leamos Jeremías 45:4, 5: «Debes decirle a él: “Esto es lo que dice Jehová: ‘¡Mira! Voy a derrumbar lo que he edificado y voy a arrancar lo que he plantado, el país entero. Pero tú andas buscando cosas grandes para ti. Deja de buscar esas cosas. Porque voy a mandarle una calamidad a toda la gente —afirma Jehová—, pero a ti te daré tu vida como botín de guerra vayas donde vayas’”». Notemos el tono: Jehová no lo destruyó ni lo humilló. Le habló con franqueza, como un padre cariñoso: «Deja de buscar esas cosas»."
      },
      apoyo:"La Atalaya de julio de 2025, página 22 párrafos 8 y 9, explica que Baruc perdió de vista lo más importante: concentrarse en lo que Jehová quería que hiciera. Empezó a pensar demasiado en sí mismo y en lo que él quería hacer. ¿Cuáles eran esas «cosas grandes»? No lo sabemos con exactitud. Quizá un puesto de honor, seguridad económica, reconocimiento, o simplemente una vida tranquila sin persecución. Lo cierto es que Baruc estaba midiendo su situación con la vara equivocada.",
      leccion:"Si dejamos de estar contentos con lo que tenemos, podemos perder la alegría y tomar malas decisiones (La Atalaya, julio de 2025, página 20 párrafo 2). Piense en lo que pasó con Baruc: no abandonó a Jeremías. Aceptó la corrección y siguió sirviendo. Eso fue lo que lo salvó."
    },
    {
      titulo:"Segundo punto: El peligro de dejar de estar contentos",
      texto:{
        ref:"1 Cor 4:6, 7",
        intro:"¿Por qué es tan peligroso el descontento? Porque no se queda en un simple sentimiento. Crece y puede llevarnos a decisiones que dañan nuestra amistad con Jehová. La Atalaya menciona algunos ejemplos reales: hay quienes trabajan muchísimas horas extra para comprar cosas que en realidad no necesitan, y otros han llegado a robar dinero o bienes porque pensaron: «Me lo merezco», «Ya me cansé de esperar» o «Puedo llevarme esto ahora y devolverlo después».",
        lectura:"Hermanos, he dicho estas cosas usándome a mí y a Apolos como ejemplos para su beneficio, para que aprendan de nosotros esta regla: “No vayan más allá de las cosas que están escritas”. Así no se llenarán de orgullo y no se pondrán a favor de uno y en contra de otro. Pues ¿quién hace que tú seas diferente a los demás? En realidad, ¿qué tienes tú que no hayas recibido? Entonces, si lo recibiste, ¿por qué vas presumiendo como si no lo hubieras recibido?",
        explicacion:"Esa es la clave: todo lo que tenemos lo hemos recibido. Los talentos, la congregación donde servimos, las asignaciones, la salud, el tiempo: todo es un regalo de Jehová por su bondad inmerecida. Romanos 12:3 y 6 lo confirma: «Por la bondad inmerecida que se me ha mostrado, le digo a cada uno de ustedes que no piense de sí mismo más de lo que debe pensar, sino que piense de un modo que demuestre buen juicio, según la medida de fe que Dios le haya dado. [...] Así que tenemos distintos dones según la bondad inmerecida que se nos ha mostrado». Y Efesios 2:8, 9 añade: «Por esta bondad inmerecida, ustedes han sido salvados mediante la fe. Pero no ha sido por sus propios méritos, sino que es un regalo de Dios. En efecto, no es por las obras, para que nadie tenga motivos para presumir»."
      },
      apoyo:"Proverbios 30:9 muestra adónde puede llevar ese razonamiento: «No sea que me sacie y reniegue de ti diciendo “¿Quién es Jehová?”, o termine en la pobreza y robe, deshonrando así el nombre de mi Dios». Robar es robar, aunque nos convenzamos de que tenemos razones. Y hay algo todavía más serio: algunos se han sentido tan decepcionados por no recibir cierta responsabilidad que han dejado de servir a Jehová. Gálatas 6:9 nos advierte: «Así que no dejemos de hacer lo que está bien, porque al debido tiempo cosecharemos si no nos cansamos».",
      leccion:"Nadie «se gana» una asignación. Jehová no nos debe nada. Cuando entendemos eso, dejamos de mirar lo que otros tienen y empezamos a valorar lo que nosotros tenemos. ¿Cómo puede un siervo dedicado llegar al punto de dejar de servir? Poco a poco: primero deja de estar contento; después empieza a compararse; luego se aísla; y al final toma decisiones que nunca habría imaginado."
    },
    {
      titulo:"Tercer punto: La esperanza corrige el rumbo",
      texto:{
        ref:"Jer 45:5",
        intro:"Ahora bien, Jehová no solo corrigió a Baruc: le dio algo que le levantó el ánimo. Le dijo: «a ti te daré tu vida como botín de guerra vayas donde vayas». En medio de una calamidad nacional, Jehová le garantizó a Baruc lo más valioso: la vida. No le prometió riquezas ni un puesto importante. Le prometió que sobreviviría.",
        lectura:"«Pero tú andas buscando cosas grandes para ti. Deja de buscar esas cosas. Porque voy a mandarle una calamidad a toda la gente —afirma Jehová—, pero a ti te daré tu vida como botín de guerra vayas donde vayas».",
        explicacion:"La Atalaya de julio de 2025, página 24 párrafos 13 y 14, explica por qué la esperanza es tan importante hoy. Vivimos en «los últimos días» y todos tenemos problemas que son «difíciles de soportar» (2 Timoteo 3:1). Jehová nos ayuda cada día dándonos guía, fuerzas y apoyo (Salmo 145:14). Pero además nos da una esperanza que puede sostenernos en los peores momentos. Pensemos en algunas promesas concretas: «los pobres no serán olvidados para siempre; la esperanza de los mansos no desaparecerá jamás» (Salmo 9:18); él «rescatará al pobre que grita por ayuda» y «les salvará la vida» (Salmo 72:12-14); «les secará toda lágrima de sus ojos, y la muerte ya no existirá, ni habrá más tristeza ni llanto ni dolor» (Apocalipsis 21:3, 4)."
      },
      apoyo:"2 Corintios 4:17, 18: «Porque, aunque las dificultades son momentáneas y livianas, producen en nosotros una gloria de una grandeza cada vez más extraordinaria, una gloria eterna, mientras mantenemos la vista fija en las cosas que no se ven, y no en las cosas que se ven. Porque las cosas que se ven son temporales, pero las que no se ven son eternas». La Atalaya compara la esperanza con un par de gafas que nos ayudan a ver más claramente el futuro Paraíso. Si estamos agobiados por problemas económicos, podemos imaginarnos la vida cuando ya no existan ni el dinero ni las deudas ni la pobreza. Si nos sentimos decepcionados porque no recibimos cierta asignación, podemos pensar en lo poco que nos importará eso cuando seamos perfectos y llevemos miles de años sirviendo a Jehová. 1 Timoteo 6:19 dice que así nos conseguimos «un tesoro, unos buenos cimientos para el futuro».",
      leccion:"La esperanza no es un consuelo vacío: es lo que corrige el rumbo cuando el descontento nos desvía. Si la alimentamos todos los días, nos ayuda a estar contentos ahora y a mantenernos fieles hasta el final."
    }
  ],
  aplicacion:"Hermanos, ¿qué «cosas grandes» podríamos estar buscando nosotros? Un puesto, el reconocimiento de los hermanos, más dinero, una vida sin sacrificios. Si notamos que el descontento está creciendo, hagamos lo que hizo Baruc: aceptar la corrección y volver a mirar la esperanza. Tres preguntas para llevarnos esta semana: 1) ¿Estoy contento con lo que Jehová me ha dado? 2) ¿Estoy alimentando mi esperanza todos los días? 3) ¿Estoy tratando a los hermanos como amigos, o los estoy comparando conmigo?",
  conclusion:"Baruc aceptó la corrección, y Jehová le conservó la vida. Su historia está en la Biblia no para avergonzarlo, sino para enseñarnos algo: la esperanza es clave para estar contentos. Que nosotros también podamos decir, como el salmista: «Jehová sostiene a todos los que están a punto de caer y levanta a todos los que están encorvados» (Salmo 145:14). Nuestras pruebas son momentáneas. Lo que Jehová tiene preparado es eterno."
};

var PERLA1={
  q:"Jer 46:22. ¿Por qué dice este versículo que Egipto sonaría «como una serpiente que se arrastra»?",
  verses:[{t:"Jer 46:22",u:bible(24,46)}],
  pubs:[{t:"Perspicacia «Voz» párr. 16",u:pc("/4/0")}],
  found:[
    "Perspicacia, «Voz», párr. 16: Por medio de Jeremías, Dios profetizó que los babilonios conquistarían Egipto e irían en tropel como cortadores de leña para talarlo. Egipto yacería en el suelo profundamente humillado, llorando en tono bajo y gimiendo, con su «voz» baja como la de una serpiente que silba en retirada (Jer 46:22).",
    "Jer 46:22: «Ella suena como una serpiente que se arrastra, porque ellos irán con todas sus fuerzas detrás de ella, con hachas, como hombres que están talando árboles».",
    "Contexto (Jer 46:13-24): Jehová anunció que Nabucodonosor atacaría Egipto. La noticia se declararía en Migdol, Nof y Tahpanhés; los soldados contratados huirían y la nación quedaría avergonzada."
  ],
  draft:"La comparación con una serpiente que se arrastra describe la humillación total de Egipto. La serpiente se arrastra por el suelo, y su sonido es bajo y débil. Así quedaría Egipto: derrotado y gimiendo en tono bajo mientras los babilonios entraban con hachas «como hombres que están talando árboles». Ya no sería la potencia orgullosa que se creía; su «voz» sería la de alguien que se retira vencido (Perspicacia, «Voz», párr. 16)."
};
var PERLA2_Q="¿Qué perlas espirituales ha encontrado en la lectura bíblica de esta semana?";

var PUNTOS=[
 {v:"Jer 45:3",vu:bible(24,45),idea:"Baruc le dice a Jehová cómo se siente: agotado, con tristeza añadida a su dolor y sin encontrar alivio.",fuentes:["j45","w0722"],ref:"Biblia de estudio, Jer 45:3; La Atalaya, julio de 2025, pág. 22 párrs. 8, 9.",aprendemos:"Jehová no se molesta cuando le contamos con sinceridad cómo nos sentimos.",aplicar:"Baruc no escondió su cansancio. Se lo dijo a Jehová, y Jehová lo escuchó y le respondió. A veces pensamos que un siervo fiel no debería sentirse agotado, o que sería una falta de fe decirlo. Pero la Biblia muestra lo contrario: Jehová quiere que le abramos el corazón. Si estamos cansados, tristes o desanimados, orémosle con franqueza. Él no nos rechaza; nos corrige con cariño y nos ayuda a seguir adelante."},
 {v:"Jer 45:4, 5",vu:bible(24,45),idea:"Jehová le recuerda a Baruc que está derribando lo que edificó y le dice: «Deja de buscar esas cosas».",fuentes:["j45","w0720"],ref:"Biblia de estudio, Jer 45:4, 5; La Atalaya, julio de 2025, pág. 20 párr. 2.",aprendemos:"Cuando Jehová corrige, no busca humillarnos, sino salvarnos.",aplicar:"La corrección de Jehová fue directa, pero amorosa. No le dijo a Baruc que era un fracasado; le mostró que estaba mirando las cosas desde el punto de vista equivocado. Nosotros también recibimos corrección: por medio de la Biblia, de las publicaciones, de los ancianos o de un hermano maduro. ¿Cómo reaccionamos? Si la rechazamos por orgullo, perdemos la oportunidad de mejorar. Si la aceptamos, como Baruc, conservamos la aprobación de Jehová."},
 {v:"Jer 45:5",vu:bible(24,45),idea:"En medio de una calamidad nacional, Jehová le promete a Baruc su vida como botín de guerra doquiera que fuera.",fuentes:["j45","w0724"],ref:"Biblia de estudio, Jer 45:5; La Atalaya, julio de 2025, pág. 24 párrs. 13, 14.",aprendemos:"La esperanza que Jehová da sostiene en los peores momentos.",aplicar:"Jehová no le prometió a Baruc riquezas ni un puesto importante. Le prometió la vida. Y esa esperanza fue suficiente para que corrigiera el rumbo. Hoy nosotros tenemos una esperanza mucho mayor: el Paraíso, la resurrección, la vida eterna. Cuando los problemas nos agobien, mirémosla como un par de gafas que nos ayudan a ver el futuro. Las dificultades son momentáneas; lo que Jehová promete es eterno."},
 {v:"Jer 46:17",vu:bible(24,46),idea:"Egipto es llamado «puro ruido»: presumía de poder, pero dejó pasar la oportunidad.",fuentes:["j46"],ref:"Biblia de estudio, Jer 46:17.",aprendemos:"La apariencia de fuerza no salva; hay que actuar cuando llega el momento.",aplicar:"El faraón tenía ejércitos, carros y aliados, pero todo aquello fue «puro ruido». Su oportunidad pasó y no la aprovechó. Nosotros también podemos confiar en nuestras propias fuerzas o en nuestras posesiones y descuidar lo más importante. La lección es clara: no dejemos pasar las oportunidades que Jehová nos da para servirle, reconciliarnos o ayudar a alguien. El momento de actuar es ahora."},
 {v:"Jer 46:22",vu:bible(24,46),idea:"Egipto, humillado, suena como una serpiente que se arrastra mientras los babilonios lo talan como árboles.",fuentes:["j46","itVoz"],ref:"Biblia de estudio, Jer 46:22; Perspicacia, «Voz», párr. 16.",aprendemos:"El orgullo termina en humillación.",aplicar:"Egipto se creía invencible, pero terminó arrastrándose por el suelo. ¡Qué contraste con la manera en que Jehová ve las cosas! Jesús dijo que el que se ensalza será humillado y el que se humilla será ensalzado (Lucas 14:11). Si cultivamos la humildad, evitaremos la caída que sufrió Egipto. Y si ya hemos cometido un error, tengamos el valor de reconocerlo y corregir el rumbo."},
 {v:"Jer 46:23",vu:bible(24,46),idea:"Los babilonios son más numerosos que las langostas; nada puede frenar el juicio que Jehová anunció.",fuentes:["j46"],ref:"Biblia de estudio, Jer 46:23.",aprendemos:"Ninguna fuerza humana puede impedir que se cumpla la palabra de Jehová.",aplicar:"Egipto confiaba en sus bosques impenetrables y en su ejército. Pero Jehová dijo que serían talados como árboles. Cuando Jehová decide algo, no hay muralla, ejército ni riqueza que lo detenga. Esto puede llenarnos de confianza: las promesas de Jehová se cumplirán con la misma seguridad. Y también nos advierte: no podemos escapar de las consecuencias de desobedecerle."},
 {v:"Jer 46:26",vu:bible(24,46),idea:"Aunque Jehová castiga a Egipto, anuncia que «después volverá a ser habitada como en el pasado».",fuentes:["j46"],ref:"Biblia de estudio, Jer 46:26.",aprendemos:"El castigo de Jehová tiene un límite y deja lugar a la restauración.",aplicar:"Jehová no se deleita en destruir. Incluso cuando anuncia juicio, deja abierta la puerta a la restauración. Eso nos enseña cómo tratarlo a él y cómo tratar a los demás. Cuando alguien nos ofende, ¿lo condenamos para siempre o le damos la oportunidad de cambiar? La misericordia de Jehová debería movernos a ser misericordiosos con los demás."},
 {v:"Jer 46:27, 28",vu:bible(24,46),idea:"Jehová tranquiliza a Jacob: no debe temer, porque él estará con su pueblo y lo salvará de tierras lejanas.",fuentes:["j46"],ref:"Biblia de estudio, Jer 46:27, 28.",aprendemos:"Jehová disciplina a los suyos, pero nunca los abandona.",aplicar:"En el mismo capítulo en el que Jehová anuncia el castigo de Egipto, consuela a su pueblo. Le dice: «No tengas miedo, mi siervo Jacob». Es cierto que los disciplinaría «hasta el grado debido», pero no los exterminaría. Esta es una garantía preciosa para nosotros: aunque pasemos por pruebas o corrección, Jehová sigue estando con nosotros. Nunca nos deja solos."}
];

var MAESTROS={
  p4:{marco:"Predicación informal. El publicador está en una situación cotidiana —una fila, una parada, el trabajo o una reunión social— y conversa con alguien que parece estar contento. Duración: 3 minutos.",leccion:"lmd lección 2 punto 3 — Naturalidad: sea observador. Fíjese en las expresiones faciales y el lenguaje corporal. Una manera sencilla de introducir una idea bíblica es preguntar: «¿Sabía que...?». Si la persona no quiere hablar, no insista.",objetivo:"Empezar una conversación natural con alguien que se ve contento y llevar el tema a una verdad bíblica.",tema:"Aprovechar el buen ánimo de la persona para hablar de la esperanza del Paraíso.",texto:"Salmo 37:11 — los mansos heredarán la tierra y disfrutarán de abundante paz.",dialogo:"PUBLICADOR: ¡Qué buen día! Se le nota contento.\n\nPERSONA: Sí, hoy es uno de esos días en los que todo sale bien.\n\nPUBLICADOR: Me alegra mucho. ¿Sabía que la Biblia promete que algún día todos los días serán así?\n\nPERSONA: ¿En serio?\n\nPUBLICADOR: Sí. Mire lo que dice el Salmo 37:11. (Lee el texto.) ¿Se imagina vivir sin preocupaciones ni sufrimiento?\n\nPERSONA: Suena muy bien.\n\nPUBLICADOR: Me gustaría mostrarle cómo conseguirlo. ¿Le parece si le dejo esta publicación y hablamos otro día?",demostrar:["Observar las expresiones y el ánimo de la persona","Preguntar con naturalidad: «¿Sabía que...?»","Dar un solo texto bíblico, breve y bien leído","No insistir si la persona no quiere seguir hablando","Adaptarse al rumbo de la conversación"],conclusion:"Agradecer el tiempo y dejar la puerta abierta para otra conversación."},
  p5:{marco:"De casa en casa. La persona que abre la puerta está enojada y habla con brusquedad. Duración: 2 minutos.",leccion:"lmd lección 4 punto 5 — Humildad: sea apacible. No se empeñe en demostrar que usted tiene la razón. Nuestro objetivo no es discutir. La humildad lo ayudará a mantener la calma y a saber cuándo es hora de retirarse (Proverbios 17:14; Tito 3:2).",objetivo:"Responder con apacibilidad a una persona enojada y dejar una buena impresión.",tema:"La humildad mantiene la calma y evita que la conversación se convierta en discusión.",texto:"Proverbios 15:1 — la respuesta apacible calmó el furor.",dialogo:"PERSONA: ¡Ya les he dicho que no quiero nada! ¡No vuelvan por aquí!\n\nPUBLICADOR: Disculpe si la hemos molestado. No quería incomodarla. (Pausa.) ¿Está pasando por algún problema?\n\nPERSONA: Es que no tengo tiempo para esto.\n\nPUBLICADOR: Lo entiendo. Todos andamos con prisa. Solo le digo una cosa breve y me voy: la Biblia promete que pronto habrá alivio para los problemas que nos agobian (Proverbios 15:1). ¿Le dejo esta publicación para cuando tenga un momento?\n\nPERSONA: Bueno... déjela ahí.\n\nPUBLICADOR: Gracias. Que tenga un buen día.",demostrar:["Hablar con voz calmada y sin ponerse a la defensiva","No discutir ni intentar tener la razón","Reconocer el derecho de la persona a no querer escuchar","Ser breve y retirarse a tiempo","Dejar una publicación sin presionar"],conclusion:"Retirarse con apacibilidad; la buena impresión puede abrir la puerta en otra ocasión."},
  p6:{marco:"De casa en casa. La persona que abre la puerta se ve triste y habla en voz baja. Duración: 2 minutos.",leccion:"lmd lección 2 punto 4 — Naturalidad: tenga paciencia. No piense que tiene que hablar de la Biblia enseguida. Espere al momento oportuno y saque el tema de forma natural.",objetivo:"Mostrar interés sincero por una persona triste y ofrecer consuelo bíblico en el momento adecuado.",tema:"La compasión abre el corazón antes que el mensaje.",texto:"Salmo 34:18 — Jehová está cerca de los que están quebrantados de corazón.",dialogo:"PUBLICADOR: Buenas tardes. Disculpe, ¿se encuentra bien?\n\nPERSONA: Es un día difícil, gracias.\n\nPUBLICADOR: Lo siento mucho. No quiero molestarla. ¿Le ha pasado algo?\n\nPERSONA: Perdí a un familiar hace poco.\n\nPUBLICADOR: Cuánto lo siento. Debe ser muy doloroso. (Pausa.) ¿Le puedo leer algo que a mí me ha consolado?\n\nPERSONA: Sí, por favor.\n\nPUBLICADOR: El Salmo 34:18 dice que Jehová está cerca de los que están quebrantados de corazón. Él ve su dolor y promete que pronto la muerte ya no existirá (Apocalipsis 21:4). ¿Le gustaría saber más sobre esa promesa?",demostrar:["Notar el estado de ánimo y hablar con suavidad","Escuchar antes de enseñar","Dar tiempo a la persona; no atropellar","Leer un texto que responda al dolor, no un sermón","Ofrecer una visita de seguimiento con respeto"],conclusion:"Terminar con una expresión de cariño y una oferta concreta de ayuda o de visita."},
  p7:{marco:"Discurso de 4 minutos. Tema: Jesús no es Dios. Textos: Juan 14:28; 1 Corintios 11:3. Se usa como base el lmd apéndice A punto 20 y la lección 7 de th (usar información exacta y convincente).",leccion:"lmd apéndice A punto 20 — Jesús no es Dios. th lección 7 — Usar información exacta y convincente: base sus comentarios en la Palabra de Dios, lea directamente de ella y ayude a los oyentes a razonar.",objetivo:"Demostrar con la Biblia, de forma clara y respetuosa, que Jesús es el Hijo de Dios y no el Dios Todopoderoso.",tema:"Jesús no es Dios.",texto:"Juan 14:28 — «el Padre es mayor que yo». 1 Corintios 11:3 — «la cabeza del Cristo es Dios».",dialogo:"INTRODUCCIÓN: Muchas personas sinceras creen que Jesús es Dios. Es una creencia muy extendida. Pero veamos lo que enseña la propia Biblia, con dos textos muy claros.\n\nPRIMER TEXTO: En Juan 14:28, Jesús dijo a sus discípulos: «Si me aman, les alegrará que vaya al Padre, porque el Padre es mayor que yo». Si Jesús fuera Dios, ¿podría decir que el Padre es mayor que él? No. Las palabras de Jesús muestran que él es el Hijo y que su Padre es superior.\n\nSEGUNDO TEXTO: En 1 Corintios 11:3, Pablo escribió: «La cabeza de todo hombre es el Cristo, que la cabeza de la mujer es el hombre y que la cabeza del Cristo es Dios». Fíjense en el orden: el Cristo tiene cabeza, y esa cabeza es Dios. Jesús mismo reconoció que tenía una cabeza, alguien superior a él.\n\nRAZONEMOS: Jesús nunca dijo ser Dios. Se llamó a sí mismo «el Hijo de Dios» (Juan 10:36) y oró a su Padre (Juan 17:1). Un Dios no ora a otro Dios. Lo que la Biblia enseña es que Jesús es el Hijo de Dios, el Mesías, el Rey del Reino, pero no el Dios Todopoderoso.\n\nCONCLUSIÓN: Esta verdad no le quita valor a Jesús; al contrario, nos ayuda a conocerlo como realmente es: el Hijo fiel de Jehová, que dio su vida por nosotros. Y nos acerca más a Jehová, el Padre, a quien Jesús nos enseñó a orar.",demostrar:["Usar textos bíblicos exactos, leídos directamente","Razonar con el auditorio, no solo afirmar","Mantener un tono respetuoso hacia otras creencias","No exagerar ni sacar los textos de contexto","Terminar con una conclusión positiva sobre Jehová y Jesús"],conclusion:"Cerrar destacando que conocer la verdad sobre Jesús nos acerca más a Jehová."}
};

var VIDA_P8={
  introGuion:"Análisis con el auditorio (15 minutos). Vamos a hablar de compartir lo que tenemos. El texto base es Hebreos 13:16: «No se olviden de hacer el bien ni de compartir lo que tienen con los demás, porque estos sacrificios le agradan mucho a Dios». Primero veremos el ejemplo de generosidad de los cristianos de Macedonia, y después el video «Hazte amigo de Jehová: Aprende a compartir». La idea es que recordemos algo importante: compartir no es solo dar cosas materiales; también es dar tiempo, atención y ánimo. Y ahora es el momento de aprenderlo, porque en el futuro lo necesitaremos más que nunca.",
  video:{t:"Hazte amigo de Jehová: Aprende a compartir",u:"https://www.jw.org/finder?wtlocale=S&docid=1102014281"},
  preguntas:[
    {q:"¿Qué aprendemos del buen ejemplo de las congregaciones de Macedonia?",respuesta:"Los macedonios estaban pasando por «una dura prueba» y eran «muy pobres», pero dieron con gran alegría, incluso «más de lo que podían dar» (2 Corintios 8:2-4). Su ejemplo enseña que la generosidad no depende de tener mucho, sino de tener un corazón dispuesto. Además, ellos mismos rogaron con insistencia que se les permitiera participar en la obra de socorro. Nosotros también podemos dar aunque tengamos poco, y Jehová valora ese sacrificio."},
    {q:"Además de las cosas materiales, ¿qué más podemos compartir?",respuesta:"Podemos compartir tiempo, atención, habilidades, experiencia y ánimo. Una visita, una llamada, una palabra de aliento o una oración por un hermano pueden valer más que un objeto. También podemos compartir nuestro conocimiento de la Biblia en la predicación y ayudar a otros a conocer a Jehová. El tiempo y la energía son recursos valiosos, y cuando los damos con generosidad estamos imitando a Jehová."},
    {q:"¿Cómo beneficiaría el consejo de Pablo a los cristianos que lo pusieran en práctica?",respuesta:"Los cristianos de Judea habían huido a las montañas y habían dejado sus casas y trabajos. Compartir lo que tenían fue vital para que muchos sobrevivieran y para que la congregación siguiera adelante. Hoy pasa algo parecido: cuando compartimos, ayudamos a hermanos que pasan por dificultades y fortalecemos la unidad. Además, el que da con alegría también se beneficia, porque experimenta la felicidad de dar (Hechos 20:35)."},
    {q:"Teniendo en cuenta lo que ocurrirá en el futuro, ¿por qué es importante que aprendamos ahora a compartir lo que tenemos?",respuesta:"En la gran tribulación, quizás tengamos que dejar nuestras casas y cosas, como les pasó a los cristianos de Judea. Si ahora no practicamos la generosidad, será muy difícil hacerlo en una situación de emergencia. Aprender a compartir hoy nos prepara para cooperar con los hermanos en el futuro y para confiar en que Jehová cuidará de nosotros por medio de la hermandad."},
    {q:"(Después del video) Jehová comparte sus cosas. ¿Qué nos enseña eso a nosotros?",respuesta:"Jehová nos da la vida, el alimento, el aire, la posibilidad de vivir para siempre y hasta el privilegio de servirle. Todo lo que tenemos viene de él. Su ejemplo nos enseña que el amor se demuestra dando. Si Jehová, que tiene todo, comparte con nosotros, nosotros también deberíamos compartir con los demás lo que tenemos, incluido nuestro tiempo y nuestro cariño."}
  ],
  aplicacion:"Esta semana, pensemos en una persona a la que podamos compartir algo concreto: una comida, una visita, una llamada, una hora de nuestro tiempo o una palabra de ánimo. No esperemos a tener mucho para dar. Los macedonios dieron «más de lo que podían dar» porque su corazón estaba dispuesto.",
  cierre:"Jehová es generoso con nosotros todos los días. Si aprendemos ahora a compartir lo que tenemos, estaremos preparados para el futuro y contribuiremos a que la hermandad sea una verdadera familia. ¿Verdad que queremos ser generosos como Jehová y como los cristianos de Macedonia?"
};

var ESTUDIO_P9={
  fuente:{t:"Seamos valientes al andar con Dios — cap. 13",u:pc("/13/0")},
  libro:"wcg cap. 13 — «Josué: Siguió instrucciones extrañas»",
  textosDestacados:[
    {ref:"Josué 6:1-5",texto:"«Jericó estaba completamente cerrada por causa de los israelitas; nadie salía y nadie entraba. Jehová entonces le dijo a Josué: “Mira, te he entregado Jericó con su rey y sus poderosos guerreros. Todos ustedes, los guerreros, tienen que marchar alrededor de la ciudad y darle la vuelta una vez. Y tienen que hacer eso durante seis días. Que siete sacerdotes vayan delante del Arca llevando siete cuernos de carnero. Pero, al séptimo día, ustedes marcharán alrededor de la ciudad siete veces y los sacerdotes tocarán los cuernos. Cuando toquen los cuernos de carnero —en cuanto ustedes oigan el sonido de los cuernos—, todo el pueblo debe soltar un gran grito de guerra. Entonces la muralla de la ciudad se desplomará, y el pueblo tiene que subir, cada uno directamente hacia delante”»."},
    {ref:"Josué 6:20",texto:"«Entonces, cuando tocaron los cuernos, el pueblo gritó. En cuanto el pueblo oyó el sonido del cuerno y soltó un gran grito de guerra, la muralla se desplomó. Después de eso, el pueblo subió a la ciudad, cada uno directamente hacia delante, y conquistaron la ciudad»."},
    {ref:"Josué 23:14",texto:"«Ustedes saben muy bien con todo su corazón y con toda su alma que ni una sola palabra de todas las buenas promesas que Jehová su Dios les hizo ha fallado. Todas se han cumplido a favor de ustedes. Ni una sola palabra de ellas ha fallado»."}
  ],
  preguntas:[
    {q:"¿De qué escritos inspirados seguramente disponía Josué?",a:"Seguramente disponía de los escritos que se atribuyen a Moisés: Génesis, Éxodo, Levítico, Números, Deuteronomio, Job y uno o dos salmos. Jehová le aconsejó que cuidara de hacer conforme a toda la ley que Moisés le había mandado (Josué 1:7). Pero no bastaba con tener los rollos; tenía que leerlos y obedecerlos. Nosotros tenemos la Biblia completa: ¿la leemos con regularidad y la aplicamos?"},
    {q:"¿Qué le pidió Jehová a Josué antes de que los israelitas marcharan alrededor de Jericó? ¿Y por qué parecía que esas instrucciones no eran lógicas?",a:"Le pidió que circuncidara a todos los hombres (Josué 5:2-8). Desde el punto de vista militar, no parecía lógico: los soldados quedarían débiles y no podrían luchar durante varios días, y el enemigo podría atacarlos. Pero Jehová sabía lo que hacía. Los hombres de Jericó no los atacaron; al contrario, se encerraron por miedo. Aquello fortaleció la confianza de Israel en la guía de Jehová."},
    {q:"¿Qué pruebas hay de que los israelitas sitiaron Jericó por poco tiempo antes de conquistarla?",a:"Los arqueólogos que excavaron Jericó encontraron mucha comida, especialmente vasijas con grano. Normalmente, una ciudad sitiada durante mucho tiempo consume sus reservas, y los vencedores se llevan lo que queda. El que se hallara tanto grano indica que el sitio fue corto. Además, la Biblia dice que los israelitas no se llevaron el grano porque Jehová se lo prohibió (Josué 6:17, 18), y que atacaron justo después de la cosecha (Josué 3:15-17; 5:10). Todo concuerda con el relato bíblico."},
    {q:"¿Cómo se cumplió la profecía de Josué capítulo 6 versículo 26 sobre Jericó?",a:"Josué juró que quien reconstruyera Jericó pagaría con la vida de su primogénito y de su hijo menor. Unos quinientos años después, Hiel el betelita reconstruyó Jericó y perdió a Abiram, su primogénito, y a Segub, el menor (1 Reyes 16:34). Se cumplió exactamente lo que Josué había dicho. Solo un Dios real pudo inspirar esa profecía y hacer que se cumpliera."},
    {q:"¿Por qué confiaba Josué en las promesas de Jehová? ¿Cómo podemos nosotros tener una confianza como la suya?",a:"Josué había visto a Jehová cumplir sus promesas una y otra vez: el paso del Jordán, la caída de Jericó, la conquista de la tierra. Por eso, al final de su vida pudo decir que ni una sola palabra de las promesas de Jehová había fallado (Josué 23:14). Nosotros podemos tener la misma confianza si recordamos cómo Jehová ha cumplido su Palabra en el pasado, tanto en la Biblia como en nuestra propia vida, y si obedecemos aunque al principio no entendamos las instrucciones."},
    {q:"¿Cómo nos ayuda el ejemplo de Josué a seguir las instrucciones que recibimos de parte de la organización de Jehová?",a:"Josué recibió instrucciones que no tenían lógica desde el punto de vista humano, pero las obedeció y Jehová bendijo su obediencia. Hoy recibimos instrucciones claras por medio de la Biblia, las publicaciones y los ancianos: prepararnos para emergencias, cuidar nuestra espiritualidad, mantenernos separados del mundo. A veces no entendemos todos los detalles, pero si confiamos en Jehová y obedecemos, nos irá bien, igual que a Josué."}
  ]
};

var ATALAYA={intro:"Artículo de estudio para la semana del 19 al 25 de octubre de 2026. Texto base: Filemón 9. Tema: qué aprendemos del apóstol Pablo, Filemón y Onésimo sobre cómo contribuir a que haya paz en la congregación. Canción inicial: 106. Canción final: 154.",parrafos:[
  {num:"1",texto:"La paz que existe entre los siervos de Jehová es un tesoro de valor incalculable. Nos ayuda a imaginar cómo será la vida en el Paraíso (Isaías 32:17, 18). Aunque es Jehová quien hace posible esa paz, cada uno de nosotros tiene la responsabilidad de mantenerla y protegerla (Romanos 12:18). ¿Cómo podemos fomentar la paz dentro de la congregación al tratar con los hermanos? ¿Cómo podemos hacerlo cuando alguien nos ofende? ¿Y si somos nosotros los que ofendemos a alguien? Para encontrar las respuestas, vamos a analizar un relato protagonizado por Pablo, Filemón y Onésimo, en el que el apóstol hizo un ruego apelando al amor.",pregunta:"¿Qué responsabilidad tenemos todos?",respuesta:"Cada uno de nosotros tiene la responsabilidad de mantener y proteger la paz de la congregación. Jehová hace posible esa paz, pero nosotros debemos poner de nuestra parte. Lo hacemos cuando tratamos a los hermanos con amor, cuando perdonamos y cuando pedimos perdón. La paz no es solo ausencia de conflictos: es un tesoro que se cuida con cada decisión."},
  {num:"2",texto:"Pablo le dirigió a Filemón una carta en la que le rogó que recibiera amablemente a su esclavo Onésimo. Le hizo ese ruego apelando al amor que Filemón sentía por Cristo y por todos los hermanos. Filemón era un cristiano de la congregación de Colosas, conocido por la fortaleza de su amor y su fe. Tenía un esclavo que no era cristiano llamado Onésimo. Un día, Onésimo lo abandonó y huyó a Roma, tal vez robándole algo de dinero (Filemón 18). Allí se hizo cristiano y llegó a ser un buen amigo de Pablo (Colosenses 4:9). Sin embargo, según las leyes romanas, Onésimo tenía que regresar con su amo, así que Pablo lo envió de vuelta (Filemón 12, 13).",pregunta:"Cuenta brevemente la historia de Filemón y Onésimo (Filemón 8, 9, 17).",respuesta:"Filemón era un cristiano de Colosas, conocido por su amor y su fe. Su esclavo Onésimo huyó a Roma, quizás robándole dinero. En Roma se hizo cristiano y se hizo amigo de Pablo. Pablo lo envió de vuelta a Filemón con una carta en la que le rogó, apelando al amor, que lo recibiera amablemente como a un hermano."},
  {num:"3",texto:"Puede que Pablo se preguntara: «¿Qué hará Filemón cuando regrese Onésimo? ¿Ejercerá su derecho legal a darle un castigo severo? ¿Cómo reaccionará la congregación? ¿Surgirá una polémica entre los demás esclavos y amos?». Pablo era consciente de que la situación podía poner en peligro la paz de la congregación. Por eso le escribió una carta a Filemón y se la envió por medio de Tíquico (Efesios 6:21, 22; Colosenses 4:7-9). Además, le mandó una carta a la congregación de Colosas.",pregunta:"¿Qué se pudo preguntar Pablo al enviar de vuelta a Onésimo?",respuesta:"Pablo pudo preguntarse cómo reaccionaría Filemón, si ejercería su derecho legal a castigar a Onésimo, cómo reaccionaría la congregación y si surgiría una polémica entre esclavos y amos. Era consciente de que la situación podía poner en peligro la paz de la congregación, por eso escribió con tanto cuidado."},
  {num:"4",texto:"¿Qué nos enseña el ejemplo de Pablo? Su forma de tratar a los demás contribuyó a mantener la paz de la congregación. Veamos qué cosas hizo y cómo podemos hacer lo mismo al tratar con nuestros hermanos.",pregunta:"¿Cómo pueden los ancianos contribuir a que se respire un ambiente de paz en la congregación?",respuesta:"Los ancianos contribuyen a la paz cuando tratan a los hermanos como amigos, no como amos. Les dedican tiempo, los escuchan, los valoran y los ayudan siempre que lo necesitan. Al imitar a Pablo, les dan un buen ejemplo a todos para que también se esfuercen por fomentar la paz."},
  {num:"5",texto:"Pablo le habló a Filemón como amigo (Filemón 17). No se creía su amo ni pensaba que podía obligarlo a hacer lo que él quisiera (2 Corintios 1:24). Más bien, lo veía como un igual y le recordó la amistad que los unía. Así le dio un buen ejemplo de cómo tratar a Onésimo, que ahora era su hermano. Cuando los ancianos tratan a los hermanos como amigos, contribuyen a que se respire un ambiente de paz. Son pastores amorosos y no actúan como si fueran los amos de las ovejas de Dios (1 Pedro 5:1-3).",pregunta:"¿Cómo pueden los ancianos contribuir a que se respire un ambiente de paz en la congregación?",respuesta:"Tratando a los hermanos como amigos e iguales, dedicándoles tiempo, escuchándolos y valorándolos. No deben actuar como amos de las ovejas, sino como pastores amorosos que sirven a sus hermanos."},
  {num:"6",texto:"Pablo elogió a Filemón (Filemón 4, 5, 7). Todos necesitamos recibir elogios. Una razón es que a muchos de vez en cuando nos invaden sentimientos de inseguridad. Quizás nos preocupe nuestro aspecto, lo que otros opinen de nosotros o la posibilidad de perder un privilegio de servicio que valoramos mucho. Es normal sentirse así. Ahora bien, esos sentimientos pueden agobiarnos, volvernos irritables, ponernos a la defensiva o hacer que desarrollemos una actitud competitiva. Recibir elogios es un buen remedio, pues nos hace sentir queridos y valorados (Proverbios 12:25).",pregunta:"¿Por qué es importante elogiar a los demás?",respuesta:"Porque todos necesitamos sentirnos queridos y valorados, y los elogios sinceros nos fortalecen. Además, ayudan a evitar que la inseguridad nos vuelva irritables, defensivos o competitivos. Busquemos ocasiones de elogiar a los hermanos de corazón, no solo por sus logros, sino también por sus esfuerzos."},
  {num:"7",texto:"Pablo habló bien de Onésimo (Filemón 10-12). Es muy posible que esas palabras amables influyeran en cómo Filemón veía, hablaba y trataba a Onésimo. De manera parecida, lo que decimos sobre los hermanos influye en cómo otros los ven y los tratan. Si decimos cosas buenas de ellos, será más probable que los demás los traten bien. Pero también puede darse el caso contrario: decir cosas malas de ellos puede hacer que los demás los traten mal. Ahora bien, para decir cosas positivas sobre otros, primero debemos tener una opinión positiva de ellos.",pregunta:"¿Por qué debemos tener cuidado con lo que decimos sobre otros?",respuesta:"Porque nuestras palabras influyen en cómo los demás ven y tratan a nuestros hermanos. Si hablamos bien de ellos, ayudamos a que otros los traten bien; si hablamos mal, podemos dañar su reputación y la unidad. Además, para hablar bien de alguien primero tenemos que aprender a verlo como Jehová lo ve."},
  {num:"8",texto:"Pablo siempre le daba gracias a Jehová por las excelentes cualidades de Filemón (Filemón 4, 5). Y hacía lo mismo con muchos otros cristianos (1 Corintios 1:4-7; Filipenses 1:3-5; Colosenses 1:3, 4; 1 Tesalonicenses 1:2, 3). Es cierto que era consciente de los defectos de sus hermanos, pero se esforzaba por centrarse en sus virtudes. Además, solía agradecerle a Jehová contar con esos buenos amigos. Si adquirimos la costumbre de pensar bien de los hermanos y orarle a Jehová para que los bendiga, luego nos nacerá decir cosas positivas sobre ellos.",pregunta:"¿Qué nos ayudará a pensar y hablar bien de los hermanos?",respuesta:"Centrarnos en sus virtudes, agradecer a Jehová por ellos y orar por su bien. Si cultivamos una opinión positiva de nuestros hermanos, nos resultará natural hablar bien de ellos."},
  {num:"9",texto:"Pablo trató a Filemón con bondad a pesar de tener sus propios problemas. ¿Quién no ha perdido alguna vez la paciencia con otra persona debido al estrés o al agotamiento? Cuando pasamos por situaciones complicadas, quizás acabemos descargando nuestra frustración con los demás. Pues bien, pensemos en las circunstancias de Pablo cuando le escribió a Filemón: unos años antes lo habían atacado violentamente, lo habían detenido injustamente, lo habían trasladado a Jerusalén y a Cesarea, el barco en el que viajaba naufragó y al llegar a Roma lo pusieron bajo arresto domiciliario. ¿Permitió que aquellas vivencias influyeran en su manera de dirigirse a Filemón? No, pues su carta fue cariñosa y amable.",pregunta:"¿Por qué es tan llamativo que Pablo le hablara a Filemón con bondad?",respuesta:"Porque Pablo había pasado por experiencias muy duras y traumáticas, y aun así no descargó su frustración con Filemón. Su carta fue cariñosa y amable. Esto nos enseña que, cuando estemos cansados o bajo presión, debemos esforzarnos por tratar a los demás con bondad."},
  {num:"10",texto:"Todos decimos y hacemos cosas que ofenden a otros. El ejemplo de Onésimo nos enseña qué tenemos que hacer para reparar nuestra amistad. Él hizo algo que suele ser más fácil de decir que de hacer: reconoció su error y puso de su parte para hacer las paces. Seguramente sabía que la ley lo obligaba a regresar con su amo. Así que realizó un viaje caro y agotador de más de 1.400 kilómetros. Estuvo dispuesto a renunciar a su libertad y aceptar otras posibles consecuencias. Está claro que no fue una decisión fácil.",pregunta:"¿Qué nos enseña el ejemplo de Onésimo?",respuesta:"Que, si hemos ofendido a alguien, debemos reconocer nuestro error y poner de nuestra parte para hacer las paces, aunque sea difícil o costoso. Onésimo viajó más de 1.400 kilómetros y estuvo dispuesto a aceptar las consecuencias. Ese valor y esa humildad son un ejemplo para nosotros."},
  {num:"11",texto:"Si hemos ofendido a alguien, tomemos la iniciativa para hacer las paces (Mateo 5:23-25). Aunque esto puede ser difícil, vale la pena, pues recuperaremos a nuestro amigo. Empecemos pidiendo disculpas de corazón. Estemos dispuestos a escuchar a la otra persona y tratemos de comprender lo que siente. Reconozcamos nuestro error. No nos justifiquemos ni les echemos la culpa a otras personas o cosas, pues así podríamos quitarle valor a nuestra disculpa, alargar el problema o incluso empeorar la situación. Pedir perdón requiere humildad, pero suele ser la manera más rápida de hacer las paces (Romanos 14:19).",pregunta:"Si hemos ofendido a alguien, ¿cómo podemos hacer las paces?",respuesta:"Tomando la iniciativa, pidiendo disculpas de corazón, escuchando a la otra persona y reconociendo nuestro error sin justificarnos ni echar la culpa a otros. Pedir perdón requiere humildad, pero es la manera más rápida de recuperar la amistad y la paz."},
  {num:"12",texto:"El ejemplo de Filemón nos enseña a mantener la paz cuando alguien nos ofende. El relato no indica si perdonó a Onésimo y lo recibió amablemente, pero Pablo estaba convencido de que lo haría (Filemón 17, 21). ¿Por qué? Porque sabía que Filemón tenía cualidades que lo impulsarían a perdonar.",pregunta:"¿Por qué estaba convencido Pablo de que Filemón perdonaría a Onésimo?",respuesta:"Porque conocía las cualidades de Filemón: amaba a los hermanos, era hospitalario y estaba dispuesto a perdonar. Pablo sabía que esas cualidades lo impulsarían a recibir a Onésimo con cariño."},
  {num:"13",texto:"Filemón amaba a los hermanos (Filemón 5). Su propio nombre significa «amoroso», y ese nombre le venía como anillo al dedo, pues toda la congregación sabía que Filemón destacaba por su amor. Y sin duda iba a necesitar esta cualidad para perdonar a Onésimo. En la carta que Pablo le escribió a la congregación de Colosas, a la que pertenecía Filemón, dijo que el amor es «un lazo de unión perfecto» (Colosenses 3:14). En otras palabras, la cualidad que más contribuye a la paz y la unidad es el amor.",pregunta:"¿Por qué es esencial mostrar amor para mantener la paz?",respuesta:"Porque el amor es «un lazo de unión perfecto». Cuanto más amemos a los hermanos, más fácil nos resultará perdonarlos y tratarlos con bondad. El amor nos impulsa a pasar por alto sus faltas y a buscar su bien."},
  {num:"14",texto:"Filemón tenía una cualidad que hacía que su amor fuera más fuerte: la hospitalidad. Él ofreció su casa para que la congregación celebrara allí sus reuniones (Filemón 2). Algo que también indica que era hospitalario es que Pablo le pidió que le preparara un lugar donde quedarse (Filemón 22). Seguro que quienes se beneficiaron de su generosidad se sintieron bienvenidos y animados (Filemón 7).",pregunta:"¿Cómo sabemos que Filemón era hospitalario?",respuesta:"Porque ofreció su casa para que la congregación se reuniera allí y porque Pablo le pidió que le preparara un lugar donde quedarse. Su hospitalidad hacía que los hermanos se sintieran bienvenidos y animados."},
  {num:"15",texto:"Si somos tan hospitalarios como Filemón, nosotros también amaremos más a los hermanos. ¿Por qué? Porque eso nos permitirá conocerlos mejor. Al pasar tiempo con los que no forman parte de nuestro círculo más cercano e incluso con los que parece que no tenemos demasiado en común, nos damos cuenta de que el pueblo de Jehová es muy variado y eso lo hace realmente hermoso. Cuando conocemos cuál es su historia, cómo aprendieron la verdad y qué pruebas han soportado, llegamos a quererlos y respetarlos más. Y no solo eso; también vemos por qué Jehová los trajo para que formaran parte de su familia (Juan 6:44).",pregunta:"¿Por qué amaremos más a los hermanos si somos hospitalarios?",respuesta:"Porque la hospitalidad nos permite conocerlos mejor: su historia, cómo aprendieron la verdad y qué pruebas han soportado. Al conocerlos, aprendemos a quererlos y respetarlos más, y vemos por qué Jehová los trajo a su familia."},
  {num:"16",texto:"¿Y si nos está costando perdonar a alguien? Aunque amamos a nuestros hermanos, a veces nos puede resultar difícil perdonarlos. Algo que nos ayudará es analizar uno de los consejos que Pablo le dio a la congregación de Colosas, que se reunía en la casa de Filemón (Colosenses 3:13). ¿Qué pensaría Filemón cuando leyeron esas palabras? ¿Se acordó tal vez de Onésimo? ¿Le guardaba resentimiento? De ser así, Filemón sabía lo que tenía que hacer: seguir soportándolo y perdonarlo con generosidad.",pregunta:"¿Qué es posible que hiciera Filemón para aplicar las palabras de Colosenses capítulo 3 versículo 13?",respuesta:"Es posible que, al escuchar esas palabras, pensara en Onésimo y decidiera perdonarlo con generosidad, tal como Jehová lo había perdonado a él. Filemón tenía que seguir soportándolo y perdonarlo, no guardarle resentimiento."},
  {num:"17",texto:"¿Qué significa el consejo de Pablo «Sigan soportándose unos a otros»? Que debemos ser pacientes con nuestros hermanos y tratarlos con bondad incluso cuando nos irritan o nos ofenden. En ese mismo versículo, el apóstol destacó el excelente ejemplo que nos da Jehová. Él es razonable en lo que espera de sus siervos. Conoce muy bien nuestras debilidades, pero prefiere fijarse en nuestras virtudes (Salmo 103:13, 14; Salmo 130:3). Por eso sigue mostrándonos amor leal y misericordia (Lamentaciones 3:22, 23). Si nos esforzamos por ver a los hermanos como los ve Jehová, nos resultará más fácil ser pacientes con ellos y soportar sus errores, tal como ellos hacen con nosotros.",pregunta:"¿Qué significa el consejo de Pablo «Sigan soportándose unos a otros»?",respuesta:"Significa ser pacientes con los hermanos y tratarlos con bondad incluso cuando nos irritan o nos ofenden. Jehová es razonable con nosotros y prefiere fijarse en nuestras virtudes; si lo imitamos, nos resultará más fácil soportar los errores de los demás."},
  {num:"18",texto:"Jehová valora cada cosa que hacemos para contribuir a la paz de la congregación. Así que busquemos todos los días maneras de fomentarla. Sigamos tratando con bondad a los hermanos y hablando bien de ellos. Si ofendemos a alguien, pidamos perdón y hagamos las paces. Además, cultivemos un amor fuerte por los hermanos, la clase de amor que nos permitirá perdonar con generosidad. Si hacemos todo lo anterior, estaremos poniendo nuestro granito de arena para que en la congregación se respire paz. Y estaremos entre los mansos que «heredarán la tierra y disfrutarán plenamente de abundante paz» por toda la eternidad (Salmo 37:11).",pregunta:"¿Qué queremos hacer cada uno de nosotros?",respuesta:"Buscar todos los días maneras de fomentar la paz: tratar con bondad a los hermanos, hablar bien de ellos, pedir perdón cuando ofendamos y cultivar un amor fuerte que nos permita perdonar con generosidad. Así estaremos entre los mansos que heredarán la tierra y disfrutarán de abundante paz."}
]};

function fmtMs(ms){if(ms<0)ms=0;var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function ensurePos(){if(TPOS)return;var w=window.innerWidth,h=window.innerHeight;TPOS={x:Math.max(8,w-90),y:Math.max(8,h-220)};lsSet(K_TICK,TPOS);}
function clampPos(box){var w=window.innerWidth,h=window.innerHeight;var bw=box.offsetWidth||74,bh=box.offsetHeight||74;TPOS.x=Math.max(6,Math.min(w-bw-6,TPOS.x));TPOS.y=Math.max(6,Math.min(h-bh-6,TPOS.y));}
function applyPos(box){ensurePos();clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";box.style.right="auto";box.style.bottom="auto";}
function timerTick(){
  lsSet(K_TIMER,TIMER);
  var box=document.getElementById("timerbox");if(!box)return;
  if(!TIMER.label){box.classList.remove("show");return;}
  box.classList.add("show");
  var el=timerElapsedMs();var remain=TIMER.assigned*1000-el;var over=remain<0;
  box.classList.toggle("over",over);
  if(TIMER_EXPANDED){
    box.classList.add("expanded");
    box.innerHTML='<button class="tclose" data-act="t-close">×</button><div class="ttitle">'+esc(TIMER.label)+'</div><div class="tgrid"><div class="tbig">'+fmtMs(el)+'</div><div class="grow"><div class="tmini">Asignado: <b>'+fmtMs(TIMER.assigned*1000)+'</b></div><div class="tmini">Restante: <b>'+(over?'+'+fmtMs(-remain):fmtMs(remain))+'</b></div></div></div><div class="row" style="margin-top:10px">'+(TIMER.running?'<button class="btn sm primary grow" data-act="t-pause">PAUSAR</button>':(TIMER.accumulated>0?'<button class="btn sm primary grow" data-act="t-resume">CONTINUAR</button>':'<button class="btn sm primary grow" data-act="t-start">INICIAR</button>'))+'<button class="btn sm grow" data-act="t-reset">REINICIAR</button></div>';
  }else{box.classList.remove("expanded");box.textContent=fmtMs(el);}
  attachDrag(box);applyPos(box);
}
function attachDrag(box){
  if(box.dataset.dragInit==="1")return;box.dataset.dragInit="1";
  var sx,sy,sl,st,dragging=false,moved=false;
  box.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;dragging=true;moved=false;sx=e.clientX;sy=e.clientY;sl=TPOS.x;st=TPOS.y;try{box.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();});
  box.addEventListener("pointermove",function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;TPOS.x=sl+dx;TPOS.y=st+dy;clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";});
  box.addEventListener("pointerup",function(){if(!dragging)return;dragging=false;lsSet(K_TICK,TPOS);if(!moved){TIMER_EXPANDED=!TIMER_EXPANDED;timerTick();}});
  box.addEventListener("pointercancel",function(){dragging=false;});
}
function timerEnsureInterval(){if(TIMER_INT)return;TIMER_INT=setInterval(timerTick,250);}
function timerOpen(label,assignedMin){TIMER.label=label;TIMER.assigned=(assignedMin||10)*60;if(!TIMER.running&&TIMER.accumulated===0)TIMER.startAt=0;TIMER_EXPANDED=false;timerEnsureInterval();timerTick();}
function timerStart(){TIMER.running=true;TIMER.startAt=Date.now();timerTick();}
function timerPause(){if(TIMER.running){TIMER.accumulated+=Date.now()-TIMER.startAt;TIMER.running=false;}timerTick();}
function timerReset(){TIMER.running=false;TIMER.accumulated=0;TIMER.startAt=0;timerTick();}
function timerClose(){TIMER.running=false;TIMER.accumulated=0;TIMER.startAt=0;TIMER.label="";TIMER_EXPANDED=false;timerTick();}
if(TIMER.label)timerEnsureInterval();

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function link(o){return '<a href="'+esc(o.u)+'" target="_blank" rel="noopener">'+esc(o.t)+'</a>';}
function links(arr){return (arr||[]).map(function(o){return '<span class="pill">'+link(o)+'</span>';}).join("");}

var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function pad(n){return (n<10?"0":"")+n;}
function weekInfo(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));var e=new Date(x.getFullYear(),x.getMonth(),x.getDate()+6);var key=x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());var label=(x.getMonth()===e.getMonth())?x.getDate()+"–"+e.getDate()+" de "+MESES[x.getMonth()]+" de "+x.getFullYear():x.getDate()+" de "+MESES[x.getMonth()]+" – "+e.getDate()+" de "+MESES[e.getMonth()]+" de "+e.getFullYear();return {key:key,label:label};}
function srcList(keys){return '<div class="small" style="margin-top:6px"><b>Fuentes:</b> '+keys.map(function(k){return '<span class="pill">'+link(SRC[k])+'</span>';}).join("")+'</div>';}
function field(k,def,label,rows){return (label?'<label for="f-'+esc(k)+'">'+esc(label)+'</label>':'')+'<div class="field-wrap"><span class="edit-badge">✏️ editable</span><textarea id="f-'+esc(k)+'" data-k="'+esc(k)+'"'+(rows?' style="min-height:'+rows+'px"':'')+'>'+esc(val(k,def))+'</textarea></div>';}

function partNote(id){var any=false;for(var k in S.v){if(k.indexOf(id+".")===0&&S.v[k]&&S.v[k]!=="")any=true;}return any;}
function topbar(title,back,right){return '<div class="top"><button class="btn sm" data-act="go" data-id="'+back+'">←</button><h2>'+esc(title)+'</h2>'+(right||"")+'</div>';}
function detectType(p){
  if(!/^p([0-9]|10)$/.test(p.id))return {k:"otra",label:"otra parte"};
  var s=p.section,t=(p.title+" "+(p.raw||"")).toLowerCase();
  if(s==="INICIO")return {k:"inicio",label:"Canción, oración y palabras de introducción"};
  if(s==="TESOROS DE LA BIBLIA"){
    if(/perlas escondidas/.test(t))return {k:"perlas",label:"Busquemos perlas escondidas"};
    if(/lectura de la biblia/.test(t))return {k:"lectura",label:"Lectura de la Biblia"};
    return {k:"tesoros",label:"Tesoros de la Biblia (discurso)"};
  }
  if(s==="SEAMOS MEJORES MAESTROS"){
    if(/de casa en casa/.test(t))return {k:"maestros",sub:p.id,label:"De casa en casa"};
    if(/predicación informal/.test(t))return {k:"maestros",sub:p.id,label:"Predicación informal"};
    if(/predicación pública/.test(t))return {k:"maestros",sub:p.id,label:"Predicación pública"};
    if(/explique sus creencias/.test(t))return {k:"maestros",sub:p.id,label:"Explique sus creencias"};
    if(/discurso/.test(t))return {k:"maestros",sub:p.id,label:"Discurso"};
    return {k:"maestros",sub:p.id,label:"Otra asignación"};
  }
  if(s==="NUESTRA VIDA CRISTIANA"){
    if(/estudio bíblico de la congregación/.test(t))return {k:"estudio",label:"Estudio bíblico"};
    if(/video|auditorio|viudas/.test(t))return {k:"vida",label:"Análisis con el auditorio (con video)"};
    if(/conclusión/.test(t))return {k:"inicio",label:"Palabras de conclusión"};
    return {k:"vida",label:"Otra actividad"};
  }
  return {k:"otra",label:"Otra parte"};
}

function discSeedFields(){
  var out={};
  out["p1.d.titulo"]=DISCURSO_T1.title;
  out["p1.d.duracion"]=DISCURSO_T1.duration;
  out["p1.d.intro"]=DISCURSO_T1.intro;

    out["p1.d.p"+i+".titulo"]=d.titulo;
    if(d.texto){
      out["p1.d.p"+i+".t.ref"]=d.texto.ref;
      out["p1.d.p"+i+".t.intro"]=d.texto.intro;
      out["p1.d.p"+i+".t.lectura"]=d.texto.lectura;
      out["p1.d.p"+i+".t.explicacion"]=d.texto.explicacion;
    }
    out["p1.d.p"+i+".apoyo"]=d.apoyo;
    out["p1.d.p"+i+".leccion"]=d.leccion;
  });
  out["p1.d.aplicacion"]=DISCURSO_T1.aplicacion;
  out["p1.d.conclusion"]=DISCURSO_T1.conclusion;
  return out;
}
function collectDefaults(){var v=JSON.parse(JSON.stringify(S.v));var seed=discSeedFields();for(var k in seed){if(!(k in v)||v[k]==="")v[k]=seed[k];}return v;}

function exportBackup(){
  var data={exportedAt:new Date().toISOString(),weekKey:WEEK.key,week:WEEK.shortLabel,v:S.v,saved:savedList(),discursos:discursosList()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;a.download="respaldo-reunion-"+WEEK.key+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  toast("Respaldo descargado");
}
function importBackup(){
  var inp=document.createElement("input");
  inp.type="file";inp.accept=".json,application/json";
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(data.v){S.v=data.v;persistNow();}
        if(data.saved)lsSet(K_SAVED,data.saved);
        if(data.discursos)lsSet(K_DISC,data.discursos);
        toast("Respaldo importado ✓");render();
      }catch(err){toast("Archivo inválido");}
    };
    r.readAsText(f);
  };
  inp.click();
}

function generarRespuestaBorrador(pregunta,parrafo){
  if(!parrafo)return "";
  var oraciones=parrafo.split(/(?<=[.!?])\s+/).filter(function(o){return o.length>25;});
  var base=oraciones.slice(0,2).join(" ").trim();
  if(!base)base=parrafo.slice(0,220);

}
/* ============ EDITOR DE SEMANA ============ */
function weekLabels(key){
  var p=key.split("-");var x=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(x.getTime()))return null;
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  var e=new Date(x.getFullYear(),x.getMonth(),x.getDate()+6);
  var same=(x.getMonth()===e.getMonth());
  var label=same?x.getDate()+"–"+e.getDate()+" de "+MESES[x.getMonth()]+" de "+x.getFullYear():x.getDate()+" de "+MESES[x.getMonth()]+" – "+e.getDate()+" de "+MESES[e.getMonth()]+" de "+e.getFullYear();
  var shortLabel=same?x.getDate()+"–"+e.getDate()+" "+MESES[x.getMonth()]+" "+x.getFullYear():x.getDate()+" "+MESES[x.getMonth()]+" – "+e.getDate()+" "+MESES[e.getMonth()]+" "+e.getFullYear();
  return {key:x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()),label:label,shortLabel:shortLabel};
}
function saveWeekData(){lsSet(K_WEEK,{week:{key:WEEK.key,label:WEEK.label,shortLabel:WEEK.shortLabel,reading:WEEK.reading,program:WEEK.program},parts:PARTS,weekend:WEEKEND});}

function wkArea(k,label,v){return '<label for="w-'+esc(k)+'">'+esc(label)+'</label><textarea id="w-'+esc(k)+'" data-wk="'+esc(k)+'" style="min-height:70px">'+esc(v==null?"":v)+'</textarea>';}
/* Lee los campos del editor en memoria (no guarda). Devuelve false si hay un dato inválido. */
function weekFromDOM(){
  var g=function(k,def){var el=document.querySelector('[data-wk="'+k+'"]');return el?el.value:def;};
  var raw=String(g("key",WEEK.key)||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)){toast("La fecha debe tener formato AAAA-MM-DD");return false;}
  var wl=weekLabels(raw);
  if(!wl){toast("Fecha no válida");return false;}
  WEEK.key=wl.key;WEEK.label=wl.label;WEEK.shortLabel=wl.shortLabel;
  WEEK.reading=g("reading",WEEK.reading);WEEK.program=g("program",WEEK.program);
  PARTS.forEach(function(p,i){
    p.section=g("p"+i+".section",p.section);
    var n=String(g("p"+i+".num","")).trim();if(n)p.num=n;else delete p.num;
    p.title=g("p"+i+".title",p.title);
    p.min=Math.max(1,parseInt(g("p"+i+".min",p.min),10)||1);
    var r=String(g("p"+i+".raw","")||"");if(r.trim())p.raw=r;else delete p.raw;
  });
  WEEKEND.discursoPublico.title=g("wk.dp.title",WEEKEND.discursoPublico.title);
  WEEKEND.discursoPublico.speaker=g("wk.dp.speaker",WEEKEND.discursoPublico.speaker);
  WEEKEND.atalaya.title=g("wk.at.title",WEEKEND.atalaya.title);
  WEEKEND.atalaya.openingSong=g("wk.at.open",WEEKEND.atalaya.openingSong);
  WEEKEND.atalaya.baseText=g("wk.at.base",WEEKEND.atalaya.baseText);
  WEEKEND.atalaya.closingSong=g("wk.at.close",WEEKEND.atalaya.closingSong);
  return true;
}

/* ============ EXPORTAR Y COPIAR ============ */
function collectPartText(p){
  var out=[];out.push(p.section.toUpperCase());out.push((p.num?p.num+". ":"")+p.title);out.push("Duración: "+p.min+" min");out.push("");
  var pre=p.id+".",found=false;
  for(var k in S.v){if(k.indexOf(pre)===0&&S.v[k]){found=true;out.push("-- "+k.substring(pre.length)+" --");out.push(S.v[k]);out.push("");}}
  if(!found)out.push("(Sin contenido preparado todavía)");
  return out.join("\n");
}
function copyToClipboard(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);toast("Texto copiado ✓");
}
function openPrint(title,text){
  var old=document.getElementById("printOverlay");if(old&&old.parentNode)old.parentNode.removeChild(old);
  var ov=document.createElement("div");ov.id="printOverlay";
  ov.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF;color:#1B2A3A;z-index:100;padding:20px;overflow:auto;";
  var bar=document.createElement("div");bar.className="print-toolbar";
  bar.style.cssText="position:sticky;top:0;background:#FFF;padding:10px;border-bottom:1px solid #D5DDE4;text-align:right;margin-bottom:20px;";
  var bP=document.createElement("button");bP.textContent="Guardar como PDF";
  bP.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;background:#0F6E6E;color:#FFF;cursor:pointer;margin-right:8px;";
  bP.onclick=function(){window.print();};
  var bC=document.createElement("button");bC.textContent="Cerrar";
  bC.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid #D5DDE4;background:#FFF;color:#1B2A3A;cursor:pointer;";
  bC.onclick=function(){if(ov.parentNode)ov.parentNode.removeChild(ov);};
  bar.appendChild(bP);bar.appendChild(bC);
  var h1=document.createElement("h1");h1.style.cssText="font-family:Georgia,serif;font-size:22px;margin:0 0 16px;color:#1B2A3A;";h1.textContent=title;
  var pre=document.createElement("pre");pre.style.cssText="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;line-height:1.6;margin:0;color:#1B2A3A;";pre.textContent=text;
  var foot=document.createElement("div");foot.style.cssText="font-size:12px;color:#5B6B7B;margin-top:30px;";foot.textContent="Reunión Vida y Ministerio Cristianos · "+WEEK.shortLabel+" · Fuentes: wol.jw.org";
  ov.appendChild(bar);ov.appendChild(h1);ov.appendChild(pre);ov.appendChild(foot);document.body.appendChild(ov);
}

  else if(S.view==="part")h=viewPart();
  else if(S.view==="saved")h=viewSaved();
  else if(S.view==="discursos")h=viewDiscursos();
  else if(S.view==="semana")h=viewSemana();
  document.getElementById("app").innerHTML=h;
  timerTick();
}
function go(v,id){S.view=v;S.id=id||null;render();window.scrollTo(0,0);}

function saveAtalaya(){S.v=collectDefaults();persistNow();toast("Atalaya guardada ✓");}
function atalayaAddParrafo(){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo añadido");}
function atalayaDelParrafo(){if(ATALAYA.parrafos.length<=1){toast("Debe quedar al menos 1");return;}ATALAYA.parrafos.pop();S.v["atalaya.total"]=ATALAYA.parrafos.length;persistNow();render();toast("Párrafo quitado");}

var actions={
  go:function(b){go(b.dataset.id);},
  prep:function(b){go("part",b.dataset.id);},
  demo:function(){S.demo=true;render();},
  save:function(){saveMeeting();},
  duplicate:function(){duplicateMeeting();},
  tab:function(b){S.tabWeek=b.dataset.id;render();window.scrollTo(0,0);},
  "open-saved":function(b){var m=savedList().filter(function(x){return x.weekKey===b.dataset.id;})[0];if(m){S.v=JSON.parse(JSON.stringify(m.v));persistNow();S.demo=true;}go("home");toast("Reunión abierta");},
  "del-saved":function(b){lsSet(K_SAVED,savedList().filter(function(x){return x.weekKey!==b.dataset.id;}));toast("Eliminada");render();},
  "del-disc":function(b){lsSet(K_DISC,discursosList().filter(function(x){return x.id!==b.dataset.id;}));toast("Eliminado");render();},
  "week-save":function(){if(weekFromDOM()){saveWeekData();toast("Semana guardada ✓");render();}},
  "week-add":function(){if(!weekFromDOM())return;PARTS.push({id:"n"+Date.now(),section:"SECCIÓN NUEVA",title:"Nueva parte",min:5});saveWeekData();render();window.scrollTo(0,0);},
  "week-up":function(b){if(!weekFromDOM())return;var i=+b.dataset.id;if(i>0){var t=PARTS[i];PARTS[i]=PARTS[i-1];PARTS[i-1]=t;saveWeekData();render();}},
  "week-down":function(b){if(!weekFromDOM())return;var i=+b.dataset.id;if(i<PARTS.length-1){var t=PARTS[i];PARTS[i]=PARTS[i+1];PARTS[i+1]=t;saveWeekData();render();}},
  "week-del":function(b){if(!weekFromDOM())return;PARTS.splice(+b.dataset.id,1);saveWeekData();render();},
  "week-reset":function(){Object.assign(WEEK,JSON.parse(JSON.stringify(WEEK_DEFAULT)));PARTS=JSON.parse(JSON.stringify(PARTS_DEFAULT));WEEKEND=JSON.parse(JSON.stringify(WEEKEND_DEFAULT));lsSet(K_WEEK,null);toast("Semana original restaurada");render();},
  "export-backup":function(){exportBackup();},
  "import-backup":function(){importBackup();},
  "save-disc":function(){saveDiscursoActual();},
  "save-atalaya":function(){saveAtalaya();},
  "atalaya-add":function(){atalayaAddParrafo();},
  "atalaya-del":function(){atalayaDelParrafo();},
  "show-full":function(){var box=document.getElementById("full-disc");if(!box)return;box.innerHTML='<div class="src" style="white-space:pre-wrap;font-family:Georgia,serif;font-size:15px;margin-top:12px">'+esc(buildDiscursoTexto())+'</div>';box.scrollIntoView({behavior:"smooth",block:"start"});},
  "gen-perlas":function(){var t=buildPerlasRespuesta();S.v["p2.respuesta"]=t;var f=document.querySelector('[data-k="p2.respuesta"]');if(f)f.value=t;persist();toast("Respuesta generada");},
  "timer-open-t1":function(){timerOpen("Discurso: "+val("p1.d.titulo",DISCURSO_T1.title),parseInt(val("p1.d.duracion",DISCURSO_T1.duration),10)||10);},
  "timer-open-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(p)timerOpen(p.num?(p.num+". "+p.title):p.title,p.min);},
  "timer-open-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)timerOpen(d.title,d.duration);},
  "timer-open-atalaya":function(){timerOpen("Estudio de La Atalaya",60);},
  "t-start":function(){timerStart();},
  "t-pause":function(){timerPause();},
  "t-resume":function(){timerStart();},
  "t-reset":function(){timerReset();},
  "t-close":function(){timerClose();},
  "copy-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;var txt=(p.id==="p1")?buildDiscursoTexto():collectPartText(p);copyToClipboard(txt);},
  "pdf-part":function(b){var p=PARTS.filter(function(x){return x.id===b.dataset.id;})[0];if(!p)return;var txt=(p.id==="p1")?buildDiscursoTexto():collectPartText(p);openPrint(p.title,txt);},
  "copy-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)copyToClipboard(d.text);},
  "pdf-disc":function(b){var d=discursosList().filter(function(x){return x.id===b.dataset.id;})[0];if(d)openPrint(d.title,d.text);}
};

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.confirm&&!b.dataset.armed){
    b.dataset.armed="1";b.dataset.label=b.textContent;b.textContent="¿Seguro? Toca otra vez";b.classList.add("armed");
    setTimeout(function(){if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove("armed");}},3000);
    return;
  }
  var fn=actions[b.dataset.act];if(fn)fn(b);
});

function onField(e){
  var el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  if(el.type==="checkbox"){S.v[k]=el.checked?"1":"";var n=document.getElementById("pickN");if(n)n.textContent=pickedCount();}
  else{S.v[k]=el.value;}
  persist();
}
function onFieldBlur(e){
  var el=e.target;if(el.dataset&&el.dataset.k){persistNow();}
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("blur",onFieldBlur,true);

(function seed(){var seed=discSeedFields();for(var k in seed){if(!(k in S.v))S.v[k]=seed[k];}})();
(function restoreAtalaya(){var t=parseInt(S.v["atalaya.total"],10)||0;while(ATALAYA.parrafos.length<t){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});}})();

render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
</body>
