#timerbox .ttitle{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timerbox .tclose{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:4px;cursor:pointer}
@media print{body:has(#printOverlay) > *:not(#printOverlay){display:none !important}#printOverlay{position:static !important;padding:0 !important}.print-toolbar{display:none !important}}

  duration:10,
  fuentes:["guia","itPres10","w0806","j50"],
  intro:"Hermanos, hay algo que a todos nos cuesta mucho: perdonar de verdad. Cuando alguien nos ha hecho daño, decimos «yo perdono, pero no olvido». Y a veces hasta nos parece que olvidar sería una injusticia, como si el perdón absolviera al culpable. Pues bien, esta semana la lectura es Jeremías 49 y 50, y el capítulo 50 es el más largo de todo el libro. Habla del juicio de Jehová contra Babilonia, la potencia que destruyó Jerusalén. Y en medio de ese juicio tan severo, aparece una de las promesas más hermosas de la Biblia: Jehová dice que buscará la culpa de su pueblo «pero no habrá ninguna». Es decir, Dios olvida de verdad. Y hoy vamos a ver tres cosas: primera, que Babilonia pecó contra Jehová y él es justo al juzgarla; segunda, que Jehová perdona por completo a quien se arrepiente; y tercera, que nosotros ayudamos a otros a beneficiarse de esa misericordia cuando les predicamos y los ayudamos a salir de la religión falsa.",

        intro:"Situémonos. Estamos en el siglo séptimo antes de nuestra era. Babilonia es la potencia dominante del mundo. Ha destruido Jerusalén, ha quemado el templo y ha llevado al pueblo de Dios al destierro. Y se siente intocable. Fíjense en lo que Jehová le dice por medio de Jeremías. Note la razón que da, porque es la clave de todo el juicio.",

      apoyo:"La obra Perspicacia, en el artículo «Presunción» párrafo 10, explica que la antigua Babilonia era un prototipo de presunción contra Dios, y por eso la enemistad eterna de Dios estaba contra ella. El profeta Jeremías le dijo a esa ciudad: «¡Mira! Yo estoy contra ti, oh Presunción —es la expresión del Señor Soberano—. La Presunción ciertamente tropezará y caerá». Y aquí viene lo importante para nosotros: la Babilonia simbólica, Babilonia la Grande, ha resultado ser el enemigo más enconado y presuntuoso de Dios. Ella emborracha a sus habitantes «con el vino de su fornicación» y es responsable de «la sangre de profetas y de santos y de todos los que han sido degollados en la tierra». Por eso sufrirá destrucción eterna, en armonía con la promesa de Jehová: «Realmente haré cesar el orgullo de los presuntuosos, y la altivez de los tiranos abatiré».",

        ref:"Jer 50:20",
        intro:"Ahora llegamos a la parte que nos llena de esperanza. Después de tanto juicio, Jehová se detiene a hablar de su propio pueblo. Y fíjense en la escena: alguien está buscando. ¿A quién busca? Y ¿qué encuentra?",
        lectura:"«En esos días y en ese tiempo —afirma Jehová— se buscará la culpa de Israel, pero no habrá ninguna, y los pecados de Judá no se encontrarán, pues yo perdonaré a quienes deje con vida».",

        explicacion:"Hay dos mandatos aquí. El primero: «declaren» y «¡no oculten nada!». El segundo: «huyan». Y el segundo depende del primero: nadie puede huir de un peligro que no sabe que existe. Por eso el pueblo de Dios tenía que avisar. Y no era un aviso frío, de simple información: era una advertencia de vida o muerte, con la urgencia del que corre delante del rebaño para guiarlo. Siglos después, los judíos que estaban en Babilonia hicieron caso. Miles volvieron a Jerusalén cuando Ciro dio el decreto, y así cumplieron el mandato de huir."
      },
      apoyo:"La Atalaya del 15 de junio de 2008, páginas 8 y 9, párrafos 8 a 11, aplica esto a nuestro tiempo. El mensaje de Jeremías a los judíos cautivos era importantísimo: no debían dejarse contaminar por la religión falsa de Babilonia, pues así estarían listos para restaurar la adoración pura cuando llegara el momento fijado por Dios. Hoy pasa algo semejante. Miles de millones de personas pertenecen a religiones cuyas prácticas se originaron en la antigua Babilonia; en conjunto se les llama «Babilonia la Grande». A lo largo de la historia, la religión falsa ha apoyado a los líderes políticos y es responsable de guerras, de abuso de menores y de otros actos de inmoralidad que las autoridades eclesiásticas han tolerado. Por eso, los cristianos verdaderos sabemos qué le espera a Babilonia la Grande y tenemos la obligación de avisar a sus miembros. Una manera de hacerlo es distribuyendo biblias y publicaciones bíblicas editadas por «el esclavo fiel y discreto». Si alguien se interesa, lo invitamos a estudiar con nosotros, esperando que vea la necesidad de «[huir] de en medio de Babilonia» antes de que sea demasiado tarde.",
      leccion:"Cuando predicamos, no solo llevamos información: llevamos una advertencia que salva vidas. Como dijo Jehová, «¡no oculten nada!»."
    }
  ],
  aplicacion:"Hermanos, tres preguntas para esta semana. Primera: ¿hay algo en mi manera de ser que se parezca a la presunción de Babilonia, algo de lo que me sienta orgulloso y que me ponga por encima de los demás o de Jehová? Segunda: ¿me creo de verdad que Jehová borró mi culpa cuando me arrepentí, o sigo cargando lo que él ya no recuerda? Tercera: ¿estoy avisando a otros con la urgencia que merece el mensaje? La misericordia de Jehová es enorme, pero hay que beneficiarse de ella antes de que sea tarde. Y nosotros somos los que llevamos el aviso.",
  conclusion:"Jehová es un Dios justo: vio lo que Babilonia hizo y la juzgó. Pero también es un Dios misericordioso: busca la culpa de su pueblo y no encuentra ninguna. Esa es la mejor noticia que podemos llevar. Así que, hermanos, no nos quedemos callados. Declaremos, no ocultemos nada, y ayudemos a otros a huir de Babilonia la Grande. Que nosotros también «andemos al frente del rebaño», guiando a otros hacia el refugio que es Jehová. Porque el que perdona es él, y perdona por completo."
};

var PERLA1={
  q:"Jer 50:24. ¿Qué hizo Jehová para que Babilonia cayera en «una trampa»?",
  verses:[{t:"Jer 50:24",u:bible(24,50)}],
  pubs:[{t:"Perspicacia «Trampa» párr. 3",u:pc("/3/0")}],
  fuentes:["itTrampa","j50"],
  found:[
    "Perspicacia, «Trampa», párrafo 3: Otra característica de las trampas a las que se alude en términos figurados es la rapidez con la que pueden funcionar, atrapando a la víctima de improviso.",
    "Perspicacia añade: la caída de Babilonia ante los medos y los persas llegó tan súbita e inesperadamente que fue como si Jehová hubiese hecho saltar un lazo o trampa sobre ellos (Jeremías 50:24; compárese con Lucas 21:34, 35).",
    "Jeremías 50:24: «Te tendí una trampa y tú, oh, Babilonia, caíste en ella sin darte cuenta. Fuiste encontrada y capturada, porque fue a Jehová a quien te opusiste».",
    "El contexto histórico: en la noche del año 539 antes de nuestra era, los medos y los persas entraron en Babilonia por el lecho del río Éufrates, cuyas aguas habían sido desviadas, mientras la ciudad celebraba un banquete."
  ],
  draft:"La trampa fue la manera tan repentina en que Jehová ejecutó el juicio. Babilonia se creía segura detrás de sus murallas enormes y de su poderoso ejército, pero cayó «sin darse cuenta»: en una sola noche. Perspicacia explica que la caída llegó tan súbita e inesperada que fue como si Jehová hubiera hecho saltar un lazo sobre ellos. Y el versículo 24 da la razón: «porque fue a Jehová a quien te opusiste». No fue una derrota militar cualquiera; fue el resultado de haberse puesto contra Jehová."
};
var PERLA2_Q="¿Qué perlas espirituales ha encontrado en la lectura bíblica de esta semana?";

var PUNTOS=[
 {v:"Jer 50:5",vu:bible(24,50),idea:"El pueblo invita a otros a unirse a Jehová en «un pacto eterno que no será olvidado».",fuentes:["j50"],ref:"Biblia de estudio, Jer 50:5.",aprendemos:"Servir a Jehová es una decisión de toda la vida, no un arreglo temporal.",aplicar:"Qué distinto suena esto de las decisiones que se toman a la ligera. El pueblo que vuelve a Jehová no llega con medias tintas: llega con un «pacto eterno que no será olvidado». Hoy nosotros hacemos esa misma clase de compromiso cuando nos dedicamos a Jehová, y lo renovamos cada día con nuestra fidelidad. Si alguna vez nos hemos alejado, el camino de vuelta sigue abierto: se trata de volver con el mismo corazón entero."},
 {v:"Jer 50:8",vu:bible(24,50),idea:"Jehová manda huir de Babilonia y ser «como los animales que van al frente del rebaño».",fuentes:["j50"],ref:"Biblia de estudio, Jer 50:8.",aprendemos:"Hay que salir del peligro, y salir a tiempo.",aplicar:"La imagen es preciosa: los animales que van al frente guían al rebaño. No basta con salvarse uno mismo; hay que ir delante, para que otros puedan seguir el camino. Eso es exactamente lo que hacemos cuando predicamos: vamos al frente. Y también nos advierte algo serio: quien se queda en Babilonia la Grande por comodidad o por miedo se queda en una ciudad condenada. La salida es urgente, pero es una salida con esperanza."},
 {v:"Jer 50:20",vu:bible(24,50),idea:"Jehová buscará la culpa de Israel y no habrá ninguna; los pecados de Judá no se encontrarán.",fuentes:["j50"],ref:"Biblia de estudio, Jer 50:20.",aprendemos:"El perdón de Jehová es total, no parcial.",aplicar:"A muchos hermanos les cuesta creerlo: siguen arrastrando culpa por pecados que ya confesaron hace años. Pero si Jehová, el Juez perfecto, dice que no encontrará nada, ¿quién soy yo para seguir buscándolo? Aceptemos su perdón con gratitud y, sobre todo, imitémoslo: cuando alguien nos pida perdón de corazón, no abramos de nuevo el expediente que Dios ya cerró."},
 {v:"Jer 50:24",vu:bible(24,50),idea:"Babilonia cayó en una trampa «sin darse cuenta», porque se opuso a Jehová.",fuentes:["j50","itTrampa"],ref:"Biblia de estudio, Jer 50:24; Perspicacia, «Trampa», párr. 3.",aprendemos:"Nadie está tan seguro como para escapar del juicio de Jehová.",aplicar:"Babilonia tenía murallas que parecían invencibles y un ejército poderoso, y aun así cayó en una sola noche. La seguridad que se apoya en la fuerza, el dinero o la posición social es una falsa seguridad. ¿En qué estamos confiando nosotros? Pongamos la confianza donde de verdad protege: en la obediencia a Jehová, que es el único refugio que no se derrumba."},
 {v:"Jer 50:29",vu:bible(24,50),idea:"A Babilonia había que darle exactamente lo mismo que ella hizo, porque se portó con arrogancia con Jehová.",fuentes:["j50"],ref:"Biblia de estudio, Jer 50:29.",aprendemos:"La justicia de Jehová es exacta: no se queda corta ni se pasa.",aplicar:"A veces nos impacienta ver que los malvados prosperan y que la injusticia parece no tener consecuencias. Este versículo nos recuerda que Jehová ve, registra y paga con exactitud. No tenemos que vengarnos ni tomar la justicia por nuestra mano; nos basta con saber que él lo hará bien. Mientras tanto, cuidemos de no imitar la arrogancia que él condena."},
 {v:"Jer 50:34",vu:bible(24,50),idea:"«El Recomprador es fuerte; su nombre es Jehová de los ejércitos»: él defiende el caso legal de su pueblo.",fuentes:["j50"],ref:"Biblia de estudio, Jer 50:34.",aprendemos:"Tenemos un Defensor que es más fuerte que cualquier opresor.",aplicar:"El pueblo estaba oprimido y «retenido por todos los que la llevaron cautiva»; humanamente, no tenía salida. Pero apareció un Recomprador fuerte. Nosotros tenemos uno todavía mejor: Jesucristo, por medio de quien Jehová defiende nuestro caso. Esto levanta el ánimo de cualquier hermano que se sienta aplastado por la injusticia, la enfermedad o la oposición. No estamos solos en el proceso: nuestro Abogado es el más fuerte."},
 {v:"Jer 50:39",vu:bible(24,50),idea:"De Babilonia se dice que «nunca más será poblada» y que estará deshabitada por todas las generaciones.",fuentes:["j50"],ref:"Biblia de estudio, Jer 50:39.",aprendemos:"Lo que Jehová anuncia se cumple con exactitud, aunque tarde siglos.",aplicar:"Los viajeros de siglos posteriores describieron las ruinas de Babilonia, y hoy sigue siendo un montón de ruinas: la profecía se cumplió al pie de la letra. Esa precisión debería darnos una confianza enorme. Si Jehová cumplió lo que anunció sobre una ciudad, cumplirá también lo que ha prometido sobre este mundo y sobre su pueblo. Podemos edificar nuestra vida sobre esas promesas sin miedo a equivocarnos."}
];

var MAESTROS={
  p4:{marco:"De casa en casa. El publicador saluda a una señora en la puerta, conversa un momento con ella y le enseña una de las verdades bíblicas del apéndice A del folleto Una obra de amor. Duración: 3 minutos.",leccion:"lmd lección 1 punto 5 — Interés sincero: enséñele una verdad bíblica. No se limite a dejar publicaciones. Ofrezca una sola verdad de la Palabra de Dios, clara y corta, y léala directamente de la Biblia. Empiece con una pregunta natural como «¿Sabía que...?» o «¿Ha escuchado alguna vez que...?».",objetivo:"Enseñar una verdad bíblica sencilla del apéndice A en la predicación de casa en casa.",tema:"Una sola verdad bíblica, bien enseñada, planta una semilla que Jehová puede hacer crecer.",texto:"Apocalipsis 21:4 — Dios secará toda lágrima y la muerte ya no existirá.",dialogo:"PUBLICADOR: Buenas tardes, señora. Disculpe la molestia. Estoy hablando con los vecinos sobre algo que muchos me dicen que les quita el sueño: la inseguridad y la violencia.\n\nSEÑORA: Ay, sí. Así como está el mundo, uno ya no sabe qué hacer.\n\nPUBLICADOR: Tiene razón. ¿Sabía usted que la Biblia promete que pronto todo esto va a cambiar?\n\nSEÑORA: ¿En serio?\n\nPUBLICADOR: Sí. Mire lo que dice aquí, en Apocalipsis 21:4. (Lee el texto.) ¿No le gustaría vivir en un mundo así?\n\nSEÑORA: Claro que sí. Eso sería otra cosa.\n\nPUBLICADOR: ¿Me permite mostrarle la próxima semana un texto más sobre cómo va a lograr Dios eso? Solo me tomaría cinco minutos.\n\nSEÑORA: Bueno, sí, pase.\n\nPUBLICADOR: Muchas gracias. Hasta la próxima.",demostrar:["Saludar con interés sincero y escuchar lo que la persona siente","Escoger UNA verdad bíblica del apéndice A, no varias","Usar una pregunta natural: «¿Sabía que...?»","Leer el texto directamente de la Biblia, con claridad","Ofrecer una próxima conversación concreta"],conclusion:"Agradecer y dejar claro cuándo se volverá para seguir enseñando."},
  p5:{marco:"De casa en casa. Revisita a una persona que la vez anterior mostró interés, pero hoy quiere hablar de un tema distinto del que estaba previsto. Duración: 4 minutos.",leccion:"lmd lección 9 punto 3 — Empatía: escuche y véngase al tema de la persona. No se aferre a su plan. Si la persona quiere hablar de otro asunto, muéstrese flexible y empatice con lo que le preocupa; luego busque un punto de unión con la verdad bíblica.",objetivo:"Hacer una revisita eficaz cuando la persona quiere hablar de un tema distinto del previsto.",tema:"La empatía nos permite ser flexibles y dejar que el interés de la persona guíe la conversación.",texto:"Proverbios 20:5 — los pensamientos del hombre son aguas profundas, pero el que discierne las saca a la luz.",dialogo:"PUBLICADOR: Buenas tardes, doña Marta. ¿Cómo ha estado?\n\nMARTA: Regular, mijo. Es que ando muy preocupada por mi hijo, que se fue para otra ciudad y no llama.\n\nPUBLICADOR: Cuánto lo siento. Debe ser muy duro esperar una llamada así. (Pausa.) ¿Hace mucho que no sabe de él?\n\nMARTA: Ya casi dos meses.\n\nPUBLICADOR: La entiendo perfectamente. Mire, aunque hoy quería hablarle de otra cosa, déjeme decirle algo que a mí me ayuda cuando estoy angustiado. La Biblia dice en Proverbios 20:5 que los pensamientos del hombre son aguas profundas, pero el que discierne las saca a la luz. A mí me consuela saber que Jehová conoce lo que sentimos, aunque no lo digamos.\n\nMARTA: Eso sí es cierto.\n\nPUBLICADOR: Y mire este otro texto: Jehová promete estar cerca de los que están quebrantados de corazón. ¿Le parece si le dejo la publicación abierta en esa parte y en la próxima visita comentamos los dos juntos lo que dice?\n\nMARTA: Sí, mijo, gracias.",demostrar:["Preguntar por la persona y escuchar sin interrumpir","Dejar el plan previsto sin que se note la molestia","Empatizar con la preocupación real de la persona","Buscar un punto de unión entre su tema y la Biblia","Dejar algo concreto para la próxima visita"],conclusion:"Agradecer su confianza y confirmar el compromiso de la próxima visita con el tema que a ella le importa."},
  p6:{marco:"Estudio con un estudiante que va por la lección 20 de ¡Disfrute de la vida para siempre!, punto 4: «Jesús es un líder que ofrece alivio». Duración: 5 minutos.",leccion:"lmd lección 11 punto 4 — Sencillez: use palabras y frases fáciles de entender. No complique la explicación; lleve al estudiante paso a paso por los textos y ayúdelo a razonar con preguntas sencillas.",objetivo:"Ayudar al estudiante a ver a Jesús como un líder que ofrece alivio, y a los ancianos como ejemplo de ese mismo alivio.",tema:"Jesús ofrece alivio, y los ancianos imitan su ejemplo.",texto:"Mateo 11:28-30 — «Vengan a mí... y yo los aliviaré». Isaías 32:2. 1 Pedro 5:1-3.",dialogo:"PUBLICADOR: Vamos a leer Mateo 11:28 al 30. Léelo en voz alta, por favor.\n\nESTUDIANTE: «Vengan a mí, todos ustedes, que trabajan duro y están sobrecargados, y yo los aliviaré. Pónganse bajo mi yugo y aprendan de mí, porque soy apacible y humilde de corazón. Conmigo encontrarán alivio. Porque mi yugo es fácil de llevar y mi carga pesa poco».\n\nPUBLICADOR: Muy bien. Según este texto, ¿qué clase de líder es Jesús?\n\nESTUDIANTE: Uno que no es duro, sino apacible y humilde.\n\nPUBLICADOR: Exacto. Y ¿cómo quiere que nos sintamos?\n\nESTUDIANTE: Aliviados. No cargados.\n\nPUBLICADOR: Muy bien. Ahora fíjate en algo: la Biblia dice que los ancianos deben parecerse a Jesús. Leamos 1 Pedro 5:2 y 3. (Lee.) ¿Ves la frase «no actuando como si fueran los amos»? ¿Cómo crees que un anciano demuestra que imita a Jesús?\n\nESTUDIANTE: Siendo amable, escuchando y no mandando.\n\nPUBLICADOR: Perfecto. Y a ti, ¿te hace sentir más tranquilo saber que los ancianos se esfuerzan por ser así?\n\nESTUDIANTE: Sí, bastante.\n\nPUBLICADOR: Me alegra. La próxima vez veremos qué dice Isaías 32:2 sobre ellos.",demostrar:["Animar al estudiante a leer el texto en voz alta","Hacer preguntas sencillas y esperar la respuesta","Explicar con palabras fáciles, sin tecnicismos","Conectar el texto con la vida real del estudiante","Cerrar con un punto claro y una próxima meta"],conclusion:"Repasar en una frase lo aprendido y animar al estudiante a leer Isaías 32:2 antes de la próxima visita."}
};

var VIDA_P8={
  activa:true,
  introGuion:"Análisis con el auditorio (15 minutos). El tema de esta parte es «Nunca olviden lo que Jehová recuerda». Vamos a ver un video y después comentaremos las preguntas con el auditorio. La idea central es muy consoladora: Jehová no es injusto y no se olvida de lo que hacemos por él. Quizás nosotros olvidamos fácilmente el bien que otros hacen, e incluso el bien que nosotros mismos hacemos; pero Jehová no. Y al revés también es cierto: cuando nos arrepentimos de corazón, él no recuerda más nuestros pecados. Vamos a ver el video y luego lo comentamos.",
  video:{t:"Video de la parte 7 (ver el enlace de la guía de actividades de esta semana)",u:pc("/9/0")},
  preguntas:[
    {q:"¿Qué lecciones sacamos de este video?",respuesta:"El video nos ayuda a ver que Jehová recuerda el bien que hacemos, aunque nosotros lo hayamos olvidado. A veces pensamos que nuestro servicio pasa desapercibido: una visita, un plato de comida, una llamada, años de fidelidad. Pero Jehová lo ve todo y lo recuerda. La lección es doble: seguir haciendo el bien sin desanimarnos, y confiar en que nada de lo que hacemos por amor a él se pierde."},
    {q:"¿Qué dice Hebreos 6:10 sobre la manera en que Jehová ve nuestro servicio?",respuesta:"Dice que «Dios no es injusto y no se olvida de las obras de ustedes ni del amor que demostraron por su nombre al haber servido a los santos y al continuar sirviéndoles». Fíjese: no es solo que Jehová recuerde; es que sería injusto si olvidara. Nuestro servicio no es un favor que le hacemos a Dios, sino algo que él valora como parte de su propia justicia."},
    {q:"¿Y qué hace Jehová con nuestros pecados cuando nos arrepentimos?",respuesta:"Los borra. Isaías 43:25 dice: «Soy yo el que borra tus transgresiones por causa de mí mismo, y no me acordaré más de tus pecados». Y Miqueas 7:19 dice que los arroja «a las profundidades del mar». Es decir, Jehová recuerda el bien y olvida el mal del que se arrepiente. Ese es el trato que quiere que imitemos: no llevar cuenta de las ofensas, como dice 1 Corintios 13:5."},
    {q:"¿Cómo nos ayuda esto cuando sentimos que nuestro servicio no sirve de nada?",respuesta:"Nos ayuda a seguir adelante. Cuando el cansancio nos haga pensar que nadie lo nota, recordemos que Jehová sí. Y cuando la culpa por errores pasados nos paralice, recordemos que él ya los perdonó. En los dos casos la respuesta es la misma: seguir sirviéndole con confianza, porque él es justo y no olvida."}
  ],
  aplicacion:"Esta semana, hagamos dos cosas concretas. Primera: pensemos en un hermano que ha servido fielmente durante años y que quizás nadie ha animado últimamente; agradezcámosle su esfuerzo. Y segunda: si arrastramos culpa por un pecado que ya confesamos, dejémoslo donde Jehová lo puso: en el fondo del mar. No volvamos a cargar lo que Dios ya no recuerda.",
  cierre:"Jehová recuerda lo que hacemos por amor a él, y no recuerda lo que hemos confesado. Vivamos con esa doble confianza: la de que nuestro trabajo no es en vano y la de que su perdón es completo."
};

var ESTUDIO_P9={
  fuente:{t:"Seamos valientes al andar con Dios — cap. 15",u:pc("/10/0")},
  libro:"wcg cap. 15 — «Noemí y Rut: Permanecieron juntas en los momentos difíciles»",
  textosDestacados:[
    {ref:"Rut 1:16, 17",texto:"«Pero Rut le dijo: “No insistas en que te deje, en que me separe de ti; porque adonde tú vayas yo iré, y donde tú pases la noche yo pasaré la noche. Tu pueblo será mi pueblo, y tu Dios será mi Dios. Donde tú mueras yo moriré, y allí seré enterrada. Que Jehová me castigue severamente si me separo de ti por otra razón que no sea la muerte”»."},
    {ref:"Rut 4:10",texto:"«Y también tomo por esposa a Rut la moabita, la viuda de Mahlón, para que el nombre del difunto permanezca sobre su herencia, para que sus hermanos y la gente de la ciudad no olviden su nombre. Ustedes son testigos hoy»."},
    {ref:"Rut 4:14, 15",texto:"«Y las mujeres le dijeron a Noemí: “Alabado sea Jehová, que no te ha dejado sin recomprador. ¡Que su nombre sea proclamado en Israel! Este niño te ha devuelto la vida y te cuidará en tu vejez, porque es el hijo de tu nuera, que te quiere y que es mejor para ti que siete hijos”»."}
  ],
  preguntas:[
    {q:"¿Por qué podemos decir que la rebusca que se hacía en Israel era algo único en el antiguo Oriente Medio?",a:"Porque la Ley de Jehová incluía una medida bondadosa para ayudar a los pobres: durante la cosecha, cualquiera podía entrar en los campos y recoger lo que los segadores dejaban atrás, e incluso lo que crecía en las orillas y esquinas de los terrenos. Aquello era muy solidario y distinto a todo lo que Rut había conocido en Moab. En el Oriente Próximo de la antigüedad no se trataba bien a las viudas: tras la muerte del esposo, dependían de sus hijos, y si no los tenían solo les quedaba venderse como esclavas, vivir de la prostitución o morir. La ley de la rebusca mostraba el interés de Jehová por los desfavorecidos."},
    {q:"¿Cómo sabemos que Rut no se acercó a Boaz con motivos impropios?",a:"Por dos razones. Primera, Rut estaba siguiendo las costumbres de la época, muchas de las cuales no se entienden por completo hoy día; sería un error juzgar sus actos según las normas morales de estos tiempos. Segunda, la reacción de Boaz indica cómo debe verse aquel gesto: a sus ojos, la conducta de Rut era moralmente casta y digna de elogio. Él le dijo: «Bendita seas de Jehová, hija mía. Has expresado tu bondad amorosa mejor en el último caso que en el primer caso, al no ir tras los jóvenes, fueran de condición humilde o ricos». Boaz reconoció que Rut podía haberse buscado un esposo joven, rico o pobre, pero eligió hacer el bien a Noemí y al difunto esposo de esta."},
    {q:"¿Por qué es significativo que Boaz le dijera a Rut «hija mía»?",a:"Porque era un término lleno de significado. La Biblia usa esa palabra tan tierna para expresar bondad y ternura. Jesús la empleó con la mujer que llevaba doce años padeciendo hemorragias: le dijo «Ten ánimo, hija» y la consoló. Rut también tenía motivos para sentirse insegura: era una extranjera moabita rebuscando espigas en el campo de un desconocido. Al llamarla «hija mía», Boaz la tranquilizó y le hizo sentir que era bienvenida. Es un ejemplo excelente para los ancianos, que deben animar y consolar con la Biblia a las hermanas que necesitan ayuda."},
    {q:"A diferencia de Fulano, ¿cómo demostró Boaz generosidad cuando aceptó casarse con Rut?",a:"Fulano, el pariente con más derecho a la recompra, primero estuvo dispuesto a comprar el terreno, porque parecía una buena inversión. Pero cuando supo que también tenía que casarse con Rut y que el hijo de ella heredaría las tierras de Elimélec, se echó atrás: «No puedo recomprarlo, porque arruinaría mi propia herencia». Le importaba más conservar su nombre y sus bienes que ayudar a una viuda. Boaz, en cambio, hizo todo lo contrario: se casó con Rut y lo hizo «para que el nombre del difunto permanezca sobre su herencia». Renunció a su propia conveniencia para proteger el nombre de otro. Y Jehová lo recompensó: Boaz y Rut llegaron a ser antepasados del rey David y del Mesías."},
    {q:"Cuando Noemí se sintió destrozada, Rut estuvo allí para ayudarla. Por su parte, Noemí fue humilde y aceptó la ayuda. ¿Qué aprendemos de cada una?",a:"De Rut aprendemos el amor leal que no abandona: podía haberse quedado en Moab y rehacer su vida, pero se quedó con su suegra y hasta dejó su pueblo y sus dioses. De Noemí aprendemos la humildad de aceptar ayuda cuando uno está quebrado. A veces el dolor nos hace cerrarnos y rechazar el consuelo, o nos hace decir cosas duras, como cuando Noemí dijo que Jehová la había hecho volver con las manos vacías. Pero la Biblia no dice que Rut se enojara; al contrario, se puso a trabajar por las dos. Las dos nos enseñan a sostenernos unos a otros en los momentos difíciles."},
    {q:"¿Cómo recompensó Jehová a Noemí y a Rut por su valor, y qué nos enseña eso?",a:"Jehová las recompensó generosamente. Rut se casó con Boaz y tuvo a Obed, y Noemí lo crió como si fuera su propio hijo; las vecinas dijeron que aquel niño le había devuelto la vida. Y mucho más importante: Obed llegó a ser antepasado del rey David y, siglos después, del Mesías, Jesucristo. De una mujer extranjera y viuda salió la línea del propio Hijo de Dios. Eso nos enseña que Jehová no olvida el amor leal. Aunque hoy pasemos por pérdidas y dificultades, él puede convertir nuestro dolor en algo con sentido eterno."}
  ]
};

  textoCompleto:"24 Te tendí una trampa y tú, oh, Babilonia, caíste en ella sin darte cuenta. Fuiste encontrada y capturada, porque fue a Jehová a quien te opusiste. 25 Jehová ha abierto su almacén y saca las armas de su indignación. Porque el Señor Soberano, Jehová de los ejércitos, tiene un trabajo que hacer en la tierra de los caldeos. 26 Atáquenla desde lugares lejanos. Abran los graneros de ella. Hagan con ella montones como si hicieran montones de grano. Destrúyanla por completo. Que no quede nadie de ella. 27 Masacren a todos sus toros jóvenes. Que bajen al matadero. ¡Ay de ellos, porque ha llegado su día, el tiempo de su ajuste de cuentas! 28 Se oye a los que huyen, a los que escapan de la tierra de Babilonia para anunciar en Sion la venganza de Jehová nuestro Dios, la venganza por su templo. 29 Convoquen contra Babilonia a los arqueros, a todos los que tensan el arco. Acampen alrededor de ella; no dejen escapar a nadie. Denle lo que se merece por lo que ha hecho. Háganle lo mismo que ella hizo. Porque se ha portado de forma arrogante con Jehová, con el Santo de Israel. 30 Por eso sus jóvenes caerán en sus plazas, y ese día morirán todos sus soldados —afirma Jehová—. 31 Oh, rebelde, ¡mira!, yo estoy contra ti —afirma el Señor Soberano, Jehová de los ejércitos—, porque tiene que venir tu día, el tiempo en que ajuste cuentas contigo. 32 Oh, rebelde, tropezarás y caerás, y nadie te levantará. Les prenderé fuego a tus ciudades, y devorará todo lo que te rodea». 33 Esto es lo que dice Jehová de los ejércitos: «La gente de Israel y de Judá está oprimida, retenida por todos los que la llevaron cautiva. Se han negado a dejarlos ir. 34 Pero el Recomprador es fuerte; su nombre es Jehová de los ejércitos. Él sin falta defenderá el caso legal de ellos, para darle paz al país y causarles agitación a los habitantes de Babilonia». 35 «Vendrá una espada contra los caldeos —afirma Jehová—, contra los habitantes de Babilonia, contra sus príncipes y contra sus sabios. 36 Vendrá una espada contra los que dicen cosas vacías, y se portarán como tontos. Vendrá una espada contra los guerreros de ella, y quedarán aterrados. 37 Vendrá una espada contra sus caballos y sus carros de guerra, y contra la mezcla de pueblos que hay en ella, y se volverán como mujeres. Vendrá una espada contra los tesoros de ella, y serán saqueados. 38 Vendrá una devastación sobre sus aguas, y estas se secarán. Porque es una tierra de imágenes esculpidas, y debido a sus visiones aterradoras ellos se portan como locos. 39 Por eso las criaturas del desierto vivirán allí con los animales que aúllan, y en ella vivirán avestruces. Nunca más será poblada y, por todas las generaciones, estará deshabitada». 40 «Igual que cuando Dios destruyó Sodoma y Gomorra y sus pueblos vecinos —afirma Jehová—, nadie vivirá allí, y ningún hombre se establecerá allí.",

var ATALAYA={intro:"Artículo de estudio para la semana del 2 al 8 de noviembre de 2026. Texto base: Salmo 91:9. Tema: por qué podemos confiar en que Jehová nos protege ahora y lo hará en el futuro. Canción inicial: 3. Canción final: 8.",parrafos:[
  {num:"1",texto:"Vivimos en la parte final de los últimos días, y pronto ocurrirán sucesos que cambiarán el mundo. Jehová pondrá en los corazones de los gobiernos «el pensamiento de él», es decir, que ellos le den «su autoridad como reyes a la bestia salvaje», las Naciones Unidas. Luego, la bestia, con ese enorme poder y con el apoyo total de todos los gobiernos, acabará para siempre con las organizaciones religiosas falsas del mundo. Así comenzará la gran tribulación. ¿Qué pasará entonces?",pregunta:"1, 2. ¿Qué acontecimientos impactantes sucederán dentro de poco?",respuesta:"Jehová hará que los gobiernos le den su autoridad a la bestia salvaje, las Naciones Unidas, y esa bestia acabará con las organizaciones religiosas falsas. Así comenzará la gran tribulación. Después, los gobiernos se pondrán de acuerdo para atacar al pueblo de Dios."},
  {num:"2",texto:"A continuación, los gobiernos se pondrán de acuerdo para atacar con todas sus fuerzas al pueblo de Dios. El libro La adoración pura de Jehová: ¡por fin restaurada! explica qué los llevará a hacer eso: «Satanás incitará a las naciones a borrar del mapa tanto a los verdaderos siervos de Jehová como a la adoración pura». ¿Qué vendrá después? Un acontecimiento sin igual: la guerra de Armagedón. Jesús, junto con los 144.000 y los ángeles, acabará con los malvados y salvará a los siervos de Dios. El mundo de Satanás desaparecerá, y dará comienzo el nuevo mundo.",pregunta:"1, 2. ¿Qué acontecimientos impactantes sucederán dentro de poco?",respuesta:"Los gobiernos atacarán con todas sus fuerzas al pueblo de Dios, incitados por Satanás, que quiere borrar del mapa tanto a los siervos de Jehová como la adoración pura. Entonces vendrá el Armagedón: Jesús, con los 144.000 y los ángeles, acabará con los malvados, salvará a los siervos de Dios y dará comienzo al nuevo mundo."},
  {num:"3",texto:"¿Debemos sentir miedo al pensar en la destrucción del mundo de Satanás en el Armagedón? No, pues Jehová ha prometido protegernos. En Salmo 91:7 leemos: «Mil caerán a tu lado y diez mil a tu derecha, pero a ti nada de eso se te acercará». En este artículo empezaremos analizando el Salmo 91 y luego responderemos las siguientes preguntas: ¿de qué clase de protección se habla en este salmo?, ¿cómo nos protege Jehová ahora? y ¿cómo nos protegerá en el futuro?",pregunta:"3. ¿Qué veremos en este artículo?",respuesta:"Primero analizaremos el Salmo 91 y luego responderemos tres preguntas: de qué clase de protección se habla en este salmo, cómo nos protege Jehová ahora y cómo nos protegerá en el futuro. Todo con una idea de fondo: no debemos tener miedo, porque Jehová ha prometido protegernos."},
  {num:"4",texto:"Dicho en pocas palabras, el Salmo 91 habla de tener confianza en la protección de Jehová. Los dos primeros versículos nos aseguran que Jehová protegerá a quienes confían en él. Las palabras «refugio» y «fortaleza» nos hacen pensar en una ciudad amurallada. En tiempos bíblicos, sus habitantes estaban protegidos dentro de sus muros y quienes estaban afuera podían entrar en ella para ponerse a salvo de sus enemigos. En los versículos que siguen, el salmista usa comparaciones muy llamativas para garantizarnos que Jehová puede proteger a sus siervos de cualquier peligro. ¿Acaso existe un lugar más seguro que las alas del Altísimo y la sombra del Todopoderoso?",pregunta:"4. ¿Qué nos asegura Salmo 91:1, 2?",respuesta:"Que Jehová protegerá a quienes confían en él. El salmista lo llama «refugio» y «fortaleza», palabras que nos hacen pensar en una ciudad amurallada donde uno se pone a salvo de sus enemigos. No existe un lugar más seguro que las alas del Altísimo y la sombra del Todopoderoso."},
  {num:"5",texto:"En los últimos versículos del Salmo 91, encontramos la mayor garantía de todas. Ya no es el salmista el que habla sobre la protección divina, sino que ahora el propio Jehová les hace una promesa directamente a sus siervos. En estos versículos, Jehová asegura que los protegerá porque confían en él, conocen su nombre y acuden a él. Sus promesas no son vacías. Sabemos que siempre las cumple, así que podemos confiar por completo en ellas. ¡No tenemos ni la más mínima duda!",pregunta:"5, 6. ¿Qué nos promete Salmo 91:14-16, y por qué podemos confiar en esa promesa?",respuesta:"Jehová promete: «Como él me quiere, lo rescataré. Lo protegeré porque conoce mi nombre. Él me llamará, y yo le responderé. Estaré con él en la angustia. Lo rescataré y lo glorificaré. Haré que esté satisfecho con una larga vida y que vea mis actos de salvación». Podemos confiar porque Jehová siempre cumple lo que promete; él no miente."},
  {num:"6",texto:"Como Jehová quiere que confiemos en él y nos sintamos seguros, inspiró al salmista para que escribiera el Salmo 91. Así que, igual que este escritor, cada uno de nosotros puede decirle a Jehová: «Tú eres mi refugio y mi fortaleza». Ahora bien, ¿qué clase de protección promete Dios?",pregunta:"5, 6. ¿Qué nos promete Salmo 91:14-16, y por qué podemos confiar en esa promesa?",respuesta:"Nos promete rescate, protección, respuesta a nuestra llamada, compañía en la angustia, gloria, una larga vida y que veremos sus actos de salvación. Podemos confiar porque él mismo lo dijo, y sus promesas no son vacías: siempre las cumple."},
  {num:"7",texto:"Nuestras publicaciones han explicado que en el Salmo 91 Jehová promete darnos protección espiritual. Estamos seguros de que siempre nos dará lo necesario para que podamos protegernos de cualquier cosa que ponga en peligro nuestra valiosa amistad con él. Ahora bien, este salmo no habla solo de protección espiritual, sino también de protección emocional y física. Jehová no permitirá que nuestros enemigos nos roben la paz interior ni acaben con nosotros como grupo. ¿Por qué decimos que el Salmo 91 también incluye la protección emocional y física?",pregunta:"7. ¿Qué clase de protección promete el Salmo 91?",respuesta:"Protección espiritual, pero también emocional y física. Jehová nos da lo necesario para protegernos de cualquier cosa que ponga en peligro nuestra amistad con él, no permitirá que nuestros enemigos nos roben la paz interior y no permitirá que acaben con nosotros como grupo."},
  {num:"8",texto:"La clave para entenderlo está en lo que Jesús le respondió a Satanás cuando este lo tentó. Satanás le había dicho que saltara desde la parte más alta del templo, pues los ángeles de Jehová lo protegerían. Había basado su argumento en las palabras de Salmo 91:11, 12. Si esos versículos no incluyeran la idea de protección física, Jesús seguramente le habría contestado: «Estás equivocado. Ese salmo no promete protección física». Sin embargo, Jesús le dijo: «No pongas a prueba a Jehová tu Dios». ¿Qué aprendemos?",pregunta:"8, 9. ¿Qué le respondió Jesús a Satanás cuando este lo tentó, y qué aprendemos?",respuesta:"Le respondió: «No pongas a prueba a Jehová tu Dios». Aprendemos que el Salmo 91 sí incluye protección física, pero que no debemos actuar de manera temeraria esperando que Jehová nos rescate. Jesús confiaba en la protección de su Padre, pero no quiso ponerlo a prueba."},
  {num:"9",texto:"Jesús sabía que su Padre en ocasiones se había valido de los ángeles para darles protección física a sus siervos ante los ataques de sus enemigos. Pero no quiso poner a prueba a su Padre actuando de manera temeraria y esperando que los ángeles fueran a salvarlo. Así que Satanás aplicó mal las palabras del Salmo 91, pero no porque lo utilizara para hablar de protección física, sino porque lo usó para animar a Jesús a hacer algo peligroso y así poner a prueba a Jehová. Teniendo en cuenta lo que Jesús le respondió a Satanás, podemos afirmar que el Salmo 91 promete protección total: espiritual, emocional y física.",pregunta:"8, 9. ¿Qué le respondió Jesús a Satanás cuando este lo tentó, y qué aprendemos?",respuesta:"Jesús sabía que Jehová a veces había usado ángeles para proteger físicamente a sus siervos, pero se negó a ponerlo a prueba con un acto temerario. Satanás citó mal el salmo, no porque el salmo no hablara de protección física, sino porque lo usó para tentar a Jesús. Por eso podemos afirmar que el Salmo 91 promete protección total: espiritual, emocional y física."},
  {num:"10",texto:"La promesa de Jehová que encontramos en el Salmo 91 nos llena de confianza. Estamos convencidos de que él es un refugio y una fortaleza que protege a quienes confían en él. Por eso, no debemos sentir miedo al pensar en la destrucción del mundo de Satanás. Veamos a continuación cómo nos protege Jehová hoy en día y cómo lo hará en el futuro.",pregunta:"10. ¿De qué estamos convencidos?",respuesta:"De que Jehová es un refugio y una fortaleza que protege a quienes confían en él. Por eso no debemos tener miedo al pensar en la destrucción del mundo de Satanás."},
  {num:"11",texto:"Jehová nos protege en sentido espiritual. Nos da lo que necesitamos para hacerles frente a los peligros espirituales, es decir, a todas las cosas que podrían amenazar nuestra amistad con él. Por ejemplo, como comprende muy bien nuestra lucha constante contra el pecado y el poder que este ejerce en nosotros, nos ofrece distintas ayudas para que podamos vencer. Veamos algunas de ellas.",pregunta:"11. ¿Cómo nos protege Jehová en sentido espiritual?",respuesta:"Nos da lo que necesitamos para hacer frente a los peligros espirituales, es decir, todo lo que podría amenazar nuestra amistad con él. Como comprende nuestra lucha contra el pecado, nos ofrece varias ayudas para vencer: su Palabra, su espíritu santo y su organización."},
  {num:"12",texto:"Su Palabra. En la Biblia, Jehová no solo nos dice las cosas que debemos evitar, sino también lo que tenemos que hacer para no caer en ellas. Pensemos, por ejemplo, en las palabras de Mateo 5:28, 29. Ahí Jesús habló de alguien que «sigue mirando a una mujer hasta el punto de sentir pasión por ella» y dijo que quien hace eso «ya ha cometido adulterio con ella en su corazón». ¿Cuál es la lección para nosotros?",pregunta:"12, 13. ¿Cómo podemos vencer los malos deseos?",respuesta:"Si seguimos mirando imágenes inmorales, haremos que en nuestros corazones se despierte la pasión, y cuando se presente la oportunidad lo más probable es que caigamos en la inmoralidad sexual. Para combatir los malos deseos hay que tomar medidas drásticas, como enseña Jesús: cortar de raíz lo que nos hace tropezar, porque las imágenes inmorales son como un tumor maligno que hay que eliminar."},
  {num:"13",texto:"Si seguimos mirando imágenes inmorales, haremos que en nuestros corazones se despierte la pasión. Y, si se presenta la oportunidad, lo más probable es que le demos rienda suelta a esa pasión y caigamos en la inmoralidad sexual. Para combatir los malos deseos, debemos tomar medidas drásticas. En Mateo 5:28, 29, Jesús aconseja una medida que cierto comentarista bíblico llama «el remedio quirúrgico». Las imágenes inmorales son como un tumor maligno que hay que eliminar de nuestra vida. Si obedecemos el consejo de Jesús, protegeremos nuestra amistad con Jehová.",pregunta:"12, 13. ¿Cómo podemos vencer los malos deseos?",respuesta:"Tomando medidas drásticas: eliminar de nuestra vida lo que alimenta la pasión, tal como Jesús enseñó. Si obedecemos ese consejo, protegemos nuestra amistad con Jehová."},
  {num:"14",texto:"Su espíritu santo. Jehová también usa su espíritu para ayudarnos a luchar contra los malos deseos. Si se lo pedimos constantemente, él nos lo dará. ¿Cómo nos protege el espíritu santo? El apóstol Pablo escribió: «Sigan andando de acuerdo con el espíritu y así no harán realidad ningún deseo de la carne». La nota de estudio explica: «La persona que anda de acuerdo con el espíritu es la que busca la guía del espíritu de Dios y deja que influya en su forma de pensar y actuar. Y, si tiene malos deseos, no les da vueltas en la cabeza, sino que los rechaza de inmediato». Como vemos, el espíritu de Jehová no elimina los malos deseos, pero nos da más fuerza de voluntad para resistirlos y hacer lo correcto.",pregunta:"14. ¿Cómo nos protege el espíritu santo?",respuesta:"Nos da más fuerza de voluntad para resistir los malos deseos y hacer lo correcto. No los elimina, pero si se lo pedimos constantemente, Jehová nos lo da, y así no hacemos realidad los deseos de la carne."},
  {num:"15",texto:"Su organización. Jehová se vale de su organización para darnos publicaciones que nos protegen en sentido espiritual. Debido a la imperfección, quizás a veces nos invadan pensamientos y sentimientos negativos. Puede que nos sintamos terriblemente culpables por errores pasados, pensemos que no valemos nada o vivamos consumidos por la inquietud. Satanás, «el Tentador», trata de aprovecharse de esos sentimientos para que nos alejemos de Dios. Pero la organización de Jehová nos da alimento espiritual que nos convence de que él nos perdona, de que somos valiosos a sus ojos y de que podemos confiar en su promesa de cubrir nuestras necesidades.",pregunta:"15. ¿Cómo nos protege la organización de Jehová?",respuesta:"Dándonos publicaciones que nos protegen espiritualmente. Cuando nos sentimos culpables, inútiles o angustiados, ese alimento espiritual nos convence de que Jehová nos perdona, de que somos valiosos para él y de que podemos confiar en que cubrirá nuestras necesidades."},
  {num:"16",texto:"Jehová protege físicamente a su pueblo como grupo para que no desaparezca a manos de sus enemigos. Sin embargo, ha permitido que algunos de sus siervos sufran persecución e incluso mueran para demostrar que el Diablo es un mentiroso. Pero a Satanás esas muertes le parecen pocas. A él le encantaría que nuestros enemigos acabaran con todos los siervos fieles de Dios. ¡Eso jamás sucederá! Estamos seguros de que Jehová está usando a los ángeles para proteger a su pueblo en conjunto para que la adoración pura no desaparezca de la Tierra.",pregunta:"16. ¿Qué ha permitido Jehová, y de qué estamos seguros?",respuesta:"Ha permitido que algunos de sus siervos sufran persecución e incluso mueran, para demostrar que el Diablo es un mentiroso. Pero estamos seguros de que ni Satanás ni nuestros enemigos acabarán con el pueblo de Dios como grupo: Jehová usa a los ángeles para protegerlo y para que la adoración pura no desaparezca de la Tierra."},
  {num:"17",texto:"Ahora bien, ¿nos protege físicamente Jehová a cada uno de nosotros de manera individual? Hasta cierto punto sí, pues obedecer sus normas nos evita muchas prácticas y situaciones que pueden perjudicarnos. Sin embargo, no esperamos que nos proteja ahora de absolutamente todo lo que pueda causarnos daño físico. Si lo hiciera, Satanás aprovecharía para seguir esparciendo la mentira de que solo servimos a Jehová porque nos protege. Sabemos que Jehová ha tolerado «con mucha paciencia» que los malvados nos persigan y ataquen porque, al aguantar, contribuimos a santificar su santo nombre. Pero no lo va a tolerar por mucho más tiempo.",pregunta:"17. ¿Por qué no esperamos que Jehová nos proteja ahora de todo lo que pueda causarnos daño físico?",respuesta:"Porque si nos protegiera de absolutamente todo, Satanás seguiría esparciendo la mentira de que solo servimos a Jehová por lo que nos da. Jehová ha tolerado con mucha paciencia que nos persigan, porque al aguantar contribuimos a santificar su nombre. Y no lo tolerará por mucho más tiempo."},
  {num:"18",texto:"Durante la gran tribulación, Jehová seguirá protegiendo a su pueblo en sentido espiritual. ¿Lo protegerá también físicamente? Cuando las naciones ataquen con todas sus fuerzas a los siervos de Dios, él no permitirá que acaben con ellos como grupo. Esto desencadenará la guerra de Armagedón, cuando Jehová enviará a Jesucristo y a su ejército celestial para luchar contra los enemigos de Dios. ¿Y cómo protegerá a su pueblo en el Armagedón?",pregunta:"18. ¿Cómo nos protegerá Jehová en el futuro?",respuesta:"Seguirá protegiéndonos espiritualmente durante la gran tribulación y no permitirá que las naciones acaben con su pueblo como grupo. Cuando ataquen, él enviará a Jesucristo y a su ejército celestial, y esa será la guerra de Armagedón."},
  {num:"19",texto:"No debemos sentir miedo al pensar en la destrucción de este malvado mundo en el Armagedón. ¿Por qué no? Porque confiamos en que Jehová será nuestro refugio y nuestra fortaleza. Así pues, podemos estar absolutamente convencidos de esto: cuando Jesús y su ejército celestial luchen contra los enemigos de Dios en el Armagedón, ni un solo enemigo de Dios quedará vivo. Pero, durante esa guerra, ni una sola ovejita de Jehová perderá la vida a manos de sus enemigos, ya sean seres humanos o demonios.",pregunta:"19, 20. ¿Por qué no debemos sentir miedo al pensar en la guerra de Armagedón?",respuesta:"Porque confiamos en que Jehová será nuestro refugio y nuestra fortaleza. En el Armagedón no quedará vivo ni un solo enemigo de Dios, pero ni una sola ovejita de Jehová perderá la vida a manos de sus enemigos, sean seres humanos o demonios."},
  {num:"20",texto:"Durante la guerra de Armagedón, es posible que se cumplan literalmente estas palabras del salmista: «Mil caerán a tu lado y diez mil a tu derecha, pero a ti nada de eso se te acercará. Solamente lo verás con tus ojos, cuando seas testigo del castigo de los malvados. Como tú dijiste “Jehová es mi refugio”, has hecho del Altísimo tu lugar de residencia». Una vez que empiece el Armagedón, podemos esperar que Jehová proteja física, emocional y espiritualmente a sus siervos como grupo y también individualmente. Como escribió el salmista, a todo aquel que dice «Jehová es mi refugio» él le promete «A ti nada de eso se te acercará». Por lo tanto, no tenemos ningún miedo de lo que pasará en el futuro, pues confiamos totalmente en que Jehová nos protegerá.",pregunta:"19, 20. ¿Por qué no debemos sentir miedo al pensar en la guerra de Armagedón?",respuesta:"Porque Jehová cumplirá su promesa: a quien dice «Jehová es mi refugio» le asegura «A ti nada de eso se te acercará». Él protegerá a sus siervos física, emocional y espiritualmente, como grupo y también individualmente. Por eso no tenemos miedo del futuro."}
]};

function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var K_WEEK="prep2:semana";
/* Campos de texto válidos de la semana. Un respaldo antiguo guarda `week` como
   texto (solo la etiqueta): pasarlo a Object.assign esparciría sus caracteres. */
var WEEK_FIELDS=["key","label","shortLabel","reading","fetched","program","url"];
function normalizeWeek(w){
  var out={};
  if(w&&typeof w==="object"&&!Array.isArray(w)){
    for(var i=0;i<WEEK_FIELDS.length;i++){var k=WEEK_FIELDS[i];if(typeof w[k]==="string")out[k]=w[k];}
  }else if(typeof w==="string"){
    out.shortLabel=w;
  }
  return out;
}
function normalizeParts(p){
  if(!Array.isArray(p))return null;
  var out=[];
  for(var i=0;i<p.length;i++){if(p[i]&&typeof p[i]==="object"&&!Array.isArray(p[i]))out.push(p[i]);}
  return out.length?out:null;
}
/* Combina el fin de semana importado sobre el actual: nunca deja secciones ni
   `parrafos` con un tipo inesperado. */
function mergeWeekend(w){
  if(!w||typeof w!=="object"||Array.isArray(w))return null;
  var out=JSON.parse(JSON.stringify(WEEKEND));
  ["discursoPublico","atalaya"].forEach(function(sec){
    var src=w[sec];
    if(!src||typeof src!=="object"||Array.isArray(src))return;
    for(var k in src){
      if(k==="parrafos"){if(Array.isArray(src[k]))out[sec].parrafos=src[k];}
      else if(typeof src[k]==="string")out[sec][k]=src[k];
    }
  });
  return out;
}
function weekSnapshot(){
  var out={};
  for(var i=0;i<WEEK_FIELDS.length;i++){var k=WEEK_FIELDS[i];if(typeof WEEK[k]==="string")out[k]=WEEK[k];}
  return out;
}
function validWeekKey(k){
  if(typeof k!=="string"||k.length!==10||k.charAt(4)!=="-"||k.charAt(7)!=="-")return false;
  for(var i=0;i<10;i++){
    if(i===4||i===7)continue;
    var c=k.charAt(i);
    if(c<"0"||c>"9")return false;
  }
  return true;
}
var WEEK_DEFAULT=JSON.parse(JSON.stringify(WEEK));
var PARTS_DEFAULT=JSON.parse(JSON.stringify(PARTS));
var WEEKEND_DEFAULT=JSON.parse(JSON.stringify(WEEKEND));
(function loadWeekData(){

  var p=normalizeParts(s.parts);if(p)PARTS=p;
  var wk=mergeWeekend(s.weekend);if(wk)WEEKEND=wk;
})();

var K_TIMER="prep2:timer",K_TICK="prep2:timerpos";
var TIMER=lsGet(K_TIMER,{running:false,startAt:0,accumulated:0,assigned:600,label:""});
var TPOS=lsGet(K_TICK,null);
var TIMER_INT=null,TIMER_EXPANDED=false;
function timerElapsedMs(){if(TIMER.running)return TIMER.accumulated+(Date.now()-TIMER.startAt);return TIMER.accumulated;}
function fmtMs(ms){if(ms<0)ms=0;var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;}
function ensurePos(){if(TPOS)return;var w=window.innerWidth,h=window.innerHeight;TPOS={x:Math.max(8,w-90),y:Math.max(8,h-220)};lsSet(K_TICK,TPOS);}
function clampPos(box){var w=window.innerWidth,h=window.innerHeight;var bw=box.offsetWidth||74,bh=box.offsetHeight||74;TPOS.x=Math.max(6,Math.min(w-bw-6,TPOS.x));TPOS.y=Math.max(6,Math.min(h-bh-6,TPOS.y));}
function applyPos(box){ensurePos();clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";box.style.right="auto";box.style.bottom="auto";}
function timerTick(){
  lsSet(K_TIMER,TIMER);
  var box=document.getElementById("timerbox");if(!box)return;
  if(!TIMER.label){box.classList.remove("show");return;}
  box.classList.add("show");
  var el=timerElapsedMs();var remain=TIMER.assigned*1000-el;var over=remain<0;
  box.classList.toggle("over",over);
  if(TIMER_EXPANDED){
    box.classList.add("expanded");
    box.innerHTML='<button class="tclose" data-act="t-close">×</button><div class="ttitle">'+esc(TIMER.label)+'</div><div class="tgrid"><div class="tbig">'+fmtMs(el)+'</div><div class="grow"><div class="tmini">Asignado: <b>'+fmtMs(TIMER.assigned*1000)+'</b></div><div class="tmini">Restante: <b>'+(over?'+'+fmtMs(-remain):fmtMs(remain))+'</b></div></div></div><div class="row" style="margin-top:10px">'+(TIMER.running?'<button class="btn sm primary grow" data-act="t-pause">PAUSAR</button>':(TIMER.accumulated>0?'<button class="btn sm primary grow" data-act="t-resume">CONTINUAR</button>':'<button class="btn sm primary grow" data-act="t-start">INICIAR</button>'))+'<button class="btn sm grow" data-act="t-reset">REINICIAR</button></div>';
  }else{box.classList.remove("expanded");box.textContent=fmtMs(el);}
  attachDrag(box);applyPos(box);
}
function attachDrag(box){
  if(box.dataset.dragInit==="1")return;box.dataset.dragInit="1";
  var sx,sy,sl,st,dragging=false,moved=false;
  box.addEventListener("pointerdown",function(e){if(e.target.closest("button"))return;dragging=true;moved=false;sx=e.clientX;sy=e.clientY;sl=TPOS.x;st=TPOS.y;try{box.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();});
  box.addEventListener("pointermove",function(e){if(!dragging)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>8)moved=true;TPOS.x=sl+dx;TPOS.y=st+dy;clampPos(box);box.style.left=TPOS.x+"px";box.style.top=TPOS.y+"px";});
  box.addEventListener("pointerup",function(){if(!dragging)return;dragging=false;lsSet(K_TICK,TPOS);if(!moved){TIMER_EXPANDED=!TIMER_EXPANDED;timerTick();}});
  box.addEventListener("pointercancel",function(){dragging=false;});
}
function timerEnsureInterval(){if(TIMER_INT)return;TIMER_INT=setInterval(timerTick,250);}
function timerOpen(label,assignedMin){TIMER.label=label;TIMER.assigned=(assignedMin||10)*60;if(!TIMER.running&&TIMER.accumulated===0)TIMER.startAt=0;TIMER_EXPANDED=false;timerEnsureInterval();timerTick();}
function timerStart(){TIMER.running=true;TIMER.startAt=Date.now();timerTick();}
function timerPause(){if(TIMER.running){TIMER.accumulated+=Date.now()-TIMER.startAt;TIMER.running=false;}timerTick();}
function timerReset(){TIMER.running=false;TIMER.accumulated=0;TIMER.startAt=0;timerTick();}
function timerClose(){TIMER.running=false;TIMER.accumulated=0;TIMER.startAt=0;TIMER.label="";TIMER_EXPANDED=false;timerTick();}

function detectType(p){
  if(!/^p([0-9]|10)$/.test(p.id))return {k:"otra",label:"otra parte"};
  var s=p.section,t=(p.title+" "+(p.raw||"")).toLowerCase();
  if(s==="INICIO")return {k:"inicio",label:"Canción, oración y palabras de introducción"};
  if(s==="TESOROS DE LA BIBLIA"){
    if(/perlas escondidas/.test(t))return {k:"perlas",label:"Busquemos perlas escondidas"};
    if(/lectura de la biblia/.test(t))return {k:"lectura",label:"Lectura de la Biblia"};
    return {k:"tesoros",label:"Tesoros de la Biblia (discurso)"};
  }
  if(s==="SEAMOS MEJORES MAESTROS"){
    if(/de casa en casa/.test(t))return {k:"maestros",sub:p.id,label:"De casa en casa"};
    if(/predicación informal/.test(t))return {k:"maestros",sub:p.id,label:"Predicación informal"};
    if(/predicación pública/.test(t))return {k:"maestros",sub:p.id,label:"Predicación pública"};
    if(/explique sus creencias/.test(t))return {k:"maestros",sub:p.id,label:"Explique sus creencias"};
    if(/discurso/.test(t))return {k:"maestros",sub:p.id,label:"Discurso"};
    return {k:"maestros",sub:p.id,label:"Otra asignación"};
  }
  if(s==="NUESTRA VIDA CRISTIANA"){
    if(/estudio bíblico de la congregación/.test(t))return {k:"estudio",label:"Estudio bíblico"};
    if(/video|auditorio|viudas/.test(t))return {k:"vida",label:"Análisis con el auditorio (con video)"};
    if(/conclusión/.test(t))return {k:"inicio",label:"Palabras de conclusión"};
    return {k:"vida",label:"Otra actividad"};
  }
  return {k:"otra",label:"Otra parte"};
}

function discursoActual(){
  var d=(typeof DISCURSO_T1!=="undefined"&&DISCURSO_T1)?DISCURSO_T1:{};

    title:d.title||"Discurso de esta semana",

    intro:d.intro||"",

}
function discSeedFields(){
  var d=discursoActual();

  out["p1.d.titulo"]=d.title;
  out["p1.d.duracion"]=d.duration;
  out["p1.d.intro"]=d.intro;
  d.desarrollo.forEach(function(dv,i){
    out["p1.d.p"+i+".titulo"]=dv.titulo||"";
    if(dv.texto){
      out["p1.d.p"+i+".t.ref"]=dv.texto.ref||"";
      out["p1.d.p"+i+".t.intro"]=dv.texto.intro||"";

      out["p1.d.p"+i+".t.explicacion"]=dv.texto.explicacion||"";

    out["p1.d.p"+i+".apoyo"]=dv.apoyo||"";
    out["p1.d.p"+i+".leccion"]=dv.leccion||"";
  });
  out["p1.d.aplicacion"]=d.aplicacion;
  out["p1.d.conclusion"]=d.conclusion;

}

/* Quita el BOM y espacios iniciales: JSON.parse falla con \uFEFF. */
function cleanJsonText(t){
  t=String(t==null?"":t);
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  return t.replace(/^\s+/,"");
}
/* Acepta tanto el respaldo propio como el volcado de semana ({week,parts,weekend}). */
function applyBackupData(data,source){
  if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("El archivo no contiene un respaldo válido");
  var aplicado=false;
  if(data.v&&typeof data.v==="object"&&!Array.isArray(data.v)){S.v=Object.assign({},S.v,data.v);aplicado=true;}
  if(Array.isArray(data.saved)){lsSet(K_SAVED,data.saved);aplicado=true;}
  if(Array.isArray(data.discursos)){lsSet(K_DISC,data.discursos);aplicado=true;}
  if("week" in data||"parts" in data||"weekend" in data){
    var week=normalizeWeek(data.week);
    /* respaldo antiguo: `week` era texto y el dato útil estaba en weekKey */
    var desdeObjeto=!!week.key;
    if(!week.key&&validWeekKey(data.weekKey))week.key=data.weekKey;
    if(week.key&&(!week.label||!week.shortLabel)){
      var wl=weekLabels(week.key);
      if(wl){
        if(!desdeObjeto)week.key=wl.key;
        if(!week.label)week.label=wl.label;
        if(!week.shortLabel)week.shortLabel=wl.shortLabel;
      }
    }
    for(var kw in week)WEEK[kw]=week[kw];
    var parts=normalizeParts(data.parts);if(parts)PARTS=parts;
    var weekend=mergeWeekend(data.weekend);if(weekend)WEEKEND=weekend;
    /* se guarda siempre la forma completa y normalizada, para que al recargar
       loadWeekData la lea sin romperse */
    lsSet(K_WEEK,{week:weekSnapshot(),parts:PARTS,weekend:WEEKEND});
    aplicado=true;
  }
  if(!aplicado)throw new Error("El archivo no tiene datos de respaldo reconocibles");
  /* después de fijar WEEK: si no, K_CUR queda con el weekKey viejo y al
     recargar se descartarían los datos importados */
  persistNow();
  var campos=0;for(var kc in S.v){if(S.v[kc])campos++;}
  render();
  toast("Respaldo importado ✓"+(campos?" ("+campos+" campos)":""));
  return true;
}
function importBackupText(text,sourceName){
  var data;
  try{data=JSON.parse(cleanJsonText(text));}
  catch(err){toast("Archivo inválido: no es un JSON válido");return false;}
  if(S.v&&Object.keys(S.v).some(function(k){return S.v[k];})){
    if(!window.confirm("Se reemplazarán los datos de esta semana en este dispositivo.\n\n¿Importar "+(sourceName||"el respaldo")+"?"))return false;
  }
  try{return applyBackupData(data,sourceName);}
  catch(err){toast("Archivo inválido: "+err.message);return false;}
}
function readFileAsText(file,onDone){
  var r=new FileReader();
  var done=false;
  function finish(ok,payload){
    if(done)return;done=true;
    try{r.abort();}catch(e){}
    onDone(ok,payload);
  }
  r.onload=function(){
    var text=r.result;
    if(typeof text!=="string"){
      try{text=new TextDecoder("utf-8").decode(text);}catch(e){text=String(text||"");}
    }
    finish(true,text);
  };
  r.onerror=function(){finish(false,"No se pudo leer el archivo");};
  r.onabort=function(){finish(false,"Lectura cancelada");};
  try{r.readAsText(file,"utf-8");}
  catch(err){finish(false,"El navegador no pudo abrir el archivo");}
}
function importBackup(){
  var inp=document.createElement("input");
  inp.type="file";
  /* accept amplio: en Android el selector oculta .json si solo se declara application/json */
  inp.accept=".json,application/json,application/octet-stream,text/plain,text/*,*/*";
  inp.multiple=false;
  inp.setAttribute("aria-label","Selecciona el archivo de respaldo");
  inp.style.cssText="position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;";
  var cleaned=false;
  function cleanup(){if(cleaned)return;cleaned=true;if(inp.parentNode)inp.parentNode.removeChild(inp);}
  inp.addEventListener("change",function(){
    var f=inp.files&&inp.files[0];
    inp.value="";           /* permite volver a elegir el mismo archivo */
    if(!f){cleanup();return;}
    readFileAsText(f,function(ok,text){
      cleanup();
      if(!ok){toast("Archivo inválido: "+(text||"no se pudo leer"));return;}
      importBackupText(text,f.name);
    });
  });
  inp.addEventListener("cancel",cleanup);
  document.body.appendChild(inp);
  inp.click();
}
/* Recibe el JSON que Android envía por «Compartir» (share_target del manifest). */
function consumeSharedBackup(){
  if(!("caches" in window))return;
  caches.open(SHARE_CACHE).then(function(c){
    return c.match(shareKeyURL()).then(function(res){
      if(!res)return;
      return res.text().then(function(text){
        try{history.replaceState(null,"",location.pathname+location.hash);}catch(e){}
        var ok=importBackupText(text,"el archivo compartido");
        /* solo se vacía la bandeja si la importación se aplicó */
        if(ok)c.delete(shareKeyURL());
      });
    });
  }).catch(function(){});
}
/* Escritorio: abrir el .json con la app (file_handlers del manifest). */
function consumeLaunchedFiles(){
  if(!("launchQueue" in window)||!window.launchQueue.setConsumer)return;
  window.launchQueue.setConsumer(function(params){
    if(!params||!params.files||!params.files.length)return;
    var f=params.files[0];
    Promise.resolve(f.getFile?f.getFile():f).then(function(file){
      if(file&&file.text)return file.text();
      return new Promise(function(resolve,reject){readFileAsText(file,function(ok,t){ok?resolve(t):reject(new Error(t));});});
    }).then(function(text){importBackupText(text,f.name||"archivo");}).catch(function(){toast("No se pudo abrir el archivo");});
  });
}

function generarRespuestaBorrador(pregunta,parrafo){
  if(!parrafo)return "";
  var oraciones=parrafo.split(/(?<=[.!?])\s+/).filter(function(o){return o.length>25;});
  var base=oraciones.slice(0,2).join(" ").trim();
  if(!base)base=parrafo.slice(0,220);
  return base;
}
/* ============ EDITOR DE SEMANA ============ */
function weekLabels(key){
  var p=key.split("-");var x=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(x.getTime()))return null;
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  var e=new Date(x.getFullYear(),x.getMonth(),x.getDate()+6);
  var same=(x.getMonth()===e.getMonth());
  var label=same?x.getDate()+"–"+e.getDate()+" de "+MESES[x.getMonth()]+" de "+x.getFullYear():x.getDate()+" de "+MESES[x.getMonth()]+" – "+e.getDate()+" de "+MESES[e.getMonth()]+" de "+e.getFullYear();
  var shortLabel=same?x.getDate()+"–"+e.getDate()+" "+MESES[x.getMonth()]+" "+x.getFullYear():x.getDate()+" "+MESES[x.getMonth()]+" – "+e.getDate()+" "+MESES[e.getMonth()]+" "+e.getFullYear();
  return {key:x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()),label:label,shortLabel:shortLabel};
}

function wkInput(k,label,v){return '<label for="w-'+esc(k)+'">'+esc(label)+'</label><input type="text" id="w-'+esc(k)+'" data-wk="'+esc(k)+'" value="'+esc(v==null?"":v)+'">';}
function wkArea(k,label,v){return '<label for="w-'+esc(k)+'">'+esc(label)+'</label><textarea id="w-'+esc(k)+'" data-wk="'+esc(k)+'" style="min-height:70px">'+esc(v==null?"":v)+'</textarea>';}
/* Lee los campos del editor en memoria (no guarda). Devuelve false si hay un dato inválido. */
function weekFromDOM(){
  var g=function(k,def){var el=document.querySelector('[data-wk="'+k+'"]');return el?el.value:def;};
  var raw=String(g("key",WEEK.key)||"").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)){toast("La fecha debe tener formato AAAA-MM-DD");return false;}
  var wl=weekLabels(raw);
  if(!wl){toast("Fecha no válida");return false;}
  WEEK.key=wl.key;WEEK.label=wl.label;WEEK.shortLabel=wl.shortLabel;
  WEEK.reading=g("reading",WEEK.reading);WEEK.program=g("program",WEEK.program);
  PARTS.forEach(function(p,i){
    p.section=g("p"+i+".section",p.section);
    var n=String(g("p"+i+".num","")).trim();if(n)p.num=n;else delete p.num;
    p.title=g("p"+i+".title",p.title);
    p.min=Math.max(1,parseInt(g("p"+i+".min",p.min),10)||1);
    var r=String(g("p"+i+".raw","")||"");if(r.trim())p.raw=r;else delete p.raw;
  });
  WEEKEND.discursoPublico.title=g("wk.dp.title",WEEKEND.discursoPublico.title);
  WEEKEND.discursoPublico.speaker=g("wk.dp.speaker",WEEKEND.discursoPublico.speaker);
  WEEKEND.atalaya.title=g("wk.at.title",WEEKEND.atalaya.title);
  WEEKEND.atalaya.openingSong=g("wk.at.open",WEEKEND.atalaya.openingSong);
  WEEKEND.atalaya.baseText=g("wk.at.base",WEEKEND.atalaya.baseText);
  WEEKEND.atalaya.closingSong=g("wk.at.close",WEEKEND.atalaya.closingSong);
  return true;
}

/* ============ EXPORTAR Y COPIAR ============
   Una sola fuente de texto por sección: lo editado por el usuario (S.v) con respaldo
   en las constantes de la semana. Así Copiar, PDF y Compartir nunca salen vacíos. */
function pushRefs(L,p){if(p.refs&&p.refs.length)L.push("Referencias: "+p.refs.map(function(r){return r.t;}).join(" · "));}
function pushNotes(L,pre){var n=val(pre+"notas","");if(n){L.push("");L.push("NOTAS PERSONALES");L.push(n);}}
function headerLines(p){
  var L=[p.section.toUpperCase(),(p.num?p.num+". ":"")+p.title,"Duración: "+p.min+" min"];
  if(p.raw)L.push(p.raw);
  pushRefs(L,p);
  return L;
}
function perlasText(p){
  var L=headerLines(p);
  L.push("");L.push("PREGUNTA 1: "+PERLA1.q);
  L.push("Versículos: "+PERLA1.verses.map(function(v){return v.t;}).join("; "));
  L.push("Publicación: "+PERLA1.pubs.map(function(v){return v.t;}).join("; "));
  L.push("");L.push("MI RESPUESTA");L.push(val("p2.q1.draft",PERLA1.draft));
  L.push("");L.push("INFORMACIÓN ENCONTRADA");
  PERLA1.found.forEach(function(f){L.push("• "+f);});
  L.push("");L.push("PREGUNTA 2: "+PERLA2_Q);
  var picks=[];
  for(var i=0;i<PUNTOS.length;i++){if(S.v["p2.pick."+i])picks.push(i);}
  if(!picks.length){for(var j=0;j<PUNTOS.length;j++)picks.push(j);L.push("(Se incluyen todos los puntos; todavía no has marcado ninguno.)");}
  picks.forEach(function(idx){var pt=PUNTOS[idx];L.push("");L.push(idx+1+") "+pt.v+" — "+pt.idea);L.push("Aprendemos: "+pt.aprendemos);L.push("Aplicación: "+pt.aplicar);L.push("Fuente: "+pt.ref);});
  var r=val("p2.respuesta","");if(r){L.push("");L.push("MI RESPUESTA PREPARADA");L.push(r);}
  pushNotes(L,p.id+".");
  return L.join("\n");
}
function lecturaText(p){
  var L=headerLines(p);
  L.push("");L.push("PASAJE: "+LECTURA_P3.pasaje+" (Traducción del Nuevo Mundo)");
  L.push("");L.push(LECTURA_P3.textoCompleto);
  L.push("");L.push("LECCIÓN: "+LECTURA_P3.leccion);
  LECTURA_P3.consejos.forEach(function(c){L.push("• "+c);});
  pushNotes(L,p.id+".");
  return L.join("\n");
}
function maestrosText(p){
  var M=MAESTROS[p.id]||MAESTROS.p4,pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("LECCIÓN A DEMOSTRAR");L.push(M.leccion);
  L.push("");L.push("MARCO DE CIRCUNSTANCIAS");L.push(val(pre+"marco",M.marco));
  L.push("");L.push("OBJETIVO");L.push(val(pre+"objetivo",M.objetivo));
  L.push("");L.push("TEMA");L.push(val(pre+"tema",M.tema));
  L.push("");L.push("TEXTO BÍBLICO");L.push(val(pre+"texto",M.texto));
  L.push("");L.push("CONVERSACIÓN");L.push(val(pre+"dialogo",M.dialogo));
  L.push("");L.push("PUNTOS A DEMOSTRAR");M.demostrar.forEach(function(x){L.push("✓ "+x);});
  L.push("");L.push("CIERRE");L.push(val(pre+"conclusion",M.conclusion));
  pushNotes(L,pre);
  return L.join("\n");
}
function vidaText(p){
  var pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("INTRODUCCIÓN DEL CONDUCTOR");L.push(val(pre+"introGuion",VIDA_P8.introGuion));
  L.push("");L.push("VIDEO: "+VIDA_P8.video.t);L.push(VIDA_P8.video.u);
  VIDA_P8.preguntas.forEach(function(qa,i){L.push("");L.push("PREGUNTA "+(i+1)+": "+qa.q);L.push("Respuesta: "+val(pre+"a"+i,qa.respuesta));});
  L.push("");L.push("APLICACIÓN PRÁCTICA");L.push(val(pre+"aplicacion",VIDA_P8.aplicacion));
  L.push("");L.push("CIERRE");L.push(val(pre+"cierre",VIDA_P8.cierre));
  pushNotes(L,pre);

}
function estudioText(p){
  var pre=p.id+".";
  var L=headerLines(p);
  L.push("");L.push("FUENTE: "+ESTUDIO_P9.fuente.t);L.push(ESTUDIO_P9.libro);
  L.push("");L.push("TEXTOS DESTACADOS");
  ESTUDIO_P9.textosDestacados.forEach(function(t,i){L.push((i+1)+") "+val(pre+"t"+i+".ref",t.ref));L.push(val(pre+"t"+i+".texto",t.texto));L.push("");});
  L.push("PREGUNTAS PARA DIRIGIR EL ESTUDIO");
  ESTUDIO_P9.preguntas.forEach(function(qa,i){L.push("");L.push("Pregunta "+(i+1)+": "+val(pre+"q"+i,qa.q));L.push("Respuesta: "+val(pre+"a"+i,qa.a));});
  pushNotes(L,pre);
  return L.join("\n");
}
function parteSimpleText(p){
  var L=headerLines(p);
  pushNotes(L,p.id+".");
  return L.join("\n");
}
/* El texto de cada parte se decide por su TIPO (detectType), no por su numero.
   Asi el programa puede cambiar de una semana a otra sin romper Copiar/PDF. */
function partText(p){
  if(!p)return "";
  var k=detectType(p).k;
  if(k==="tesoros")return (p.id==="p1")?buildDiscursoTexto():parteSimpleText(p);
  if(k==="perlas")return perlasText(p);
  if(k==="lectura")return lecturaText(p);
  if(k==="maestros")return maestrosText(p);
  if(k==="estudio")return estudioText(p);
  if(k==="vida")return (typeof VIDA_P8!=="undefined"&&VIDA_P8&&VIDA_P8.activa)?vidaText(p):parteSimpleText(p);
  return parteSimpleText(p);
}
function atalayaText(){
  var L=["ESTUDIO DE LA ATALAYA","Semana del "+WEEK.label];
  L.push("Artículo: "+val("atalaya.titulo",WEEKEND.atalaya.title));
  L.push("Texto base: "+val("atalaya.textoBase",WEEKEND.atalaya.baseText));
  L.push("Canciones: "+val("atalaya.canciones","Canción inicial: "+WEEKEND.atalaya.openingSong+" · Canción final: "+WEEKEND.atalaya.closingSong));
  if(ATALAYA.intro){L.push("");L.push(ATALAYA.intro);}
  ATALAYA.parrafos.forEach(function(pr,i){
    L.push("");L.push("Párrafo "+(pr.num||i+1));
    L.push(val("atalaya.p"+i+".texto",pr.texto));

  if(ci){L.push("");L.push("CIERRE");L.push(ci);}
  return L.join("\n");
}
function copyToClipboard(text){
  var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);toast("Texto copiado ✓");
}
function whatsappShare(title,text){
  var msg=text;if(title&&text.indexOf(title)!==0)msg=title+"\n\n"+text;
  var url="https://wa.me/?text="+encodeURIComponent(msg);
  var w=window.open(url,"_blank");
  if(!w)toast("Permite las ventanas emergentes para compartir");
}
function shareText(title,text){
  if(!text||!String(text).replace(/\s+/g,"").length){toast("No hay texto para compartir");return;}
  if(navigator.share){
    try{
      var pr=navigator.share({title:title,text:text});
      if(pr&&pr.catch)pr.catch(function(err){if(err&&err.name==="AbortError")return;whatsappShare(title,text);});
      return;
    }catch(e){/* sigue al respaldo */}
  }
  whatsappShare(title,text);
}
function openPrint(title,text){
  if(!text||!String(text).replace(/\s+/g,"").length)text="(No hay texto para mostrar en esta sección.)";
  var old=document.getElementById("printOverlay");if(old&&old.parentNode)old.parentNode.removeChild(old);
  var ov=document.createElement("div");ov.id="printOverlay";
  ov.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;background:#FFF;color:#1B2A3A;z-index:100;padding:20px;overflow:auto;";
  var bar=document.createElement("div");bar.className="print-toolbar";
  bar.style.cssText="position:sticky;top:0;background:#FFF;padding:10px;border-bottom:1px solid #D5DDE4;text-align:right;margin-bottom:20px;";

  var bC=document.createElement("button");bC.textContent="Cerrar";
  bC.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:1px solid #D5DDE4;background:#FFF;color:#1B2A3A;cursor:pointer;";
  bC.onclick=function(){if(ov.parentNode)ov.parentNode.removeChild(ov);};
  var bS=document.createElement("button");bS.textContent="Compartir";
  bS.style.cssText="font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;background:#2E7D4F;color:#FFF;cursor:pointer;margin-right:8px;";
  bS.onclick=function(){shareText(title,text);};
  bar.appendChild(bP);bar.appendChild(bS);bar.appendChild(bC);
  var h1=document.createElement("h1");h1.style.cssText="font-family:Georgia,serif;font-size:22px;margin:0 0 16px;color:#1B2A3A;";h1.textContent=title;

  ov.appendChild(bar);ov.appendChild(h1);ov.appendChild(pre);ov.appendChild(foot);document.body.appendChild(ov);
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.confirm&&!b.dataset.armed){
    b.dataset.armed="1";b.dataset.label=b.textContent;b.textContent="¿Seguro? Toca otra vez";b.classList.add("armed");
    setTimeout(function(){if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove("armed");}},3000);
    return;
  }
  var fn=actions[b.dataset.act];if(fn)fn(b);
});

function onField(e){
  var el=e.target,k=el.dataset&&el.dataset.k;if(!k)return;
  if(el.type==="checkbox"){S.v[k]=el.checked?"1":"";var n=document.getElementById("pickN");if(n)n.textContent=pickedCount();}
  else{S.v[k]=el.value;}
  persist();
}
function onFieldBlur(e){
  var el=e.target;if(el.dataset&&el.dataset.k){persistNow();}
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
document.addEventListener("blur",onFieldBlur,true);

(function seed(){var seed=discSeedFields();for(var k in seed){if(!(k in S.v)||S.v[k]==="")S.v[k]=seed[k];}})();
(function restoreAtalaya(){var t=parseInt(S.v["atalaya.total"],10)||0;while(ATALAYA.parrafos.length<t){var i=ATALAYA.parrafos.length;ATALAYA.parrafos.push({num:String(i+1),texto:"",pregunta:"",respuesta:""});}})();

render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      /* recoger el archivo compartido en cuanto el SW controle la página */
      if(navigator.serviceWorker.controller)consumeSharedBackup();
      else if(reg&&reg.active)reg.active.postMessage({type:"ping"});
    }).catch(function(){});
    navigator.serviceWorker.addEventListener("controllerchange",consumeSharedBackup);
  });
}
/* al abrir desde «Compartir» en Android, Android añade el archivo antes de cargar la página */
window.addEventListener("load",function(){consumeSharedBackup();});
consumeLaunchedFiles();
})();
